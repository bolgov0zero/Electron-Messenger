<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: file: http: https:; media-src 'self' data: blob: file: http: https:; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-src 'none'">
<title>Просмотр</title>
<link rel="stylesheet" href="assets/fonts/medeo-sans/medeo-sans.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  /* Плоский дизайн B. Окно прозрачное (см. main.js): тёмная плёнка рисуется здесь, как в веб клиенте (#lightbox),
     сквозь неё чуть видно то, что было на экране. Кнопки — плоские полупрозрачные белые, радиус 12, без стекла и размытия */
  :root { --lb-btn: rgba(255,255,255,.14); --lb-btn-h: rgba(255,255,255,.26); --lb-r: 12px; }
  body {
    width: 100%; height: 100%; background: rgba(8,8,10,.88); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-out; -webkit-user-select: none; user-select: none;
    font-family: "Medeo Sans", Inter, -apple-system, system-ui, sans-serif; color: #fff;
    animation: bgIn 150ms ease-out;
  }
  body.closing { animation: bgOut 150ms ease-in forwards; }
  @keyframes bgIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bgOut { from { opacity: 1; } to { opacity: 0; } }

  img, video { max-width: 100vw; max-height: 100vh; object-fit: contain; border-radius: var(--lb-r); box-shadow: 0 8px 40px rgba(0,0,0,.55); }
  /* :not(.opened) снимает анимацию сразу после её конца — иначе её «forwards»-значение
     transform держится с более высоким приоритетом, чем inline-стиль, и зум не работает */
  body:not(.opened) img, body:not(.opened) video { animation: mediaIn 220ms cubic-bezier(.34,1.56,.64,1) forwards; }
  body.closing img, body.closing video { animation: mediaOut 150ms ease-in forwards; }
  @keyframes mediaIn  { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: scale(1); } }
  @keyframes mediaOut { from { opacity: 1; transform: scale(1); }   to { opacity: 0; transform: scale(.88); } }

  video { display: none; }
  body.video img { display: none; }
  body.video video { display: block; }
  body.video .zoom { display: none; }
  body.zoomed img { cursor: grab; }
  body.zoomed img:active { cursor: grabbing; }

  /* все кнопки: плоский полупрозрачный фон, без рамки, тени и размытия */
  .nav, .act, #cl, #dl, .zoom button {
    border: 0; border-radius: var(--lb-r); background: var(--lb-btn); color: #fff; cursor: pointer; box-shadow: none;
    display: flex; align-items: center; justify-content: center; transition: background .15s, transform .15s;
  }
  .nav:hover, .act:hover, #cl:hover, #dl:hover, .zoom button:hover { background: var(--lb-btn-h); }
  .nav:active, .act:active, #cl:active, #dl:active, .zoom button:active { transform: scale(.95); }
  .nav:active { transform: translateY(-50%) scale(.95); }
  #cl, #dl, .act, .zoom button { width: 40px; height: 40px; }
  #cl { position: absolute; top: 24px; right: 24px; }
  #dl { position: absolute; top: 24px; right: 72px; }
  .act { position: absolute; top: 24px; display: none; }
  #fw { right: 120px; } #rm { right: 168px; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; display: none; }
  body.gallery .nav { display: flex; }
  #prev { left: 24px; } #next { right: 24px; }
  #info { position: absolute; top: 22px; left: 24px; font-size: 14px; display: none; flex-direction: column; line-height: 1.25; background: var(--lb-btn); padding: 8px 14px; border-radius: var(--lb-r); max-width: 40vw; }
  #info b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #info span { font-size: 12px; opacity: .75; }
  #bottom { position: absolute; left: 0; right: 0; bottom: 84px; display: none; flex-direction: column; align-items: center; gap: 10px; padding: 0 90px; pointer-events: none; }
  #cap { font-size: 14px; text-align: center; max-width: 640px; background: var(--lb-btn); padding: 7px 16px; border-radius: var(--lb-r); pointer-events: auto; cursor: default; }
  #thumbs { display: flex; gap: 6px; pointer-events: auto; }
  #thumbs i { width: 40px; height: 40px; border-radius: 8px; background: #222 center / cover; opacity: .55; cursor: pointer; transition: opacity .15s; }
  #thumbs i.on { opacity: 1; outline: 2px solid #fff; outline-offset: 2px; } #thumbs i:hover { opacity: .9; }
  #count { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); height: 28px; padding: 0 14px; align-items: center; font-size: 13px; font-weight: 600; background: var(--lb-btn); border-radius: 10px; display: none; }
  body.gallery #count { display: flex; }
  .zoom { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
</style>
</head>
<body>
  <button class="nav" id="prev" type="button" title="Назад" data-on-click="__h41"><svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="nav" id="next" type="button" title="Дальше" data-on-click="__h42"><svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <div id="count"></div>
  <div id="info"></div>
  <button class="act" id="fw" type="button" title="Переслать" data-on-click="__h43"><svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg></button>
  <button class="act" id="rm" type="button" title="Удалить" data-on-click="__h44"><svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
  <div id="bottom"><div id="cap"></div><div id="thumbs"></div></div>
  <img id="img">
  <video id="vid" controls playsinline></video>
  <div class="zoom">
    <button type="button" title="Уменьшить" data-on-click="__h45"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg></button>
    <button type="button" title="Сбросить масштаб" data-on-click="__h46"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button type="button" title="Увеличить" data-on-click="__h47"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg></button>
  </div>
  <button id="cl" type="button" title="Закрыть (Esc)" data-on-click="__h48"><svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <button id="dl" title="Скачать" data-on-click="__h49">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
  </button>
<script src="act.js"></script>
<script src="actions.js"></script>
<script src="lightbox.js"></script>
</body>
</html>
