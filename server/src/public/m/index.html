<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" id="meta-theme-color" content="#17212b">
  <title>Electron</title>
  <link rel="stylesheet" href="/m/style.css">
</head>
<body>

<!-- ══ LOGIN ══ -->
<div class="screen-login" id="screen-login">
  <div class="login-box">
    <div class="login-logo">💬</div>
    <div class="login-title">Electron</div>
    <div class="login-sub">Войдите в аккаунт</div>
    <input id="l-username" type="text" placeholder="Логин" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false">
    <input id="l-password" type="password" placeholder="Пароль" autocomplete="current-password">
    <div class="login-err" id="l-err"></div>
    <button class="login-btn" id="l-btn" onclick="doLogin()">Войти</button>
  </div>
</div>

<!-- ══ MAIN ══ -->
<div class="screen-main" id="screen-main" style="display:none">

  <div class="screens-wrap" id="screens-wrap">

    <!-- ── LIST layer ── -->
    <div class="layer" id="layer-list">
      <div class="topbar" style="background:var(--surface)">
        <div class="tb-title">Чаты</div>
        <button class="tb-btn" onclick="openSearch()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
      <div class="search-bar" id="search-bar" style="display:none">
        <div class="search-inner">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search-input" placeholder="Поиск" oninput="onSearch(this.value)">
          <button class="search-cancel" onclick="closeSearch()">Отмена</button>
        </div>
      </div>
      <div class="chat-list" id="chat-list">
        <div class="spinner-wrap" id="chat-list-spinner"><div class="spinner"></div></div>
      </div>
      <button class="fab" onclick="showNewChat()" title="Новый чат">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>

    <!-- ── SUBROOMS layer ── -->
    <div class="layer layer-slide" id="layer-subrooms">
      <div class="topbar" style="background:var(--surface)">
        <button class="tb-btn" onclick="closeSubrooms()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="tb-chat-info" id="subrooms-hdr"></div>
      </div>
      <div class="chat-list" id="subrooms-list"></div>
    </div>

    <!-- ── CHAT layer ── -->
    <div class="layer layer-slide" id="layer-chat" style="background:var(--bg)">
      <div class="topbar" id="chat-topbar" style="background:var(--surface)">
        <button class="tb-btn" onclick="closeChat()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="tb-chat-info" id="chat-hdr"></div>
        <button class="tb-btn" id="chat-more-btn" onclick="openChatMenu(event)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typing-indicator" style="display:none">
        <span class="typing-dots"><span></span><span></span><span></span></span>
        <span class="typing-name" id="typing-name"></span><span> печатает…</span>
      </div>
      <div class="composer-wrap">
        <div class="reply-bar" id="reply-bar" style="display:none">
          <div class="rb-accent"></div>
          <div class="rb-body">
            <div class="rb-name" id="rb-name"></div>
            <div class="rb-text" id="rb-text"></div>
          </div>
          <button class="rb-close" onclick="hideReplyBar()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="edit-bar" id="edit-bar" style="display:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>Редактирование</span>
          <button onclick="cancelEdit()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="composer">
          <button class="composer-attach" onclick="pickFile()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <div class="composer-field">
            <textarea id="msg-input" rows="1" placeholder="Сообщение" oninput="onMsgInput(this)" onkeydown="handleKey(event)"></textarea>
          </div>
          <button class="send-btn" id="send-btn" onclick="sendOrEdit()" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
          </button>
        </div>
        <input type="file" id="file-input" accept="*" style="display:none" onchange="onFilePicked(this)">
      </div>
    </div>

    <!-- ── SETTINGS layer ── -->
    <div class="layer layer-settings" id="layer-settings" style="display:none">
      <div class="topbar" style="background:var(--surface)">
        <div class="tb-title" style="padding-left:8px">Настройки</div>
      </div>
      <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch">
        <div class="profile-section" id="profile-section"></div>
        <div class="settings-section">
          <div class="settings-section-label">Внешний вид</div>
          <div class="settings-row">
            <div class="settings-row-icon" style="background:#6c5ce7">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </div>
            <div class="settings-row-text"><div class="settings-row-label">Тема</div></div>
            <div class="seg-ctrl" id="theme-seg">
              <button class="seg-btn" onclick="setTheme('dark')">Тёмная</button>
              <button class="seg-btn" onclick="setTheme('light')">Светлая</button>
            </div>
          </div>
          <div class="settings-row">
            <div class="settings-row-icon" style="background:#0984e3">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            </div>
            <div class="settings-row-text"><div class="settings-row-label">Размер текста</div></div>
            <div class="seg-ctrl" id="font-seg">
              <button class="seg-btn" onclick="setFontSize('small')">S</button>
              <button class="seg-btn" onclick="setFontSize('medium')">M</button>
              <button class="seg-btn" onclick="setFontSize('large')">L</button>
            </div>
          </div>
        </div>
        <div class="settings-section" style="margin-top:10px">
          <div class="settings-section-label">О приложении</div>
          <div class="settings-row" style="cursor:default">
            <div class="settings-row-icon" style="background:#3f7ac5">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <div class="settings-row-text">
              <div class="settings-row-label">Версия</div>
              <div class="settings-row-value" id="settings-version">—</div>
            </div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
        <div style="height:16px"></div>
      </div>
    </div>

  </div><!-- /.screens-wrap -->

  <!-- ── Bottom nav ── -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-tab active" id="nav-chats" onclick="switchTab('chats')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Чаты
    </button>
    <button class="nav-tab" id="nav-settings" onclick="switchTab('settings')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Настройки
    </button>
  </nav>

  <!-- ── Context menu ── -->
  <div class="ctx-overlay" id="ctx-overlay" onclick="closeCtxMenu()">
    <div class="ctx-menu" id="ctx-menu" onclick="event.stopPropagation()">
      <div class="ctx-reactions">
        <button class="ctx-react-btn" data-emoji="👍" onclick="ctxReact('👍')">👍</button>
        <button class="ctx-react-btn" data-emoji="❤️" onclick="ctxReact('❤️')">❤️</button>
        <button class="ctx-react-btn" data-emoji="😂" onclick="ctxReact('😂')">😂</button>
        <button class="ctx-react-btn" data-emoji="😮" onclick="ctxReact('😮')">😮</button>
        <button class="ctx-react-btn" data-emoji="👎" onclick="ctxReact('👎')">👎</button>
        <button class="ctx-react-btn ctx-react-more" onclick="ctxReact('🔥')">🔥</button>
      </div>
      <div class="ctx-item" id="ctx-reply-btn" onclick="ctxReply()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>Ответить
      </div>
      <div class="ctx-item" id="ctx-copy-btn" onclick="ctxCopy()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Скопировать
      </div>
      <div class="ctx-item" id="ctx-edit-btn" style="display:none" onclick="ctxEdit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Редактировать
      </div>
      <div class="ctx-item danger" id="ctx-delete-btn" style="display:none" onclick="ctxDelete()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>Удалить
      </div>
    </div>
  </div>

  <!-- ── Chat actions sheet ── -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()" style="display:none">
    <div class="sheet" id="sheet" onclick="event.stopPropagation()"></div>
  </div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"></div>

</div><!-- /.screen-main -->

<script src="/m/app.js"></script>
</body>
</html>
