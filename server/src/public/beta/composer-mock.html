<!doctype html>
<html lang="ru" class="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Макет поля ввода</title>
<link rel="stylesheet" href="/shared/fonts/inter.css">
<link rel="stylesheet" href="/beta/css/app.css"><link rel="stylesheet" href="/beta/css/extra.css"><link rel="stylesheet" href="/beta/css/cshape.css">
<style>
.demo{position:absolute;left:0;right:0;top:calc(var(--sat) + 4px);z-index:30;display:flex;gap:6px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.demo::-webkit-scrollbar{display:none}
.demo button{flex:none;height:32px;padding:0 12px;border-radius:16px;font-size:12.5px;font-weight:600;color:var(--text2)}
.demo button.on{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent-ink)}
.sendb .i{left:50%;top:50%;margin:-.5em 0 0 -.5em}
.xtra{height:0}
/* Содержимое панели не ближе 20 px к скруглённому краю: нижние 8 px — зазор до кнопок, ещё 8 — воздух под содержимым */
.xi{padding:0 0 16px}
.cbar{padding:14px 12px 0 22px}
.fmtbar{padding:12px 12px 0 18px}.fmtbar[hidden]{display:flex}
.axs{padding:14px 20px 0}
.lpv{padding:14px 14px 0 22px}
.fpv{padding:12px 22px 0}.fpv[hidden]{display:block}
.cin{min-height:46px}
.chat .scroll{padding-top:calc(var(--sat) + 52px)}
</style></head><body>
<div class="stage"><div class="fit"><div class="phone" id="phone"><div class="amb"><i></i><i></i><i></i><i></i></div><div class="isl"></div>
<div class="demo glass" id="demo"></div>
<div class="page chat" style="position:absolute;inset:0;z-index:2"><div class="amb"><i></i><i></i><i></i><i></i></div><div class="scroll" style="position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:260px">
<div class="mrow in"><div class="bub">Нужны вложения и ответ на сообщение<span class="t">12:50</span></div></div>
<div class="mrow out"><div class="bub">Посмотрим, как панели огибают кнопки<span class="t">12:56</span></div></div></div>
<div class="comp" id="comp">
 <div class="xtra" id="xtra"></div>
 <button class="cbtn glass gi" aria-label="Вложение"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
 <div class="cfield"><div class="cin"><span class="ph" style="position:absolute;left:16px;top:13px;color:var(--muted);font-size:16px;line-height:20px">Сообщение</span><div class="ce" style="min-height:46px"></div><button class="em"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg></button></div></div>
 <button class="sendb glass gi" aria-label="Отправить"><svg class="i s" viewBox="0 0 24 24"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button>
</div></div>
<div id="layer"></div><div class="home"></div></div></div></div>
<script src="/beta/js/icons.js"></script><script src="/beta/js/ui/cshape.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),phone=$('#phone');let sc=1;
function fit(){const f=$('.fit');if(innerWidth<=520){sc=innerWidth/393;phone.style.width='393px';phone.style.height=f.clientHeight/sc+'px';phone.style.transform='scale('+sc+')';phone.style.setProperty('--sc',sc);return}
 sc=Math.min(f.clientWidth/453,f.clientHeight/892,1.2);phone.style.transform='scale('+sc+')';phone.style.left=(f.clientWidth-393*sc)/2+'px';phone.style.top=Math.max(14,(f.clientHeight-852*sc)/2)+'px'}
addEventListener('resize',fit);fit();
const I=n=>'<svg class="i" viewBox="0 0 24 24">'+(B.MI[n]||B.IC[n]||'')+'</svg>';
const fmt=prev=>`<div class="fmtbar">${['bold','italic','code','braces','eyeOff'].map(n=>`<button>${I(n)}</button>`).join('')}<span class="fsep"></span><button class="${prev?'on':''}">${I('eye')}</button><span class="fgrow"></span><button>${I('x')}</button></div>`;
const bar=(t,s)=>`<div class="cbar"><i class="tk"></i><div class="ct"><b>${t}</b><span>${s}</span></div><button class="ibtn">${I('x')}</button></div>`;
const att=`<div class="axs"><div class="axh">3 фото</div><div class="axl">${[1,2,3].map(i=>`<div class="ax"><span class="axf" style="background:conic-gradient(from ${i*70}deg at 30% 110%,#2ed3b7,#6a6cf0,#f0a020,#2ed3b7);border-radius:14px;width:100%;height:100%"></span><button class="rm">${I('x')}</button></div>`).join('')}<button class="ax add">${I('plus')}</button></div></div>`;
const S={
 none:['Пусто',''],
 fmt:['Форматирование',fmt(0)],
 prev:['Превью текста',fmt(1)+'<div class="fpv"><div class="fpl">Превью — так увидят получатели</div><div class="fpb"><b>Жирный</b> и <code>код</code></div></div>'],
 att:['Вложения',att],
 reply:['Ответ',bar('Ответ: Елена','Короткая демонстрация анимации')],
 edit:['Правка',bar('Редактирование','')],
 fwd:['Пересылка',bar('Переслано от Алексея','Дорожная карта на четвёртый квартал')],
 link:['Ссылка',`<div class="lpv"><span class="lth">${I('link')}</span><div class="lpt"><b>Дорожная карта — Notion</b><span>notion.so</span></div><button class="ibtn">${I('x')}</button></div>`],
 multi:['Ответ + формат',bar('Ответ: Елена','Короткая демонстрация анимации')+fmt(0)]
};
$('#demo').innerHTML=Object.keys(S).map(k=>`<button data-k="${k}" class="${k==='none'?'on':''}">${S[k][0]}</button>`).join('');
const x=$('#xtra'),comp=$('#comp');CShape.attach(comp);
let tm=0;
function go(k){const html=S[k][1],from=x.offsetHeight;clearTimeout(tm);
 if(!html){x.style.transition='height .4s var(--gl-ease)';x.style.height='0px';tm=setTimeout(()=>{x.innerHTML=''},420);return}
 x.style.transition='none';x.style.height='auto';x.innerHTML='<div class="xi">'+html+'</div>';const to=x.offsetHeight;x.style.height=from+'px';void x.offsetHeight;
 x.style.transition='height .42s var(--gl-spring)';x.style.height=to+'px'}
$('#demo').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;document.querySelectorAll('#demo button').forEach(z=>z.classList.toggle('on',z===b));go(b.dataset.k)});
</script></body></html>
