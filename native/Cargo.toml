[package]
name = "chat-native"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "http"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
