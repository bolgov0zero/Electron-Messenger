name: Beta macOS

# Нативный прототип клиента на Rust/egui (native/). Собирается на каждый push в beta
# и по ручному запуску; артефакт — .dmg с универсальным приложением (Apple Silicon + Intel).
on:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  build:
    name: Build macOS (Rust)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build (arm64 + x86_64)
        working-directory: native
        env:
          # Зашиваются в приложение: по ним оно узнаёт, есть ли более новая сборка
          GIT_SHA: ${{ github.sha }}
          BUILD_NUM: ${{ github.run_number }}
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Bundle .app and .dmg
        working-directory: native
        env:
          P12_B64: ${{ secrets.NATIVE_SIGN_P12_BASE64 }}
          P12_PASS: ${{ secrets.NATIVE_SIGN_P12_PASSWORD }}
        run: |
          APP="dist/Chat.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/chat-native \
            target/x86_64-apple-darwin/release/chat-native \
            -output "$APP/Contents/MacOS/chat-native"

          # Иконка из icons/app
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$ICONSET"
          SRC="../icons/app"
          cp "$SRC/icon-16.png"   "$ICONSET/icon_16x16.png"
          cp "$SRC/icon-32.png"   "$ICONSET/icon_16x16@2x.png"
          cp "$SRC/icon-32.png"   "$ICONSET/icon_32x32.png"
          cp "$SRC/icon-64.png"   "$ICONSET/icon_32x32@2x.png"
          cp "$SRC/icon-128.png"  "$ICONSET/icon_128x128.png"
          cp "$SRC/icon-256.png"  "$ICONSET/icon_128x128@2x.png"
          cp "$SRC/icon-256.png"  "$ICONSET/icon_256x256.png"
          cp "$SRC/icon-512.png"  "$ICONSET/icon_256x256@2x.png"
          cp "$SRC/icon-512.png"  "$ICONSET/icon_512x512.png"
          cp "$SRC/icon-1024.png" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Chat</string>
            <key>CFBundleDisplayName</key><string>Chat</string>
            <key>CFBundleIdentifier</key><string>com.corpchat.native.beta</string>
            <key>CFBundleExecutable</key><string>chat-native</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Подпись одним и тем же самоподписанным сертификатом: требование подписи (identifier + хэш сертификата)
          # не меняется от сборки к сборке, поэтому связка ключей и Little Snitch узнают приложение после обновления.
          # Без секретов — запасной вариант «ad hoc» (подпись меняется с каждой сборкой).
          if [ -n "$P12_B64" ]; then
            KC="$RUNNER_TEMP/sign.keychain-db"
            KCPASS="$(uuidgen)"
            echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
            security create-keychain -p "$KCPASS" "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p "$KCPASS" "$KC"
            security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" > /dev/null
            # codesign берёт только доверенные идентичности: помечаем наш самоподписанный сертификат
            # доверенным для подписи кода (только на этой временной виртуальной машине)
            /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/sign.p12" -clcerts -nokeys -passin env:P12_PASS -out "$RUNNER_TEMP/sign-cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign-cert.pem"
            security find-identity -p codesigning "$KC"
            codesign --force --deep --keychain "$KC" --sign "Chat Native Beta" "$APP"
            security delete-keychain "$KC"
            rm -f "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/sign-cert.pem"
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          codesign -d -r- "$APP" 2>&1 | grep designated

          hdiutil create -volname "Chat" -srcfolder dist -ov -format UDZO "Chat-native-beta.dmg"

          # Для обновления внутри приложения: zip с .app и описание версии
          ditto -c -k --keepParent "$APP" Chat-native-beta.zip
          SIZE=$(stat -f%z Chat-native-beta.zip)
          printf '{"sha":"%s","build":%s,"size":%s}\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$SIZE" > version.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chat-native-macOS-beta
          path: native/Chat-native-beta.dmg

      # Скользящий пререлиз: приложение скачивает его без токена (артефакты Actions требуют авторизации).
      # Тег native-beta не совпадает с c* и v*, поэтому релизная сборка Electron не запускается,
      # а пререлиз не попадает в releases/latest.
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete native-beta --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create native-beta --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Native beta (скользящая сборка)" \
            --notes "Автоматическая сборка нативного клиента из ветки beta: сборка $GITHUB_RUN_NUMBER, коммит ${GITHUB_SHA:0:7}. Нужна для обновления внутри приложения." \
            native/Chat-native-beta.dmg native/Chat-native-beta.zip native/version.json
