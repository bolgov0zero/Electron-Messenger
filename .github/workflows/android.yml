name: Build Android
run-name: "Сборка Android ${{ github.ref_name }}"

# Тег a1.2.3 собирает подписанный APK и выкладывает его отдельным релизом
on:
  push:
    tags:
      - 'a*'
  workflow_dispatch:

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Версия из тега
        id: ver
        run: |
          tag="${GITHUB_REF_NAME:-a0.0.0}"
          v="${tag#a}"
          IFS=. read -r ma mi pa <<< "$v"
          echo "name=$v" >> $GITHUB_OUTPUT
          echo "code=$(( ${ma:-0} * 10000 + ${mi:-0} * 100 + ${pa:-0} ))" >> $GITHUB_OUTPUT

      - name: Ключ подписи
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Сборка
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: electron
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle assembleRelease -PappVersion=${{ steps.ver.outputs.name }} -PappCode=${{ steps.ver.outputs.code }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Electron-${{ steps.ver.outputs.name }}.apk"

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/a')
        uses: softprops/action-gh-release@v2
        with:
          files: android/Electron-*.apk
          body: |
            Приложение Android для мобильного клиента. Установка: скачайте файл Electron-${{ steps.ver.outputs.name }}.apk на телефон и откройте его (разрешите установку из неизвестных источников). При первом запуске введите адрес сервера. Обновляется установкой нового файла поверх.
          draft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Electron-android
          path: android/Electron-*.apk
