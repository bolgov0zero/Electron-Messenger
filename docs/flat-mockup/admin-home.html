<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Макет: главная админ-панели, вариант B «Мягкий»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.prtner.ai/1.0.0/sans.css"><!-- Medeo Sans (SIL OFL 1.1), только Sans; Inter ниже — запасной -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════
   МАКЕТ: «Главная» серверной админ-панели (server/src/public/admin) в плоском дизайне B «Мягкий».
   Токены — из server/src/public/chat/flat.css и PLAN.md п. 2; акценты — ACCENTS из app.js клиента.
   Блоки и подписи взяты из app.js админки: renderDashboard, xhHtml, dvTile, xpPanelHtml, fdvRender, cdvRender,
   swBody/swRender, hmRenderChron, hmRenderOverview/hmRenderHeadlines/hmRenderPg, sbSrvInfo.
   Данные демонстрационные. Файл самодостаточный (только шрифт Inter через Google Fonts, запасной — system-ui).
   ════════════════════════════════════════════════════════════════════════ */
:root{
  --ff:"Medeo Sans",Inter,-apple-system,system-ui,"Segoe UI",sans-serif;
  --app-bg:#ece9e4; --side-bg:#fdfcfa; --surf2:#f3f0eb; --sel:#efebe5;
  --text:#1d1b19; --text2:#5b554e; --muted:#766e65;
  --border:color-mix(in srgb,var(--text) 9%,transparent);
  --hover-row:color-mix(in srgb,var(--text) 5%,transparent);
  --gl-card2:color-mix(in srgb,var(--text) 8%,var(--side-bg));
  --acc-rgb:29,168,140; --accent:rgb(var(--acc-rgb));
  --accent-fill:color-mix(in srgb,var(--accent) 80%,#000);
  --accent-ink:color-mix(in srgb,var(--accent) 72%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--side-bg));
  --flat-shadow:0 1px 2px rgba(60,40,20,.05),0 10px 30px rgba(60,40,20,.07);
  --pop-shadow:0 2px 6px rgba(60,40,20,.08),0 18px 44px rgba(60,40,20,.16);
  --seg-bg:color-mix(in srgb,var(--text) 7%,var(--side-bg)); --seg-on:var(--side-bg); --seg-on-sh:0 1px 2px rgba(60,40,20,.14);
  /* состояния (текст и точки; контраст >= 4.5:1 на поверхности и на своей мягкой подложке) */
  --ok:#1f7a45; --warn:#935d00; --bad:#c0392b;
  --ok-soft:color-mix(in srgb,var(--ok) 12%,var(--side-bg)); --warn-soft:color-mix(in srgb,var(--warn) 13%,var(--side-bg)); --bad-soft:color-mix(in srgb,var(--bad) 11%,var(--side-bg));
  /* категориальные ряды по порядку (палитра dataviz: синий, оранжевый, аквамарин) + нейтральный «прочее» */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#a39c92;
  --meter-bg:color-mix(in srgb,var(--text) 9%,var(--side-bg));
  --r-btn:12px; --r-card:16px; --r-panel:22px;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
html.navy{
  --app-bg:#10161d; --side-bg:#18202a; --surf2:#222d3a; --sel:#243242;
  --text:#eef2f6; --text2:rgba(238,242,246,.74); --muted:rgba(238,242,246,.56);
  --gl-card2:color-mix(in srgb,var(--text) 10%,var(--side-bg));
  --accent-fill:color-mix(in srgb,var(--accent) 70%,#000);
  --accent-ink:color-mix(in srgb,var(--accent) 70%,#fff);
  --flat-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --pop-shadow:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55);
  --seg-bg:var(--side-bg); --seg-on:var(--gl-card2); --seg-on-sh:none;
  --ok:#4cc27c; --warn:#f0b04f; --bad:#f27c7c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#6f7b88;
  --meter-bg:color-mix(in srgb,var(--text) 12%,var(--side-bg));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--ff);background:var(--app-bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ───────── панель макета (не часть админки) ───────── */
.mock{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 16px;background:var(--side-bg);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text2)}
.mock b{font-weight:700;color:var(--text);margin-right:auto}
.mock .lab{font-weight:600;color:var(--muted);margin-right:10px}
.mock .g{display:flex;align-items:center}
.acc{display:flex;gap:8px;margin:0 2px}
.acc button{width:24px;height:24px;border-radius:8px;background:var(--c);position:relative;transition:transform .15s}
.acc button:hover{transform:scale(1.08)}
.acc button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--side-bg),0 0 0 4px var(--c)}

/* ───────── кит: сегменты, кнопки, чипы, тумблеры ───────── */
.seg{position:relative;display:inline-flex;height:34px;padding:3px;border-radius:14px;background:var(--seg-bg);flex:none}
.seg.sm{height:30px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:11px;background:var(--seg-on);box-shadow:var(--seg-on-sh);pointer-events:none}
.seg.ready .thumb{transition:left .25s var(--ease),width .25s var(--ease)}
.seg button{position:relative;z-index:1;height:28px;min-width:28px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--text2);white-space:nowrap;transition:color .2s}
.seg.sm button{height:24px;padding:0 10px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{color:var(--text)}
.seg button:active{transform:scale(.97)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-btn);background:var(--gl-card2);color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,transform .12s}
.btn:hover{background:color-mix(in srgb,var(--text) 14%,var(--side-bg))}
.btn:active{transform:scale(.97)}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn.pri{background:var(--accent-fill);color:#fff}
.btn.pri:hover{background:color-mix(in srgb,var(--accent-fill) 88%,#000)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.soft:hover{background:color-mix(in srgb,var(--accent) 22%,var(--side-bg))}
.btn.dng{background:var(--bad-soft);color:var(--bad)}
.btn.dng:hover{background:color-mix(in srgb,var(--bad) 20%,var(--side-bg))}
.btn:disabled{opacity:.45;pointer-events:none}
.ibtn{width:36px;height:36px;border-radius:var(--r-btn);display:grid;place-items:center;color:var(--text2);background:var(--surf2);transition:background .15s,color .15s,transform .12s;flex:none}
.ibtn:hover{background:var(--gl-card2);color:var(--text)}
.ibtn:active{transform:scale(.95)}
.ibtn.sm{width:30px;height:30px;border-radius:10px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:9px;background:var(--surf2);color:var(--text2);font-size:12.5px;font-weight:500;white-space:nowrap}
.chip b{font-weight:700;color:var(--text)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.tg{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:10px;background:var(--surf2);color:var(--text2);font-size:12.5px;font-weight:500;transition:background .15s,color .15s}
.tg i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tg b{font-weight:700;font-variant-numeric:tabular-nums}
.tg[aria-pressed="true"]{background:var(--accent-soft);color:var(--text)}
.tg[aria-pressed="false"]{opacity:.7}
.tg[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.tg:hover{background:var(--gl-card2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.off{background:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:600;background:var(--surf2);color:var(--text2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 22%,var(--side-bg));color:var(--text);flex:none}

/* ───────── окно админки ───────── */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);gap:10px;padding:10px;min-height:calc(100vh - 41px);align-items:start}
.app.rail{grid-template-columns:68px minmax(0,1fr)}
.side{position:sticky;top:51px;height:calc(100vh - 61px);background:var(--side-bg);border-radius:var(--r-panel);box-shadow:var(--flat-shadow);display:flex;flex-direction:column;padding:14px 10px 10px;min-width:0;overflow:hidden}
.logo{display:flex;align-items:center;gap:8px;padding:2px 2px 12px 6px;font-size:12px;font-weight:800;letter-spacing:.02em}
.logo .mk{width:30px;height:30px;border-radius:10px;background:var(--accent-fill);color:#fff;display:grid;place-items:center;flex:none}
.logo span{white-space:nowrap;overflow:hidden}
.logo span em{font-style:normal;color:var(--accent-ink)}
.logo .col{margin-left:auto}
.jump{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-radius:var(--r-btn);background:var(--surf2);color:var(--muted);font-size:13px;margin-bottom:8px;width:100%;text-align:left}
.jump:hover{background:var(--gl-card2)}
.jump kbd{margin-left:auto;font:600 11px var(--ff);padding:2px 6px;border-radius:6px;background:var(--side-bg);color:var(--muted)}
.nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.nav h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav h4:first-child{padding-top:2px}
.ni{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:var(--r-btn);color:var(--text2);font-size:14px;font-weight:500;width:100%;text-align:left;position:relative;transition:background .15s,color .15s}
.ni:hover{background:var(--hover-row);color:var(--text)}
.ni[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ni svg.i{width:20px;height:20px}
.ni .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .bd{min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--surf2);color:var(--text2);font-size:12px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ni[aria-current="page"] .bd{background:var(--side-bg);color:var(--accent-ink)}
.ni .bd.warn{background:var(--warn-soft);color:var(--warn)}
.srvw{margin-top:8px;border-radius:14px;background:var(--surf2);padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:background .15s}
.srvw:hover{background:var(--gl-card2)}
.srvw .l1{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.srvw .l1 .r{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.srvw .l2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.srvw .l2 .end{margin-left:auto}
.srvw .pill{height:22px;background:var(--side-bg)}
.srvw .pill.up{background:var(--accent-soft);color:var(--accent-ink)}
.rail .logo span,.rail .jump span,.rail .jump kbd,.rail .ni .lb,.rail .nav h4,.rail .srvw .l1 .r,.rail .srvw .l2,.rail .logo .col{display:none}
.rail .ni{justify-content:center;padding:0}
.rail .ni .bd{position:absolute;top:2px;right:6px;min-width:16px;height:16px;font-size:12px;padding:0 4px}
.rail .jump{justify-content:center;padding:0}
.rail .logo{justify-content:center;padding:2px 0 12px;cursor:pointer}
.rail .srvw{padding:10px 0;align-items:center}
.rail .srvw .l1{font-size:0;gap:0;justify-content:center}.rail .ni .bd:not(.warn){display:none}

.main{min-width:0;container:page/inline-size}
.top{display:flex;align-items:center;gap:12px;height:56px;padding:0 4px 0 6px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.015em;white-space:nowrap}
.top .state{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:9px;background:var(--side-bg);box-shadow:var(--flat-shadow);font-size:12.5px;font-weight:600;color:var(--text2)}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;height:44px;width:min(300px,28cqw);padding:0 14px;border-radius:14px;background:var(--side-bg);box-shadow:var(--flat-shadow);color:var(--muted);font-size:13px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--text);outline:none}
.search:focus-within{box-shadow:var(--flat-shadow),0 0 0 2px var(--accent)}
.search kbd{font:600 11px var(--ff);padding:2px 6px;border-radius:6px;background:var(--surf2);color:var(--muted)}
.top .seg{background:var(--side-bg);box-shadow:var(--flat-shadow)}
/* верхняя строка: поиск, переключатель темы и карточка пользователя одной высоты 44 px и одного радиуса 14 */
.top .seg{height:44px;padding:4px;border-radius:14px}
.top .seg .thumb{top:4px;bottom:4px;border-radius:10px}
.top .seg button{height:36px;border-radius:10px}
html.navy .top .seg{background:var(--side-bg);box-shadow:var(--flat-shadow)}
.me{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 4px;border-radius:14px;background:var(--side-bg);box-shadow:var(--flat-shadow);position:relative}
.me .av{width:34px;height:34px;--c:var(--s1)}
.me .tx{display:flex;flex-direction:column;line-height:1.2;text-align:left}
.me .tx b{font-size:13px;font-weight:600}
.me .tx small{font-size:12px;color:var(--muted)}
.me .ibtn{width:32px;height:32px;border-radius:10px}
/* профиль и тема — внизу сайдбара (как в живой админке) */
.sfoot{margin-top:8px;display:flex;flex-direction:column;gap:8px;position:relative}
.menu .mth{padding:2px 10px 8px;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.menu #themeSeg .seg{display:flex;width:100%;height:40px;padding:4px;border-radius:14px;background:var(--surf2);box-shadow:none}
.menu #themeSeg .seg .thumb{top:4px;bottom:4px;border-radius:10px;background:var(--side-bg)}
.menu #themeSeg .seg button{flex:1;height:32px;border-radius:10px;padding:0 6px}
.sfoot .me{height:48px;border-radius:14px;background:var(--surf2);box-shadow:none;padding:0 6px 0 8px;width:100%}
.sfoot .me .tx{flex:1;min-width:0}
.sfoot .me .ibtn{margin-left:auto;transform:rotate(180deg)}
.sfoot .me .menu{top:auto;bottom:calc(100% + 8px);left:0;right:0;width:auto}
.rail .sfoot .me{padding:0;justify-content:center;height:44px}
.rail .sfoot .me .tx,.rail .sfoot .me .ibtn{display:none}
.rail .sfoot .me .menu{left:0;right:auto;width:250px}

.menu{position:absolute;right:0;top:52px;width:250px;background:var(--side-bg);border-radius:16px;box-shadow:var(--pop-shadow);padding:6px;z-index:40;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.menu.on{opacity:1;transform:none;pointer-events:auto}
.menu .mi{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:12px;width:100%;font-size:13.5px;font-weight:500;text-align:left}
.menu .mi:hover{background:var(--hover-row)} .menu .mi small{margin-left:auto;color:var(--muted);font-size:12px}
.menu .mi.bad{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 6px}

.quick{display:flex;align-items:center;gap:8px;margin:2px 0 12px;flex-wrap:wrap}
.quick .lv{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-right:auto}
.quick .lv i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ───────── карточки и сетка ───────── */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--side-bg);border-radius:var(--r-card);box-shadow:var(--flat-shadow);padding:16px 20px;min-width:0}
.c12{grid-column:span 12} .c7{grid-column:span 7} .c5{grid-column:span 5} .c3{grid-column:span 3} .c6{grid-column:span 6}
.rise{animation:rise .3s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@container page (max-width:860px){.c3{grid-column:span 6}.c7,.c5{grid-column:span 12}}
@container page (max-width:560px){.c3,.c6{grid-column:span 12}}
.card h3{font-size:15px;font-weight:700;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.sub{font-size:12.5px;color:var(--muted);line-height:1.4}
.sub b{color:var(--text2);font-weight:600}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}
.empty .ico{width:44px;height:44px;border-radius:14px;background:var(--surf2);display:grid;place-items:center;color:var(--muted)}
.empty .ico svg.i{width:22px;height:22px}
.meter{height:8px;border-radius:4px;background:var(--meter-bg);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .5s var(--ease)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.stack{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden}
.stack i{display:block;min-width:3px;border-radius:2px;transition:flex-grow .4s var(--ease)}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.legend>div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);padding:4px 6px;margin:0 -6px;border-radius:8px}
.legend>div:hover{background:var(--hover-row)}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.legend .v{margin-left:auto;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}

/* ───────── панель сервера (xh) ───────── */
.xh{padding:14px 20px;overflow:hidden;position:relative;min-height:84px}
.xh-row{display:flex;align-items:center;gap:16px;animation:rise .28s var(--ease) both}
.xh-ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--ok-soft);color:var(--ok)}
.xh-ico.wait{background:var(--warn-soft);color:var(--warn)} .xh-ico.bad{background:var(--bad-soft);color:var(--bad)} .xh-ico.busy{background:var(--accent-soft);color:var(--accent-ink)}

  const sum=elLv==='bad'?['bad','Есть сбой']:pgLv==='warn'?['warn','Нагрузка']:['ok','Всё работает'];
  const sv=(name,lv,st,cpu,mem,meta,btn)=>`<div class="sv"><div class="nm"><i class="dot ${lv==='ok'?'':lv}"></i><b>${name}</b><span class="sub">${st}</span><button type="button" class="ibtn sm" data-restart="${btn}" title="Перезапустить ${name}" aria-label="Перезапустить ${name}">${ic('rotate',16)}</button></div>
    <div class="mm"><div><div>Процессор<b>${cpu==null?'—':nf(cpu,1)+'%'}</b></div><div class="meter" style="height:6px"><i class="${lv==='warn'?'warn':''}" style="width:${cpu||0}%"></i></div></div><div><div>Память<b>${mem==null?'—':mem>1000?nf(mem/1024,1)+' ГБ':mem+' МБ'}</b></div><div class="meter" style="height:6px"><i class="${lv==='warn'?'warn':''}" style="width:${mem==null?0:Math.min(100,mem/8192*100)}%"></i></div></div></div><div class="sub">${meta}</div></div>`;
  const S2=M.disk, db=160*(S2/100), dbG=S.scn==='empty'?.04:2.8, filesG=S.scn==='empty'?0:48.6, bkG=M.backups.count?1.45:0, sysG=Math.max(0,db-dbG-filesG-bkG);
  const store=[['База данных',dbG,'var(--s1)','PostgreSQL 16.4: '+nf(dbG,1)+' ГБ'],['Файлы чата',filesG,'var(--s2)','2 340 файлов · аватары 48 МБ'],['Резервные копии',bkG,'var(--s3)',M.backups.count?`${M.backups.count} копий · последняя ${M.backups.days===0?'сегодня':M.backups.days+' дн. назад'}`:'Копий пока нет'],['Система и прочее',sysG,'var(--s4)','Debian, Node.js, журналы']];
  const free=160-db, pc=v=>(v/160*100).toFixed(2)+'%';
  const gb=v=>v<1?nf(v*1024)+' МБ':nf(v,1)+' ГБ';
  const em=S.scn==='empty',parts=em?[[1,'var(--s1)','Статусы','1 МБ'],[1,'var(--s2)','Сообщения','1 МБ'],[1,'var(--s3)','Поиск','2 МБ'],[6,'var(--s4)','Прочее','37 МБ']]:[[1.1,'var(--s1)','Статусы','1,1 ГБ'],[1.3,'var(--s2)','Сообщения','1,3 ГБ'],[.3,'var(--s3)','Поиск','310 МБ'],[.1,'var(--s4)','Прочее','90 МБ']];
  const pgS=down(lineSeries('cpu','24h').map(v=>M.pgConn*(.6+v/Math.max(M.cpu*2,40))),60);
  $('#dvb').innerHTML=`
  <section class="card rise swapc" style="--i:6" aria-labelledby="h-res"><h3 id="h-res">Ресурсы</h3>${res('Память',`${nf(8*(100-M.mem)/100,1)} ГБ свободно из 8 ГБ`,M.mem,80,90)}${res('Диск',`${nf(160*(100-M.disk)/100,1)} ГБ свободно из 160 ГБ`,M.disk,80,90)}${res('Подкачка',`${nf(2*M.swap/100,1)} ГБ из 2 ГБ`,M.swap,50,80)}<div class="hint" style="margin-top:auto;padding-top:8px">${ic('info',14)}Предупреждение с 80%, сбой с 90%</div></section>
  <section class="card rise" style="--i:7" aria-labelledby="h-svc"><h3 id="h-svc">Службы<span class="pill ${sum[0]}">${sum[1]}</span></h3>
    ${sv('electron',elLv,elLv==='bad'?'Остановлена':'Работает',elLv==='bad'?null:M.cpu*.55,elLv==='bad'?null:512,elLv==='bad'?'остановлена 2 мин назад · сбоев 1':`42 задачи · с ${M.since} · сбоев 0`,'el')}
    ${sv('postgresql',pgLv,pgLv==='warn'?'Нагрузка':'Работает',M.svcPg==='warn'?38.2:2.4,M.svcPg==='warn'?1740:640,`18 задач · с ${S.scn==='empty'?M.since:'29.10 07:41'} · сбоев 0`,'pg')}</section>
  <section class="card rise" style="--i:8" aria-labelledby="h-st"><h3 id="h-st">Хранилище<span class="sub" style="margin-left:auto;font-weight:500">160 ГБ</span></h3>
    <div class="sub" style="margin:-4px 0 10px">Занято <b>${gb(db)}</b> · свободно <b>${gb(free)}</b></div>
    <div class="stack" role="img" aria-label="Занято ${gb(db)} из 160 ГБ">${store.map(x=>`<i style="width:${pc(Math.max(x[1],160*.004))};background:${x[2]}" data-tip="${esc(`<div class='th'>${x[0]}</div><div class='tv'>${gb(x[1])}</div>`)}"></i>`).join('')}<i style="flex:1;background:var(--meter-bg)" data-tip="${esc(`<div class='th'>Свободно</div><div class='tv'>${gb(free)}</div>`)}"></i></div>
    <div class="legend">${store.map(x=>`<div style="--c:${x[2]}" title="${esc(x[3])}"><i></i>${x[0]}<span class="v">${gb(x[1])}</span></div>`).join('')}</div></section>
  <section class="card db rise" style="--i:9" aria-labelledby="h-db"><h3 id="h-db"><span style="color:var(--accent-ink);display:flex">${ic('db',16)}</span>PostgreSQL <span class="sub" style="font-weight:500">16.4</span><span class="pill ${pgLv}">${pgLv==='warn'?'Нагрузка':'Работает'}</span></h3>
    <div class="sub">${gb(dbG)} · кэш <b${M.pgCache<95?' style="color:var(--warn)"':''}>${nf(M.pgCache,1)}%</b> · ${nf(M.pgTps)} запросов/с</div>
    <div class="big" style="${M.pgConn>80?'color:var(--warn)':''}">${M.pgConn}<small>соединений из 100</small></div>
    <div class="spk" role="img" aria-label="Соединения за час">${spark(pgS,{color:M.pgConn>80?'var(--warn)':'var(--accent)',label:'Соединения с базой, час'})}</div>
    <div class="stack">${parts.map(p=>`<i style="flex-grow:${p[0]};background:${p[1]}" data-tip="${esc(`<div class='th'>${p[2]}</div><div class='tv'>${p[3]}</div>`)}"></i>`).join('')}</div>
    <div class="legend">${parts.map(p=>`<div style="--c:${p[1]}"><i></i>${p[2]}<span class="v">${p[3]}</span></div>`).join('')}</div></section>`;
}

/* ───────── страница ───────── */
function pageSkeleton(){
  $('#page').innerHTML=`<div class="quick"><span class="lv"><i></i>Обновляется каждые 2 с · ${M.host}</span>
   <button type="button" class="btn" data-toast="Макет: окно «Создать пользователя»">${ic('userplus',16)}Создать пользователя</button>
   <button type="button" class="btn" data-toast="Макет: окно «Создать комнату»">${ic('rooms',16)}Создать комнату</button>
   <button type="button" class="btn" data-toast="Макет: окно «Объявление»">${ic('announcements',16)}Объявление</button></div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr);gap:16px">
   <section class="card xh rise" id="xh" style="--i:0" aria-label="Сервер" aria-live="polite"></section>
   <div id="kz"></div>
   <section class="card cdv rise" id="fed" style="--i:2" aria-label="Федерация"></section>
   <section class="card cdv rise" id="calls" style="--i:3" aria-label="Звонки"></section>
   <div class="grid"><section id="swap" class="card c7 rise swapc" style="--i:4" aria-live="polite"></section>
    <section class="card c5 rise" style="--i:5" aria-labelledby="h-chron"><h3 id="h-chron" style="margin-bottom:12px">Хроника</h3><div class="chron" id="chron"></div></section></div>
   <div class="dvb" id="dvb"></div></div>`;
}
function renderAll(){
  M=model();
  if(S.page==='dashboard'){pageSkeleton();renderXh(false);renderKpi();renderFed();renderCalls();renderSwap();renderChron();renderBottom()}
  renderSide();renderTop();
  $('#page').hidden=S.page!=='dashboard';
  const stub=$('#stub');stub.hidden=S.page==='dashboard';
  if(S.page!=='dashboard')stub.innerHTML=`<div class="card rise"><div class="empty" style="padding:64px 12px"><div class="ico">${ic(S.page)}</div><b style="color:var(--text);font-size:16px;font-weight:700">${TITLES[S.page]}</b>Этот раздел в макете главной не показан.<button type="button" class="btn pri" style="margin-top:8px" data-nav="dashboard">Вернуться на главную</button></div></div>`;
}

/* ───────── тема и акцент ───────── */
function applyTheme(){
  document.documentElement.classList.toggle('navy',S.theme==='navy');
  const a=ACC[S.acc],c=S.theme==='navy'?a.slice(3):a.slice(0,3);
  document.documentElement.style.setProperty('--acc-rgb',c.join(','));
  $('#acc').innerHTML=Object.keys(ACC).map(k=>{const v=S.theme==='navy'?ACC[k].slice(3):ACC[k].slice(0,3);return `<button type="button" data-acc="${k}" style="--c:rgb(${v})" aria-pressed="${k===S.acc}" aria-label="Акцент: ${{teal:'бирюзовый',indigo:'индиго',plum:'сливовый',amber:'янтарный'}[k]}" title="${{teal:'Бирюзовый',indigo:'Индиго',plum:'Сливовый',amber:'Янтарный'}[k]}"></button>`}).join('');
  $('#scn').innerHTML=seg('scn',Object.entries(SCN),S.scn);
  try{localStorage.setItem('adm-mock-theme',S.theme);localStorage.setItem('adm-mock-acc',S.acc)}catch(e){}
  fixSegs($('.mock'));
}

/* ───────── события ───────── */
document.addEventListener('click',e=>{
  const T=e.target, c=sel=>T.closest?.(sel);
  if(!c('.me'))S.menu&&(S.menu=false,renderTop());
  let b;
  if(b=c('[data-acc]')){S.acc=b.dataset.acc;applyTheme();if(S.page==='dashboard'){drawXp?.();}return}
  if(b=c('[data-seg] button')){
    const id=b.closest('[data-seg]').dataset.seg,v=b.dataset.v;
    if(id==='theme'){S.theme=v;applyTheme();renderTop();return}
    if(id==='scn'){S.scn=v;S.kpi=null;S.upd='idle';applyTheme();renderAll();return}
    if(id==='xtab'){S.xtab=v;S.hover=null;S.xall=false;$$('.xp-tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===v));fixSegs($('.xp-head'));drawXp();return}
    if(id==='range'){S.range=v;S.hover=null;S.xall=false;$$('[data-seg=range] button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));fixSegs($('.xp-head'));drawXp();return}
    if(id==='swt'){S.tab=v;renderSwap();return}
    if(id==='fper'){S.fed.per=v;renderFed();return}
    if(id==='fmet'){S.fed.metric=v;renderFed();return}
    if(id==='cper'){S.calls.per=v;renderCalls();return}
    if(id==='cmet'){S.calls.metric=v;renderCalls();return}
  }
  if(b=c('[data-xk]')){S.kpi=b.dataset.xk;if(S.kpi!=='ev'||true)S.xtab=S.kpi;S.hover=null;S.xall=false;renderKpi();return}
  if(c('[data-xclose]')){S.kpi=null;hideTip();renderKpi();return}
  if(b=c('[data-xtype]')){S.types[b.dataset.xtype]=!S.types[b.dataset.xtype];S.hover=null;drawXp();return}
  if(c('[data-xall]')){S.xall=!S.xall;xpList(XG);return}
  if(b=c('[data-xh]')){updAction(b.dataset.xh);return}
  if(b=c('[data-tg]')){const st=b.dataset.tg==='fed'?S.fed:S.calls;st.open=!st.open;(b.dataset.tg==='fed'?renderFed:renderCalls)();return}
  if(b=c('[data-att]')){const it=attention().items[+b.dataset.att];if(!it)return;if(it.go==='upd')updAction('show');else if(it.go.startsWith('kpi:')){S.kpi=it.go.slice(4);S.xtab=S.kpi;S.range='24h';renderKpi();$('#kz').scrollIntoView({behavior:'smooth',block:'center'})}else toast(it.go);return}
  if(c('[data-attall]')){S.attAll=!S.attAll;renderSwap();return}
  if(b=c('[data-restart]')){toast('Макет: перезапуск '+(b.dataset.restart==='pg'?'PostgreSQL':'службы electron')+' (в живой админке — с подтверждением)');return}
  if(b=c('[data-toast]')){toast(b.dataset.toast);return}
  if(b=c('[data-nav]')){S.page=b.dataset.nav;S.kpi=null;renderAll();window.scrollTo({top:0});return}
  if(c('#meBtn')){S.menu=!S.menu;renderTop();return}
  if(c('#railBtn')||c('#logoBtn')&&$('#app').classList.contains('rail')){$('#app').classList.toggle('rail');setTimeout(()=>{if(S.kpi)drawXp()},320);return}
  if(c('#jumpBtn')){toast('Макет: быстрый переход по разделам (Ctrl K)');return}
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();toast('Макет: быстрый переход по разделам (Ctrl K)')}
  if(e.key==='Escape'){if(S.menu){S.menu=false;renderTop()}else if(S.kpi){S.kpi=null;hideTip();renderKpi()}}
  if(e.key==='Enter'&&e.target.id==='q'){const v=e.target.value.trim().toLowerCase();const hit=Object.entries(TITLES).find(([,n])=>n.toLowerCase().includes(v));if(hit&&v){S.page=hit[0];renderAll();e.target.value='';e.target.blur()}}
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.kpi)drawXp();fixSegs()},80)});
document.fonts?.ready.then(()=>fixSegs());

applyTheme();renderAll();
</script>
</body>
</html>
