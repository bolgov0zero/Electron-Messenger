<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Макет: звонки, вариант B (без стекла)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════
   МАКЕТ: аудио- и видеозвонки (клиент Electron, веб клиент, мобильный клиент).
   Токены и система форм те же, что в index.html / profile.html (Liquid Glass).
   Шесть сценариев: входящий аудио, аудио-разговор, входящий видео, видео-разговор, входящая группа, групповой разговор.
   Видеозвонки: клиент — отдельное окно, веб клиент — модалка на всё окно, мобильный клиент — отдельный экран.
   ════════════════════════════════════════════════════════════════════════ */
:root{
  --ff:Inter,-apple-system,system-ui,sans-serif;
  --app-bg:#eef1f4; --side-bg:#ffffff; --card-bg:#ffffff; --modal-bg:#ffffff; --chat-bg:#eef1f4;
  --text:#111318; --text2:#4f5666; --muted:#6c7484;
  --accent:#1fa88c; --accent-rgb:29,168,140; --accent-ink:color-mix(in srgb,var(--accent) 72%,#000);
  --accent-soft:rgba(var(--accent-rgb),.12); --accent-border:rgba(var(--accent-rgb),.28);
  --danger:#d23a3a; --danger-bg:rgba(210,58,58,.10); --danger-border:rgba(210,58,58,.28);
  --presence-online:#34c759; --presence-away:#ff9f0a;
  --bubble-bg:#ffffff;
  --r-panel:30px;--r-bar:26px;--r-card:20px;--r-item:14px;--r-row:18px;--r-pill:999px;
  --gl-k:1;
  --gl-blur:26px;--gl-spring:cubic-bezier(.34,1.56,.64,1);--gl-ease:cubic-bezier(.22,1,.36,1);
  --gl:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 46,100) * 1%),transparent);
  --gl2:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 66,100) * 1%),transparent);
  --gl-pop:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 30 + 50,100) * 1%),transparent);
  --gl-card:color-mix(in srgb,var(--text) 5%,transparent);
  --gl-card2:color-mix(in srgb,var(--text) 9%,transparent);
  --gl-edge:rgba(255,255,255,.75);--gl-hi:rgba(255,255,255,.85);--gl-lo:rgba(12,26,25,.07);
  --gl-shadow:rgba(20,50,60,.16);--gl-spec:rgba(255,255,255,.30);--gl-hov:rgba(255,255,255,.34);--gl-spotlight:rgba(255,255,255,.55);
  --gl-in:rgba(255,255,255,.74);
  --gl-out-a:color-mix(in srgb,var(--accent) 80%,#000);--gl-out-b:color-mix(in srgb,var(--accent) 68%,#0b4f96);
  --gl-base:#e3f0ef;--amb-1:color-mix(in srgb,var(--accent) 60%,#fff);--amb-2:#8e9cff;--amb-3:#ffb4d3;--amb-4:#ffd391;
  --scrim:rgba(20,40,50,.22);
  --stage:linear-gradient(160deg,#c9d9e6 0%,#d8e6df 50%,#e6dcec 100%);
}
html.dark{
  --app-bg:#12171d;--side-bg:#1e252d;--card-bg:#1e252d;--modal-bg:#1e252d;--chat-bg:#12171d;
  --text:#eef6f5;--text2:rgba(238,246,245,.74);--muted:rgba(238,246,245,.56);
  --accent:#29d6b8;--accent-rgb:41,214,184;--accent-ink:var(--accent);
  --danger:#ef6f6f;--danger-bg:rgba(239,111,111,.12);--danger-border:rgba(239,111,111,.32);
  --bubble-bg:#1b2733;
  --gl-edge:rgba(255,255,255,.17);--gl-hi:rgba(255,255,255,.20);--gl-lo:rgba(0,0,0,.35);--gl-shadow:rgba(0,0,0,.5);
  --gl-spec:rgba(255,255,255,.09);--gl-hov:rgba(255,255,255,.08);--gl-spotlight:rgba(255,255,255,.20);
  --gl:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 52,100) * 1%),transparent);
  --gl2:color-mix(in srgb,color-mix(in srgb,var(--side-bg) 82%,#4a7080) calc(min(var(--gl-k) * 68,100) * 1%),transparent);
  --gl-pop:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 34 + 50,100) * 1%),transparent);
  --gl-in:color-mix(in srgb,var(--bubble-bg) 74%,transparent);
  --gl-out-a:color-mix(in srgb,var(--accent) 58%,#000);--gl-out-b:color-mix(in srgb,var(--accent) 48%,#0b3d7a);
  --gl-base:color-mix(in srgb,var(--chat-bg) 70%,#000);--amb-1:color-mix(in srgb,var(--accent) 55%,#000);--amb-2:#4a4fd0;--amb-3:#a33a73;--amb-4:#a8742c;
  --scrim:rgba(0,0,0,.40);
  --stage:linear-gradient(160deg,#10181f 0%,#14201f 50%,#1b1626 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--ff);background:var(--stage);background-attachment:fixed;color:var(--text);-webkit-font-smoothing:antialiased;transition:background .5s var(--gl-ease)}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* стекло */
.glass{position:relative;background:radial-gradient(120% 90% at 0% 0%,var(--gl-spec),transparent 55%),var(--gl);border:1px solid var(--gl-edge);
  -webkit-backdrop-filter:blur(var(--gl-blur)) saturate(190%);backdrop-filter:blur(var(--gl-blur)) saturate(190%);
  box-shadow:inset 0 1px 0 var(--gl-hi),inset 0 -1px 0 var(--gl-lo),0 12px 32px var(--gl-shadow)}
.glass-pop{position:relative;background:radial-gradient(120% 80% at 0% 0%,var(--gl-spec),transparent 55%),var(--gl-pop);border:1px solid var(--gl-edge);
  -webkit-backdrop-filter:blur(calc(var(--gl-blur) + 6px)) saturate(190%);backdrop-filter:blur(calc(var(--gl-blur) + 6px)) saturate(190%);
  box-shadow:inset 0 1px 0 var(--gl-hi),inset 0 -1px 0 var(--gl-lo),0 24px 60px var(--gl-shadow)}
.gi{position:relative;transition:transform .35s var(--gl-spring),background .2s,box-shadow .2s}
.gi:hover{background-color:var(--gl2)}
.gi:active{transform:scale(.97)}

/* кнопки */
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--text2);flex:none;transition:background .2s,color .2s,transform .35s var(--gl-spring)}
.ibtn:hover{background:var(--gl-card2);color:var(--text)}
.ibtn:active{transform:scale(.92)}
.ibtn.danger:hover{background:var(--danger-bg);color:var(--danger)}
.btn{height:38px;padding:0 18px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--gl-card);border:1px solid var(--gl-edge);box-shadow:inset 0 1px 0 var(--gl-hi);transition:background .2s,transform .35s var(--gl-spring),filter .2s}
.btn .i{font-size:16px}
.btn:hover{background:var(--gl-card2)}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b));color:#fff;border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px color-mix(in srgb,var(--gl-out-b) 38%,transparent)}
.btn.pri:hover{filter:brightness(1.12);background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b))}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent-ink)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.btn.block{width:100%;justify-content:flex-start;padding:0 16px;height:42px}
.btn.sm{height:32px;padding:0 14px;font-size:12.5px}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;height:36px;padding:3px;border-radius:var(--r-pill);background:var(--gl-hov);box-shadow:inset 0 1px 3px var(--gl-lo)}
.seg button{position:relative;z-index:1;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text2);border-radius:var(--r-pill);transition:color .25s;white-space:nowrap}
.seg button.on{color:var(--text)}
.seg button small{font-size:11px;font-weight:600;color:var(--muted)}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:var(--r-pill);background:var(--gl2);box-shadow:inset 0 1px 0 var(--gl-hi),0 2px 8px var(--gl-shadow);transition:left .45s var(--gl-spring),width .45s var(--gl-spring)}
.seg.full{display:grid;width:100%}
.srch{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:var(--r-pill);color:var(--muted);font-size:13px}
.srch .i{font-size:16px}

/* аватарки */
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);text-transform:uppercase}
.av.sm{width:34px;height:34px;font-size:12px}.av.xs{width:28px;height:28px;font-size:11px}
.av.xl{width:104px;height:104px;font-size:34px}.av.lg{width:88px;height:88px;font-size:29px}.av.md{width:72px;height:72px;font-size:24px}
.av.sq{border-radius:26%}
.av .dot{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:var(--presence-online);box-shadow:0 0 0 3px color-mix(in srgb,var(--side-bg) 85%,transparent)}
.av.sm .dot,.av.xs .dot{width:11px;height:11px;box-shadow:0 0 0 2px color-mix(in srgb,var(--side-bg) 85%,transparent)}
.av .dot.away{background:var(--presence-away)}
.tagp{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent-border)}
.on{color:var(--accent-ink)}
.holder{position:relative;overflow:hidden;border-radius:30px}
.win{width:1360px;height:860px;position:absolute;left:0;top:0;overflow:hidden;border-radius:30px;background:var(--gl-base);box-shadow:0 0 0 1px rgba(255,255,255,.25),0 40px 90px rgba(20,40,60,.35);transform-origin:top left}
.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85}
.amb i:nth-child(1){width:560px;height:560px;left:380px;top:-160px;background:var(--amb-1)}
.amb i:nth-child(2){width:520px;height:520px;right:-120px;top:120px;background:var(--amb-2)}
.amb i:nth-child(3){width:480px;height:480px;left:120px;bottom:-180px;background:var(--amb-3)}
.amb i:nth-child(4){width:420px;height:420px;right:160px;bottom:-140px;background:var(--amb-4)}
.app{position:absolute;inset:0;padding:12px;display:grid;grid-template-columns:340px 1fr;gap:12px}
.app.withpanel{grid-template-columns:340px 1fr 420px}
.side{border-radius:var(--r-panel);padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.side h2{font-size:20px;font-weight:700;padding:4px 8px}
.crow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-row)}
.crow.sel{background:var(--gl2);box-shadow:inset 0 1px 0 var(--gl-hi)}
.crow b{display:block;font-size:13.5px;font-weight:600}
.crow small{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.chat{border-radius:var(--r-panel);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.chat .hd{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--gl-lo)}
.chat .hd b{font-size:15px;font-weight:700}.chat .hd small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.chat .msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.bub{max-width:420px;padding:9px 14px;border-radius:18px;font-size:13.5px;line-height:1.45;background:var(--gl-in);border:1px solid var(--gl-edge)}
.bub.out{align-self:flex-end;background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b));color:#fff;border-color:rgba(255,255,255,.3)}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40}
.pm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;border-radius:var(--r-panel);overflow:hidden;display:flex;flex-direction:column}
.xbtn{position:absolute;top:14px;right:14px;z-index:5}

/* ══════════ МАКЕТ: звонки ══════════ */
body{overflow-x:hidden}
.ctl{position:sticky;top:0;z-index:100;display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;padding:12px 20px;margin:12px 12px 0;border-radius:var(--r-bar)}
.ctl h1{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ctl .grp{display:flex;align-items:center;gap:8px}
.ctl .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ctl .seg{max-width:100%;overflow-x:auto}
.vdesc{width:100%;font-size:13px;line-height:1.5;color:var(--text2);padding:2px 4px 0}
.vdesc b{color:var(--text)}

.board{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;width:100%;max-width:1760px;margin:0 auto;padding:16px 14px 50px}
.board.one{grid-template-columns:1fr}
.cell{display:flex;flex-direction:column;gap:8px;min-width:0}
.cell>h3{font-size:13px;font-weight:700;padding-left:6px;display:flex;gap:8px;align-items:baseline}
.cell>h3 small{font-weight:500;color:var(--muted);font-size:12px}
.mrow{grid-column:1/-1;display:flex;gap:30px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.mcell{display:flex;flex-direction:column;gap:10px;align-items:center}
.mcell>h3{font-size:13px;font-weight:700;align-self:flex-start;padding-left:6px}
.mcell>h3 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.pholder{position:relative;margin:12px}
.notes{width:420px;max-width:100%;border-radius:var(--r-card);padding:18px 20px;align-self:flex-start;margin-top:30px}
.notes h4{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.notes p{font-size:13px;line-height:1.5;color:var(--text2);padding:7px 0;border-top:1px solid var(--gl-lo)}
.notes p:first-of-type{border-top:0}
.notes b{color:var(--text)}

/* значки и общие детали */
.av.xxl{width:140px;height:140px;font-size:46px}
.av.lgg{width:112px;height:112px;font-size:38px}
.stk{display:flex}.stk .av{box-shadow:0 0 0 3px var(--stk-ring,var(--side-bg));margin-left:-10px}.stk .av:first-child{margin-left:0}
.stk .more{background:var(--gl-card2);color:var(--text2);font-size:12px}
.crow .ctm{margin-left:auto;font-size:11px;color:var(--muted);flex:none;align-self:flex-start;padding-top:2px}
.crow .ctm .i{color:var(--accent-ink);font-size:15px}
.chat .comp{margin:0 14px 14px;height:46px;border-radius:var(--r-pill);display:flex;align-items:center;gap:10px;padding:0 6px 0 20px;color:var(--muted);font-size:13.5px}
.chat .comp span{flex:1}
.chat .comp .send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px;background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b))}
.chat .hd .sp{flex:1}
.btn.ok{background:linear-gradient(140deg,#3fd573,#1f9f4c);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(31,159,76,.35)}
.btn.ok:hover{filter:brightness(1.1);background:linear-gradient(140deg,#3fd573,#1f9f4c)}
.btn.no{background:linear-gradient(140deg,#ee6060,#c42f2f);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(196,47,47,.32)}
.btn.no:hover{filter:brightness(1.1);background:linear-gradient(140deg,#ee6060,#c42f2f)}
.btn.no .i.hang,.rb .i.hang,.mb2 .i.hang{transform:rotate(135deg)}

/* пульсация вокруг аватарки звонящего */
.ringav{position:relative;display:grid;place-items:center;flex:none}
.ringav::before,.ringav::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid rgba(var(--accent-rgb),.42);animation:rg 2.6s ease-out infinite}
.ringav::after{animation-delay:1.3s}
.ringav.big::before,.ringav.big::after{inset:-18px}
@keyframes rg{from{transform:scale(.9);opacity:.9}to{transform:scale(1.55);opacity:0}}
@media (prefers-reduced-motion:reduce){.ringav::before,.ringav::after{animation:none;opacity:.5}}

/* карточка входящего звонка (клиент и веб) */
.inc{position:absolute;right:26px;top:26px;width:352px;border-radius:var(--r-bar);padding:16px;z-index:60;display:flex;flex-direction:column;gap:14px}
.inc .top{display:flex;align-items:center;gap:14px;padding:2px 4px 0}
.inc .top .t{min-width:0;flex:1}
.inc .top b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inc .top small{display:block;font-size:12.5px;color:var(--text2);margin-top:3px}
.inc .row2{display:flex;gap:8px}.inc .row2 .btn{flex:1}
.inc .act{display:flex;gap:8px;flex-direction:column}
.inc .act .btn.big{height:44px;font-size:14px}
.prev{position:relative;height:178px;border-radius:var(--r-card);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.prev .tg{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.grpmeta{display:flex;align-items:center;gap:12px;padding:0 4px}
.grpmeta small{font-size:12.5px;color:var(--text2);line-height:1.35}

/* заглушки видео: силуэт на цветном фоне */
.vid{position:absolute;inset:0;container-type:size;overflow:hidden;--hs:min(24cqw,30cqh);
  background:radial-gradient(90% 70% at 30% 18%,hsl(var(--h) 46% 48%),hsl(var(--h) 42% 22%) 72%),hsl(var(--h) 40% 18%)}
.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.38))}
.vid .vh{position:absolute;left:50%;width:var(--hs);aspect-ratio:1;top:calc(36cqh - var(--hs) / 2);transform:translateX(-50%);border-radius:50%;background:hsl(var(--h) 34% 66% / .55)}
.vid .vb{position:absolute;left:50%;width:calc(var(--hs) * 2.5);height:calc(var(--hs) * 4);top:calc(36cqh + var(--hs) * .62);transform:translateX(-50%);border-radius:50% 50% 0 0;background:hsl(var(--h) 34% 52% / .5)}
.vid.off{background:radial-gradient(90% 80% at 50% 30%,hsl(var(--h) 22% 30%),hsl(var(--h) 24% 16%))}
.vid.off::after{display:none}
.vid .vbig{position:absolute;left:50%;top:50%;width:min(36cqw,44cqh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:min(12cqw,15cqh);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.vid.blur{filter:blur(18px) saturate(1.2);transform:scale(1.15)}

/* элементы поверх видео — всегда тёмное стекло */
.vg{background:rgba(14,20,26,.46);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.nchip{position:absolute;left:12px;bottom:12px;height:28px;padding:0 12px 0 6px;border-radius:var(--r-pill);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#fff;z-index:3;white-space:nowrap}
.nchip:not(:has(.mb)){padding-left:12px}
.nchip.top{bottom:auto;top:12px}
.nchip .mb{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#e04848;font-size:12px}
.nchip .i{font-size:13px}
.qchip{position:absolute;right:12px;top:12px;height:28px;padding:0 11px;border-radius:var(--r-pill);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#fff;z-index:3}

/* ═══════════════════════════════════════════════════════════════════════════
   ВАРИАНТ B «Мягкий» — без стекла. Этот блок идёт после стилей макета Liquid Glass и переопределяет
   токены и поверхности: плоские карточки с мягкими тенями, радиусы 12–22, тёплая нейтраль, Inter.
   Переписка (.chatreal) от этих токенов не зависит: её токены заданы в области чата отдельно.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ff:Inter,-apple-system,system-ui,sans-serif;
  --app-bg:#ece9e4;--side-bg:#fdfcfa;--card-bg:#fdfcfa;--modal-bg:#fdfcfa;--chat-bg:#f7f5f1;--bubble-bg:#ffffff;
  --text:#1d1b19;--text2:#5b554e;--muted:#766e65;
  --surf2:#f3f0eb;--sel:#efebe5;
  --accent-fill:color-mix(in srgb,var(--accent) 80%,#000);
  --r-panel:22px;--r-bar:16px;--r-card:16px;--r-menu:16px;--r-item:12px;--r-row:16px;--r-ctl:12px;--r-pill:12px;--gl-in:var(--bubble-bg);--chip-bg:color-mix(in srgb,var(--text) 9%,var(--chat-bg));
  --flat-shadow:0 1px 2px rgba(60,40,20,.05),0 10px 30px rgba(60,40,20,.07);
  --pop-shadow:0 2px 6px rgba(60,40,20,.08),0 18px 44px rgba(60,40,20,.16);
  --gl:var(--side-bg);--gl2:var(--surf2);--gl-pop:var(--side-bg);
  --gl-card:color-mix(in srgb,var(--text) 4%,var(--side-bg));
  --gl-card2:color-mix(in srgb,var(--text) 8%,var(--side-bg));
  --gl-inset:color-mix(in srgb,var(--text) 5%,var(--side-bg));
  --gl-edge:transparent;--gl-hi:transparent;--gl-lo:color-mix(in srgb,var(--text) 9%,transparent);
  --gl-shadow:rgba(60,40,20,.14);--gl-spec:transparent;--gl-spotlight:transparent;
  --gl-hov:color-mix(in srgb,var(--text) 5%,transparent);
  --gl-blur:0px;--gl-out-a:var(--accent-fill);--gl-out-b:var(--accent-fill);
  --gl-base:#ece9e4;
  --scrim:rgba(40,28,16,.32);
  --stage:#dedad4;
}
html.dark{
  --app-bg:#131211;--side-bg:#1d1c1a;--card-bg:#1d1c1a;--modal-bg:#1d1c1a;--chat-bg:#181715;--bubble-bg:#2a2825;
  --text:#f2efeb;--text2:#b4aea6;--muted:#968f86;
  --surf2:#292724;--sel:#2b2926;
  --accent-fill:color-mix(in srgb,var(--accent) 70%,#000);
  --flat-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --pop-shadow:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55);
  --gl-card:color-mix(in srgb,var(--text) 5%,var(--side-bg));
  --gl-card2:color-mix(in srgb,var(--text) 10%,var(--side-bg));
  --gl-inset:color-mix(in srgb,var(--text) 6%,var(--side-bg));
  --gl-lo:color-mix(in srgb,var(--text) 10%,transparent);
  --gl-shadow:rgba(0,0,0,.5);--gl-hov:color-mix(in srgb,var(--text) 7%,transparent);
  --gl-out-a:var(--accent-fill);--gl-out-b:var(--accent-fill);
  --gl-base:#0f0e0d;--scrim:rgba(0,0,0,.5);--stage:#0a0908;
}
html.dark.navy{
  --app-bg:#10161d;--side-bg:#18202a;--card-bg:#18202a;--modal-bg:#18202a;--chat-bg:#0f1b27;--bubble-bg:#213040;
  --text:#eef2f6;--text2:rgba(238,242,246,.74);--muted:rgba(238,242,246,.56);
  --surf2:#222d3a;--sel:#243242;--gl-base:#0c1219;--stage:#080c11;
}

  { t: 'Видео: разговор', d: '<b>Идёт видеозвонок.</b> Клиент открывает отдельное окно, веб клиент — модалку на всё окно, мобильный — отдельный экран.',
    el: () => desk(0, true, cwHtml('el', 170, 100, 1020, 660, 'Алиса Иванова', '02:14', `<button class="ibtn" title="Поверх всех окон">${iconsEl}</button><button class="ibtn">${I('more')}</button>`, body11, ctrl11)),
    web: () => desk(0, true, `<div class="scrim"></div>` + cwHtml('web', 12, 12, 1336, 836, 'Алиса Иванова', '02:14', `<button class="ibtn">${I('more')}</button>`, body11, ctrl11)),
    mob: () => [['Мобильный клиент', '', mVideoCall()]],
    notes: [['Клиент', 'Отдельное окно: его можно переместить на другой монитор, закрепить поверх остальных, основное окно остаётся рабочим.'], ['Веб клиент', 'Модалка на всё окно браузера, «Свернуть» уменьшает звонок до карточки в списке чатов.'], ['Мобильный клиент', 'Полноэкранный собеседник, своё видео в углу, панель управления внизу. Стрелка вниз сворачивает в полосу.']] },
  { t: 'Входящая группа', d: '<b>Групповой видеозвонок начался.</b> Это не «звонок», а приглашение: можно присоединиться сейчас или позже, пока звонок идёт.',
    el: () => desk(1, false, incDesk('group')), web: () => desk(1, false, incDesk('group')), mob: () => [['Мобильный клиент', '', mIncoming('group')]],
    notes: [['Все клиенты', 'Показываем, кто уже в звонке (аватарки и число). Рингтон не играет — только мягкий сигнал, чтобы не мешать в большой группе.'], ['После «Не сейчас»', 'В шапке чата остаётся значок «Идёт звонок · 5» с кнопкой «Присоединиться».']] },
  { t: 'Группа: разговор', d: '<b>Идёт групповой видеозвонок.</b> Сетка плиток, говорящий выделен рамкой акцентного цвета, у выключенной камеры — аватарка.',
    el: () => desk(1, true, cwHtml('el', 130, 70, 1100, 720, 'Проект Атлас', '02:14', rightG, bodyG, ctrlG, true)),
    web: () => desk(1, true, `<div class="scrim"></div>` + cwHtml('web', 12, 12, 1336, 836, 'Проект Атлас', '02:14', rightG, bodyG, ctrlG, true)),
    mob: () => [['Мобильный клиент', '', mGroupCall()]],
    notes: [['Плитки', 'Выделение говорящего — рамка и значок микрофона. У отключённого микрофона — красный значок слева от имени.'], ['Клиент и веб клиент', 'Кнопка «Участники» открывает список с приглашением новых. Макет сетки меняется (сетка / говорящий крупно) значком рядом.'], ['Мобильный клиент', 'Две колонки, до шести плиток на экране, дальше — прокрутка. Своя плитка подсвечена акцентом.']] }
];
const PF = ['Все', 'Клиент', 'Веб клиент', 'Мобильный клиент'];
const st = { sc: 0, pf: 0, dark: true };

function segHtml(items, cur, act) { return `<div class="seg" data-seg="1"><i class="thumb"></i>${items.map((t, k) => `<button class="${k === cur ? 'on' : ''}" data-act="${act}" data-v="${k}">${t}</button>`).join('')}</div>`; }
function render() {
  document.documentElement.classList.toggle('dark', st.dark);
  const S = SCN[st.sc], pf = st.pf;
  document.getElementById('ctl').innerHTML = `<h1>Звонки · вариант B</h1><a class="btn sm" href="index.html">← Десктоп</a><a class="btn sm" href="mobile.html">Мобильный →</a><div class="grp"><span class="lbl">Сценарий</span>${segHtml(SCN.map(s => s.t), st.sc, 'sc')}</div>
    <div class="grp"><span class="lbl">Платформа</span>${segHtml(PF, pf, 'pf')}</div><div class="grp"><span class="lbl">Тема</span>${segHtml(['Светлая', 'Тёмная'], st.dark ? 1 : 0, 'th')}</div><div class="vdesc">${S.d}</div>`;
  const el = S.el(), web = (S.web || S.el)();
  let h = '';
  if (pf === 0 || pf === 1) h += `<div class="cell"><h3>Клиент (Electron)</h3>${el}</div>`;
  if (pf === 0 || pf === 2) h += `<div class="cell"><h3>Веб клиент</h3>${web}</div>`;
  if (pf === 0 || pf === 3) {
    const notes = S.notes.map(n => `<p><b>${n[0]}.</b> ${n[1]}</p>`).join('');
    h += `<div class="mrow">${S.mob().map(m => `<div class="mcell"><h3>${m[0]}<small>${m[1]}</small></h3>${m[2]}</div>`).join('')}<div class="notes glass"><h4>Как это работает</h4>${notes}</div></div>`;
  }
  const b = document.getElementById('board');
  b.className = 'board' + (pf === 1 || pf === 2 || pf === 3 ? ' one' : '');
  b.innerHTML = h;
  requestAnimationFrame(fit);
}
function fit() {
  const PS = st.pf === 3 ? 1 : .88;
  document.querySelectorAll('.holder[data-w]').forEach(h => { const s = h.parentElement.clientWidth / +h.dataset.w; h.style.height = (+h.dataset.h * s) + 'px'; h.firstElementChild.style.transform = `scale(${s})`; });
  document.querySelectorAll('.pholder').forEach(p => { p.style.width = 393 * PS + 'px'; p.style.height = 852 * PS + 'px'; p.firstElementChild.style.transform = `scale(${PS})`; });
  document.querySelectorAll('.seg[data-seg]').forEach(sg => { const on = sg.querySelector('.on'), t = sg.querySelector('.thumb'); t.style.left = on.offsetLeft + 'px'; t.style.width = on.offsetWidth + 'px'; });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = +b.dataset.v;
  if (b.dataset.act === 'sc') st.sc = v; else if (b.dataset.act === 'pf') st.pf = v; else st.dark = v === 1;
  render();
});
window.addEventListener('resize', fit);
render();
</script>
