<title>Макет /m: вариант B (без стекла)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   МАКЕТ КЛИЕНТА — Liquid Glass (v2)
   Источник правды для переноса в веб клиент (glass.css) и Electron.
   • Имена токенов и классов те же, что в веб клиенте (--gl*, --text, .modal, .ctx-menu, .cs-*, .pf-*, .cm-*, .nc-*).
     Блоки CSS ниже можно переносить как есть: комментарий «web:» называет селектор, который они заменяют.
   • Система форм (концентричность: радиус вложенного = радиус внешнего − отступ):
       окно/панель 30 · шапка и полосы 26 · карточка/меню/окно-карточка 20 · пункт меню 14 · строка списка 18
       кнопки, поля, переключатели, чипы — капсулы (999), значки-кнопки — круги, группа кнопок — капсула с круглыми кнопками
   • Отступы 4/8, значки 16/18/20/22 (обводка 2), слои z: 10 контент · 20 полосы · 30 всплывающее · 40 окна · 50 тосты
   • Фокус: 2px кольцо акцента со смещением 2px; нажатие — сжатие 0.95 пружиной, без сдвига соседей; движение отключается при reduced-motion
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ff:Inter,-apple-system,system-ui,sans-serif;
  /* тема: светлая (как в style.css) */
  --app-bg:#eef1f4; --side-bg:#ffffff; --card-bg:#ffffff; --modal-bg:#ffffff; --chat-bg:#eef1f4;
  --text:#111318; --text2:#4f5666; --muted:#6c7484;
  --accent:#1fa88c; --accent-rgb:29,168,140; --accent-ink:color-mix(in srgb,var(--accent) 72%,#000);
  --accent-soft:rgba(var(--accent-rgb),.12); --accent-border:rgba(var(--accent-rgb),.28); --accent-shadow:rgba(var(--accent-rgb),.22);
  --danger:#d23a3a; --danger-bg:rgba(210,58,58,.10); --danger-border:rgba(210,58,58,.28);
  --presence-online:#34c759; --presence-away:#ff9f0a;
  --bubble-bg:#ffffff;
  --tag-1:41,50,96;--tag-2:37,131,37;--tag-3:131,78,37;--tag-4:34,119,114;--tag-5:131,37,78;
  /* радиусы, ритм, слои, значки */
  --r-panel:30px;--r-bar:26px;--r-card:20px;--r-menu:20px;--r-item:14px;--r-row:18px;--r-pill:999px;
  --ic-s:16px;--ic-m:18px;--ic-l:22px;
  --z-bar:20;--z-pop:30;--z-modal:40;--z-toast:50;
  /* стекло (glass.css) */
  --gl-k:1;   /* множитель плотности стекла: настройка «Прозрачность» (50% = 1) */
  --gl-blur:26px;--gl-spring:cubic-bezier(.34,1.56,.64,1);--gl-ease:cubic-bezier(.22,1,.36,1);
  --gl:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 46,100) * 1%),transparent);
  --gl2:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 66,100) * 1%),transparent);
  --gl-pop:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 30 + 50,100) * 1%),transparent);
  --gl-card:color-mix(in srgb,var(--text) 5%,transparent);
  --gl-card2:color-mix(in srgb,var(--text) 9%,transparent);
  --gl-inset:color-mix(in srgb,var(--text) 6%,transparent);
  --gl-edge:rgba(255,255,255,.75);--gl-hi:rgba(255,255,255,.85);--gl-lo:rgba(12,26,25,.07);
  --gl-shadow:rgba(20,50,60,.16);--gl-spec:rgba(255,255,255,.30);--gl-hov:rgba(255,255,255,.34);--gl-spotlight:rgba(255,255,255,.55);
  --gl-in:rgba(255,255,255,.74);
  --gl-out-a:color-mix(in srgb,var(--accent) 80%,#000);--gl-out-b:color-mix(in srgb,var(--accent) 68%,#0b4f96);
  --gl-base:#e3f0ef;--amb-1:color-mix(in srgb,var(--accent) 60%,#fff);--amb-2:#8e9cff;--amb-3:#ffb4d3;--amb-4:#ffd391;
  --scrim:rgba(20,40,50,.22);
  --stage:linear-gradient(160deg,#c9d9e6 0%,#d8e6df 50%,#e6dcec 100%);
}
html.dark{
  --app-bg:#12171d;--side-bg:#1e252d;--card-bg:#1e252d;--modal-bg:#1e252d;--chat-bg:#12171d;
  --text:#eef6f5;--text2:rgba(238,246,245,.74);--muted:rgba(238,246,245,.56);
  --accent:#29d6b8;--accent-rgb:41,214,184;--accent-ink:var(--accent);
  --danger:#ef6f6f;--danger-bg:rgba(239,111,111,.12);--danger-border:rgba(239,111,111,.32);
  --bubble-bg:#1b2733;
  --tag-1:125,136,191;--tag-2:98,218,98;--tag-3:218,150,98;--tag-4:98,218,210;--tag-5:218,98,150;
  --gl-edge:rgba(255,255,255,.17);--gl-hi:rgba(255,255,255,.20);--gl-lo:rgba(0,0,0,.35);--gl-shadow:rgba(0,0,0,.5);
  --gl-spec:rgba(255,255,255,.09);--gl-hov:rgba(255,255,255,.08);--gl-spotlight:rgba(255,255,255,.20);
  --gl:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 52,100) * 1%),transparent);
  /* плашки темнее дорожки: выделение читается как вдавленное в светлую подложку со светлой кромкой (как в первом макете) */
  --gl2:color-mix(in srgb,color-mix(in srgb,var(--side-bg) 82%,#4a7080) calc(min(var(--gl-k) * 68,100) * 1%),transparent);
  --gl-pop:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 34 + 50,100) * 1%),transparent);
  --gl-in:color-mix(in srgb,var(--bubble-bg) 74%,transparent);
  --gl-out-a:color-mix(in srgb,var(--accent) 58%,#000);--gl-out-b:color-mix(in srgb,var(--accent) 48%,#0b3d7a);
  --gl-base:color-mix(in srgb,var(--chat-bg) 70%,#000);--amb-1:color-mix(in srgb,var(--accent) 55%,#000);--amb-2:#4a4fd0;--amb-3:#a33a73;--amb-4:#a8742c;
  --scrim:rgba(0,0,0,.40);
  --stage:linear-gradient(160deg,#10181f 0%,#14201f 50%,#1b1626 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);background:var(--stage);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .5s var(--gl-ease)}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}

/* ── Стекло: панель, всплывающее, интерактивное ── web: glass.css «Конструкция стекла» */
.glass{position:relative;background:radial-gradient(120% 90% at 0% 0%,var(--gl-spec),transparent 55%),var(--gl);border:1px solid var(--gl-edge);
  -webkit-backdrop-filter:blur(var(--gl-blur)) saturate(190%);backdrop-filter:blur(var(--gl-blur)) saturate(190%);
  box-shadow:inset 0 1px 0 var(--gl-hi),inset 0 -1px 0 var(--gl-lo),0 12px 32px var(--gl-shadow)}
.glass-pop{position:relative;background:radial-gradient(120% 80% at 0% 0%,var(--gl-spec),transparent 55%),var(--gl-pop);border:1px solid var(--gl-edge);
  -webkit-backdrop-filter:blur(calc(var(--gl-blur) + 6px)) saturate(190%);backdrop-filter:blur(calc(var(--gl-blur) + 6px)) saturate(190%);
  box-shadow:inset 0 1px 0 var(--gl-hi),inset 0 -1px 0 var(--gl-lo),0 24px 60px var(--gl-shadow)}
/* Интерактивное стекло (.gi): наведение, блик за курсором, пружина при нажатии */
.gi{position:relative;transition:transform .35s var(--gl-spring),background .2s,box-shadow .2s,border-color .2s}
.gi::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s;
  background:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),var(--gl-spotlight),transparent 70%)}
.gi:hover::after{opacity:1}
.gi:hover{background-color:var(--gl2)}
.gi:active{transform:scale(.95)}

/* ── Кнопки: значок-круг, капсула-группа, текстовая капсула ── web: .icon-btn, .topbar-actions, .modal-btn-* */
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:var(--ic-m);color:var(--text2);flex:none;transition:background .2s,color .2s,transform .35s var(--gl-spring)}
.ibtn:hover{background:var(--gl-card2);color:var(--text)}
.ibtn:active{transform:scale(.92)}
.ibtn.on{background:var(--accent-soft);color:var(--accent-ink)}
.ibtn.danger:hover{background:var(--danger-bg);color:var(--danger)}
.cap{display:inline-flex;align-items:center;padding:2px;border-radius:var(--r-pill);flex:none}
.cap>button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:var(--ic-m);color:var(--text);transition:background .2s,transform .35s var(--gl-spring),color .2s}
.cap>button:hover{background:var(--gl-card2)}
.cap>button:active{transform:scale(.9)}
.cap>button.on{background:var(--accent-soft);color:var(--accent-ink)}
.btn{height:36px;padding:0 18px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--gl-card);border:1px solid var(--gl-edge);box-shadow:inset 0 1px 0 var(--gl-hi);color:var(--text);transition:background .2s,transform .35s var(--gl-spring),filter .2s,box-shadow .2s}
.btn .i{font-size:var(--ic-s)}
.btn:hover:not(:disabled){background:var(--gl-card2)}
.btn:active:not(:disabled){transform:scale(.95)}
.btn.pri{background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b));color:#fff;border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px color-mix(in srgb,var(--gl-out-b) 38%,transparent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.12);background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b))}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent-ink)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.btn.danger.fill{background:linear-gradient(140deg,var(--danger),color-mix(in srgb,var(--danger) 70%,#5a0f1a));color:#fff;border-color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px var(--danger-border)}
.btn.sm{height:30px;padding:0 14px;font-size:12.5px}

/* ── Поля, переключатель, сегменты, значки ── web: .search-wrap, .cs-inp, .cs-tg, .cs-seg */
.fld{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:var(--r-pill);background:var(--gl-hov);border:1px solid var(--gl-edge);box-shadow:inset 0 1px 3px var(--gl-lo);color:var(--text2);font-size:14px;transition:box-shadow .2s,border-color .2s}
.fld:focus-within{border-color:var(--accent);box-shadow:inset 0 1px 3px var(--gl-lo),0 0 0 3px var(--accent-soft)}
.fld.bad{border-color:var(--danger-border)}
.fld input{flex:1;min-width:0;height:100%;color:var(--text)}
.fld input::placeholder{color:var(--muted)}
.fld .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tg{position:relative;width:40px;height:24px;border-radius:99px;background:color-mix(in srgb,var(--text) 14%,transparent);box-shadow:inset 0 1px 3px var(--gl-lo);flex:none;transition:background .25s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 #fff;transition:transform .35s var(--gl-spring)}
.tg[aria-checked="true"]{background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b))}
.tg[aria-checked="true"]::after{transform:translateX(16px)}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;height:36px;padding:3px;border-radius:var(--r-pill);background:var(--gl-hov);box-shadow:inset 0 1px 3px var(--gl-lo)}
.seg button{position:relative;z-index:1;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text2);border-radius:var(--r-pill);transition:color .25s;white-space:nowrap}
.seg button.on{color:var(--text)}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:var(--r-pill);background:var(--gl2);box-shadow:inset 0 1px 0 var(--gl-hi),0 2px 8px var(--gl-shadow);transition:left .45s var(--gl-spring),width .45s var(--gl-spring)}
.seg.full{display:grid;width:auto}
.bd{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:color-mix(in srgb,var(--accent) 62%,#000);color:#fff;font-weight:600;font-size:12px;line-height:22px;text-align:center}
.bd.at{padding:0;width:22px}
.pill-tag{font-weight:600;font-size:11px;padding:1px 8px;border-radius:var(--r-pill);background:color-mix(in srgb,currentColor 14%,transparent);border:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);text-transform:uppercase}
.av.sm{width:36px;height:36px;font-size:13px}.av.xs{width:28px;height:28px;font-size:11px}.av.lg{width:44px;height:44px;font-size:15px}.av.xl{width:76px;height:76px;font-size:26px}
.av.sq{border-radius:15px}.av.hash{font-weight:600}
.av .dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--presence-online);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--side-bg) 85%,transparent)}
.av .dot.away{background:var(--presence-away)}
.av .type{position:absolute;left:-3px;top:-3px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--gl2);color:var(--accent-ink);box-shadow:0 0 0 1.5px var(--gl-edge),0 2px 6px var(--gl-shadow)}
.sep{height:1px;margin:4px 12px;background:var(--gl-lo);border:0}
html.dark .sep{background:rgba(255,255,255,.08)}

html.dark.navy{--app-bg:#111a24;--side-bg:#182430;--card-bg:#213040;--modal-bg:#1b2836;--chat-bg:#0f1b27;--bubble-bg:#213040;--text:#eef2f6;--text2:rgba(238,242,246,.74);--muted:rgba(238,242,246,.56);
  --stage:linear-gradient(160deg,#0c1520 0%,#10202c 50%,#161a2e 100%)}
/* ── Панель «Принципы» (не часть клиента) ── */
.notes{position:absolute;right:16px;top:56px;width:360px;max-height:calc(100% - 72px);overflow:auto;border-radius:var(--r-menu);padding:18px 20px;font-size:12.5px;line-height:1.55;color:var(--text2);z-index:70;
  opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .3s,transform .45s var(--gl-spring)}
.notes.show{opacity:1;transform:none;pointer-events:auto}
.notes h3{font-size:13.5px;color:var(--text);margin:12px 0 4px}.notes h3:first-child{margin-top:0}.notes li{margin:0 0 3px 16px}.notes b{color:var(--text)}
.notes table{width:100%;border-collapse:collapse;margin:4px 0}.notes td{padding:3px 0;border-bottom:1px solid var(--gl-lo)}.notes td:last-child{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}

/* ═══════════════ МОБИЛЬНЫЙ КЛИЕНТ (/m) — макет Liquid Glass ═══════════════
   Токены, стекло, кнопки, .seg/.tg/.fld/.av — те же, что в макете компьютера (блок выше).
   iOS-логика навигации: стек страниц, большие заголовки, плавающие стеклянные шапка и вкладки, шторки снизу.
   Размеры: цель нажатия ≥ 44, радиусы: телефон 58 · шапка/вкладки — капсулы · карточка 26 · шторка 32 · строка 20 */
:root{--sat:54px;--sat0:54px;--sab:34px;--r-card:26px;--r-sheet:32px;--r-row:20px}
html{position:fixed;top:0;left:0;width:100vw;height:100dvh;background:#12171d;overscroll-behavior:none}body{position:fixed;inset:0;overscroll-behavior:none}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px 0;flex:none;position:relative;z-index:60}
.bar .seg{height:34px}.bar .seg button{padding:0 12px}
.slider{display:flex;align-items:center;gap:10px;padding:0 16px;height:36px;border-radius:999px;font-size:13px;color:var(--text2);font-weight:500}
.slider input{width:100px;accent-color:var(--accent)}
.scenes{display:flex;gap:2px;padding:3px;border-radius:999px;font-size:12px;flex-wrap:wrap;justify-content:center;max-width:980px}
.scenes button{height:28px;padding:0 11px;border-radius:999px;font-weight:600;color:var(--text2);transition:background .2s,color .2s}
.scenes button:hover{background:var(--gl-card2);color:var(--text)}
.fit{flex:1;position:relative;width:100%;min-height:0}
.phone{width:393px;height:852px;position:absolute;left:0;top:0;border-radius:58px;overflow:hidden;background:var(--gl-base);isolation:isolate;transform-origin:top left;
  box-shadow:0 0 0 10px #0a0c0f,0 0 0 11px rgba(255,255,255,.2),0 40px 90px rgba(10,20,30,.45);transition:background .5s var(--gl-ease);font-size:16px}
.phone.noamb .amb{opacity:0}
.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:opacity .6s var(--gl-ease);z-index:0}
.amb i{position:absolute;border-radius:50%;filter:blur(55px);opacity:.85;transition:background .5s}
.amb i:nth-child(1){width:340px;height:340px;left:-60px;top:-80px;background:var(--amb-1)}
.amb i:nth-child(2){width:320px;height:320px;right:-110px;top:230px;background:var(--amb-2)}

.toast{position:absolute;left:50%;top:calc(var(--sat) + 10px);transform:translate(-50%,-20px) scale(.9);opacity:0;z-index:90;padding:0 18px;height:44px;border-radius:22px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;white-space:nowrap;transition:transform .45s var(--gl-spring),opacity .25s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}.toast .i{color:var(--accent-ink);font-size:18px}
/* профили, настройки */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:6px 0 16px}
.hero .av{width:104px;height:104px;font-size:36px;margin-bottom:8px}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em}.hero p{font-size:14px;color:var(--text2)}.hero p.on{color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{height:68px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent-ink);transition:transform .35s var(--gl-spring)}
.tile:active{transform:scale(.94)}.tile .i{font-size:22px}.tile.d{color:var(--danger)}
.prow{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left}
.prow .av{width:64px;height:64px;font-size:22px}.prow b{display:block;font-size:19px;font-weight:800}.prow span{font-size:14px;color:var(--text2)}
.cs-l b{font-weight:500;font-size:16px}
.mini{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;text-align:left}
.mini .av{width:40px;height:40px;font-size:14px}.mini b{display:block;font-size:15.5px;font-weight:600}.mini small{font-size:13px;color:var(--text2)}.mini .rt{flex:1}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--text) 30%,transparent);display:grid;place-items:center;color:transparent;flex:none;transition:background .2s,border-color .2s,color .2s,transform .35s var(--gl-spring)}
.mini.on .ck,.sel .ck{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.06)}
.rng{-webkit-appearance:none;appearance:none;width:130px;height:28px;background:none}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--v,50%),var(--gl-card2) var(--v,50%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.dots{display:flex;gap:10px}.dot2{width:30px;height:30px;border-radius:50%;background:var(--dot);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 8px var(--gl-shadow);transition:transform .35s var(--gl-spring),box-shadow .2s}
.dot2.on{box-shadow:0 0 0 3px var(--gl2),0 0 0 5px var(--dot)}.dot2:active{transform:scale(.9)}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 16px 14px}
.pcard{border-radius:18px;overflow:hidden;background:var(--gl-card);border:1px solid var(--gl-edge);font-size:12px;color:var(--text2);text-align:center;transition:box-shadow .2s,transform .35s var(--gl-spring)}
.pcard:active{transform:scale(.95)}.pcard.on{box-shadow:0 0 0 2px var(--accent);color:var(--accent-ink)}
.pcard i{display:block;height:44px;background:repeating-linear-gradient(45deg,var(--gl-card2) 0 6px,transparent 6px 14px)}.pcard:first-child i{background:var(--gl-inset)}
.pcard span{display:block;padding:6px}
.pvw{height:120px;border-radius:var(--r-card);margin-bottom:16px;overflow:hidden;position:relative;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:var(--gl-inset);border:1px solid var(--gl-edge)}
.pvw .m{max-width:74%;padding:6px 12px;border-radius:16px;font-size:12.5px;line-height:1.35}
.pvw .a{align-self:flex-start;background:var(--gl-in);border:1px solid var(--gl-edge)}.pvw .b{align-self:flex-end;background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b));color:#fff}
.fld.m{height:46px;margin:6px 0}
.pl{display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;background:var(--gl-inset);padding:0 6px 0 16px;border:1px solid var(--gl-edge);box-shadow:inset 0 1px 3px var(--gl-lo);width:100%;text-align:left;margin-bottom:8px}
.pl .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:84px}.pl .v{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:14px;font-weight:600}
.pl .ic{width:34px;height:34px;display:grid;place-items:center;color:var(--text2);font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:var(--r-card);overflow:hidden}
.mgrid i{display:block;aspect-ratio:1;background:conic-gradient(from var(--a,0deg) at 30% 110%,#2ed3b7,#6a6cf0,#f0a020,#2ed3b7);transition:transform .3s var(--gl-spring)}.mgrid i:active{transform:scale(.94)}
.lb{position:absolute;inset:0;z-index:85;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}.lb.on{opacity:1}
.lb i{width:100%;aspect-ratio:1;display:block;background:conic-gradient(from 210deg at 30% 120%,#2ed3b7,#6a6cf0,#f0a020,#2ed3b7)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 30px;color:var(--text2);text-align:center;font-size:14px}
.empty .ei{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:var(--accent-ink)}
.mcopy{text-align:center;font-size:12.5px;color:var(--muted);padding:6px 0 20px}
.fedit{display:flex;gap:10px;align-items:center;margin:10px 0}.fcols{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.fcols button{width:34px;height:34px;border-radius:50%;background:var(--fc);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .35s var(--gl-spring)}.fcols button.on{box-shadow:0 0 0 3px var(--gl2),0 0 0 5px var(--fc)}
.fic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;color:var(--fc);background:color-mix(in srgb,var(--fc) 18%,transparent);flex:none}
@media (max-width:520px){.bar{display:none}.phone{border-radius:0;box-shadow:none}.fit{position:fixed;top:0;left:0;width:100vw;height:100dvh}body{background:var(--gl-base)}.isl,.sbar,.home{display:none}.phone{--sat0:calc(max(14px,env(safe-area-inset-top)) / var(--sc,1));--sat:calc(var(--sat0) + 24px);--sab:calc(max(20px,env(safe-area-inset-bottom)) / var(--sc,1));touch-action:manipulation}}
@media (prefers-reduced-motion:reduce){.page,.tabview,.sheet,.cmm,.cmr,.toast{transition-duration:.01s}.amb i{animation:none!important}}

/* Служебные области iOS (резервирует система): статус-бар/остров сверху и индикатор «домой» снизу.
   Страница идёт под них (black-translucent, viewport-fit=cover), поэтому у краёв — «краевой эффект» как в iOS 26:
   размытие + плавный градиент, чтобы белое время и значки статус-бара читались на любом фоне и любой теме. */
.edge{position:absolute;left:0;right:0;pointer-events:none;z-index:8}
.edge.t{top:0;height:calc(var(--sat0) + 8px);background:linear-gradient(rgba(6,12,18,var(--ea,.5)),transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 58%,transparent);mask-image:linear-gradient(#000 58%,transparent)}
html:not(.dark) .edge.t{--ea:.46}
.edge.b{bottom:0;height:calc(var(--sab) + 22px);background:linear-gradient(transparent,color-mix(in srgb,var(--gl-base) 78%,transparent));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(transparent,#000 52%);mask-image:linear-gradient(transparent,#000 52%)}
.phone{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.phone input,.phone textarea{-webkit-touch-callout:default}

/* ── Низ в установленном приложении iOS 26+ ──
   Известная ошибка WebKit (bug 301108/316008): у веб-приложения с «Домой» при viewport-fit=cover и black-translucent
   раскладка получает высоту окна короче экрана примерно на высоту статус-бара, и низ остаётся голой полосой цвета html.
   Манифест тут ни при чём: iOS читает из него только цвет запуска. Обход: только в standalone растягиваем html на
   высоту окна + верхний отступ (но не выше 100lvh), без position:fixed (фиксированные слои тоже кончаются над полосой).
   Тогда нижняя область закрашивается самим макетом, и под парящей панелью виден список чатов. */
@media (display-mode: standalone){
  html{position:absolute;top:0;left:0;width:100%;height:min(100lvh,calc(100% + env(safe-area-inset-top,0px)));overflow:hidden}
  body{position:absolute;inset:0;height:100%;overflow:hidden}
  .fit{position:absolute;top:0;left:0;width:100%;height:100%}
}

/* Низ прозрачный: ни размытия, ни подложки, под парящими панелями виден список */
.edge.b{display:none}

/* настоящая клавиатура iOS: поле ввода над ней, страница продолжается под полосой «назад / вперёд / готово» */
.phone.kbr .comp{bottom:calc(var(--kbh,0px) + 8px)}
.phone.kbr .chat .scroll{padding-bottom:calc(var(--kbh,0px) + 78px)}
.phone.kbr .jump{bottom:calc(var(--kbh,0px) + 80px)}

/* Клавиатура: лента кончается у клавиатуры, как в /m (последнее сообщение прижато к полю ввода), а страница продолжается под ней */
.phone.kb .chat .scroll{bottom:300px;padding-bottom:78px}
.phone.kbr .chat .scroll{bottom:var(--kbh,0px);padding-bottom:78px}
.phone.kb .jump{bottom:372px}.phone.kbr .jump{bottom:calc(var(--kbh,0px) + 80px)}
.phone.kb .comp{bottom:308px}
/* копия сообщения в меню занимает ровно ширину исходного пузыря: без проценты от её ширины пузырь пересчитывал бы перенос строк и менял форму */
.cmc .mrow .bub{max-width:none;width:100%}

/* Шапка страниц: кнопка «назад» — просто стрелка, название по центру (три колонки: слева, центр, справа) */
.nav:not(.cn){display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.nav:not(.cn)>:first-child{justify-self:start}
.nav:not(.cn) .nr{justify-self:end}
.nav:not(.cn) .nt{min-width:0}
.nav:not(.cn) .nt>span{max-width:190px}

/* Бейдж дня: липнет к верху ленты внутри своей группы (position:sticky), top отсчитывается от низа верхней панели */
.day-group{display:flex;flex-direction:column}
.day{position:sticky;top:6px;z-index:5;align-self:stretch;display:flex;justify-content:center;margin:6px 0 12px;pointer-events:none}

/* Галочки «прочитано» всегда синие: не зависят ни от темы, ни от цвета акцента */
:root{--read:#3ea6ff}
.st.rd,.st.rd .i,.mrow .bub .t .i{color:var(--read)}
.mrow.out .bub .t{opacity:1;color:rgba(255,255,255,.78)}

/* Панель смайлов и GIF (как в /m): поиск, вкладки групп, сетка, переключатель «Смайлы / GIF», удаление символа */
.epanel{position:absolute;left:0;right:0;bottom:0;height:0;z-index:30;overflow:hidden;display:flex;flex-direction:column;transition:height .35s var(--gl-ease);background:color-mix(in srgb,var(--side-bg) 78%,transparent);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-top:1px solid var(--gl-edge)}
.phone.ep .epanel{height:300px}.phone.ep .kbd{height:0!important;border:0}
.ep-top{padding:8px 12px 0;flex:none}
.ep-s{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:var(--gl-hov);border:1px solid var(--gl-edge);box-shadow:inset 0 1px 3px var(--gl-lo);color:var(--muted);font-size:15px}
.ep-q{flex:1;min-width:0;height:100%;color:var(--text);font-size:16px}.ep-q::placeholder{color:var(--muted)}
.ep-tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}.ep-tabs::-webkit-scrollbar{display:none}
.ep-tab{width:40px;height:36px;border-radius:18px;font-size:20px;flex:none;display:grid;place-items:center;transition:background .25s,box-shadow .25s,transform .35s var(--gl-spring)}
.ep-tab:active{transform:scale(.9)}.ep-tab[aria-selected="true"]{background:var(--gl2);box-shadow:inset 0 1px 0 var(--gl-hi),0 2px 8px var(--gl-shadow)}
.ep-chip{height:32px;padding:0 14px;border-radius:16px;font-size:13.5px;font-weight:600;color:var(--text2);flex:none;background:var(--gl-card);border:1px solid var(--gl-edge)}
.ep-body{flex:1;min-height:0;overflow-y:auto;padding:0 8px;scrollbar-width:none}.ep-body::-webkit-scrollbar{display:none}
.ep-head{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 6px 4px}
.ep-row{display:grid;grid-template-columns:repeat(8,1fr)}
.ep-row button{height:42px;font-size:27px;border-radius:12px;display:grid;place-items:center;transition:background .15s,transform .25s var(--gl-spring)}.ep-row button:active{background:var(--gl-card2);transform:scale(1.25)}
.ep-none{padding:34px 12px;text-align:center;color:var(--muted);font-size:14px}
.ep-gif{columns:2;column-gap:6px;padding:8px 10px}
.gt{display:block;width:100%;margin-bottom:6px;border-radius:16px;break-inside:avoid;background:conic-gradient(from var(--a) at 30% 110%,#2ed3b7,#6a6cf0,#f0a020,#2ed3b7);animation:gifm 4s linear infinite;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .3s var(--gl-spring)}.gt:active{transform:scale(.95)}
@keyframes gifm{to{filter:hue-rotate(360deg)}}
.ep-dock{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 8px;flex:none;border-top:1px solid var(--gl-lo)}
.ep-sw{display:inline-flex;padding:3px;border-radius:19px;background:var(--gl-hov);box-shadow:inset 0 1px 3px var(--gl-lo)}
.ep-sw button{height:30px;padding:0 14px;border-radius:15px;font-size:13px;font-weight:600;color:var(--text2);transition:background .25s,color .25s}
.ep-sw button[aria-pressed="true"]{background:var(--gl2);color:var(--text);box-shadow:inset 0 1px 0 var(--gl-hi),0 2px 8px var(--gl-shadow)}
.ep-r{display:flex;align-items:center;gap:10px}.ep-pw{font-size:11.5px;color:var(--muted)}.ep-pw b{color:var(--text2)}
.ep-del{width:44px;height:36px;border-radius:18px;display:grid;place-items:center;font-size:24px;color:var(--text2);transition:transform .35s var(--gl-spring)}.ep-del:active{transform:scale(.88)}
.ep-sheet{display:flex;flex-direction:column;height:360px;margin:0 -6px}
.ep-sheet .ep-body{height:auto}
.bub.gifb{padding:4px}.pic.gif{width:226px;height:164px;margin:0;border-radius:18px;--a:0deg;animation:gifm 4s linear infinite;background:conic-gradient(from var(--a) at 30% 110%,#2ed3b7,#6a6cf0,#f0a020,#2ed3b7)}
.pic.gif b{position:absolute;left:8px;top:8px;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;letter-spacing:.04em}
.bub.gifb .t{position:absolute;right:10px;bottom:9px;margin:0;float:none;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,.45);color:#fff!important}

/* Панель выше (400), GIF — две колонки с вертикальной прокруткой */
.phone{--eph:400px}
.phone.ep .epanel{height:var(--eph)}
.phone.ep .comp{bottom:calc(var(--eph) + 8px)}
.phone.ep .chat .scroll{bottom:var(--eph);padding-bottom:78px}
.phone.ep .jump{bottom:calc(var(--eph) + 72px)}
.ep-gif{display:flex;gap:6px;align-items:flex-start;columns:auto;padding:8px 10px;overflow-y:auto;overflow-x:hidden}
.gcol{flex:1;min-width:0;display:flex;flex-direction:column}

/* Главные страницы (Чаты / Контакты / Настройки): большой заголовок на одном уровне с кнопкой справа сверху */
.nav.lg~.scroll{padding-top:calc(var(--sat) - 6px)}
.lt{margin-top:0;line-height:44px;padding-bottom:12px}

/* Нижняя панель вкладок компактнее */
.tabbar{padding:4px;border-radius:28px}
.tabbar .thumb{top:4px;bottom:4px;left:4px;width:84px;border-radius:24px}
.tb{width:86px;height:48px;border-radius:24px;font-size:21px;gap:1px}
.tb span{font-size:10.5px}
.tb .bd{top:1px;right:15px;min-width:18px;height:18px;font-size:10.5px;padding:0 5px;border-radius:9px}
.scroll{padding-bottom:calc(var(--sab) + 84px)}

/* Папки в списке чатов: панель прилипает под бейджем раздела (поиск уезжает вместе с лентой).
   Папки по центру, если помещаются; если нет — от левого края со скроллом (автоотступы схлопываются при переполнении) */
.fbar{position:sticky;top:50px;z-index:6;margin:0 -16px 6px}
.fbar::before{content:"";position:absolute;inset:-8px 0 -12px;background:linear-gradient(var(--gl-base) 55%,transparent);opacity:0;transition:opacity .25s;pointer-events:none}
.fbar.stuck::before{opacity:.92}
.fbar .chips{position:relative;margin:0;padding:6px 16px}
.chips.fo>:first-child{margin-left:auto}.chips.fo>:last-child{margin-right:auto}

/* Без тёмной подложки под папками: чипы остаются отдельными стеклянными капсулами, читаемость даёт их собственное размытие */
.fbar::before,.fbar.stuck::before{display:none}
.fbar .chip{-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}

/* Панель папок — стеклянная капсула (как плавающие кнопки и панель вкладок): список проходит под ней через размытие, а не через тёмную подложку */
.fbar .chip{-webkit-backdrop-filter:none;backdrop-filter:none}
.chips.fo>.fgrp{margin:0 auto;display:flex;gap:2px;padding:4px;border-radius:26px;flex:none}
.chips.fo>:first-child,.chips.fo>:last-child{margin-left:auto;margin-right:auto}
.fgrp .chip{height:36px;background:none;border-color:transparent;box-shadow:none;border-radius:22px}
.fgrp .chip.on{background:var(--gl2);border-color:transparent;color:var(--accent-ink);box-shadow:inset 0 1px 0 var(--gl-hi),0 2px 8px var(--gl-shadow)}

/* Без подложки под папками: капсула-контейнер прозрачная, каждая папка — отдельная стеклянная таблетка с собственным размытием */
.chips.fo>.fgrp,.chips.fo>.fgrp.glass{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;gap:8px;border-radius:0}
.chips.fo>.fgrp::before,.chips.fo>.fgrp::after{display:none}
.fgrp .chip{background:var(--gl);border:1px solid var(--gl-edge);box-shadow:inset 0 1px 0 var(--gl-hi),0 2px 10px var(--gl-shadow);border-radius:18px;-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%)}
.fgrp .chip.on{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent-ink);box-shadow:inset 0 1px 0 var(--gl-hi),0 2px 10px var(--gl-shadow)}

/* Папки — единая стеклянная капсула, как нижняя панель вкладок. Под ней нет подложки; тень мягкая и короткая,
   а у контейнера с прокруткой (он режет всё, что выходит за его край) оставлены поля под тень: иначе её обрезало бы ровной линией */
.fbar{display:flow-root}
.fbar .chips{padding:10px 16px 26px;margin:-4px 0 -20px}
.chips.fo>.fgrp,.chips.fo>.fgrp.glass{margin:0 auto;display:flex;gap:2px;padding:4px;border-radius:26px;flex:none;
  background:radial-gradient(120% 90% at 0% 0%,var(--gl-spec),transparent 55%),var(--gl);border:1px solid var(--gl-edge);
  -webkit-backdrop-filter:blur(var(--gl-blur)) saturate(190%);backdrop-filter:blur(var(--gl-blur)) saturate(190%);
  box-shadow:inset 0 1px 0 var(--gl-hi),inset 0 -1px 0 var(--gl-lo),0 10px 18px -10px var(--gl-shadow)}

  --gl-inset:color-mix(in srgb,var(--text) 5%,var(--side-bg));
  --gl-edge:transparent;--gl-hi:transparent;--gl-lo:color-mix(in srgb,var(--text) 9%,transparent);
  --gl-shadow:rgba(60,40,20,.14);--gl-spec:transparent;--gl-spotlight:transparent;
  --gl-hov:color-mix(in srgb,var(--text) 5%,transparent);
  --gl-blur:0px;--gl-out-a:var(--accent-fill);--gl-out-b:var(--accent-fill);
  --gl-base:#ece9e4;--scrim:rgba(40,28,16,.32);--stage:#dedad4;
}
html.dark{
  --app-bg:#131211;--side-bg:#1d1c1a;--card-bg:#1d1c1a;--modal-bg:#1d1c1a;--chat-bg:#181715;--bubble-bg:#2a2825;
  --text:#f2efeb;--text2:#b4aea6;--muted:#968f86;
  --surf2:#292724;--sel:#2b2926;
  --accent-fill:color-mix(in srgb,var(--accent) 70%,#000);
  --flat-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --pop-shadow:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55);
  --gl-card:color-mix(in srgb,var(--text) 5%,var(--side-bg));
  --gl-card2:color-mix(in srgb,var(--text) 10%,var(--side-bg));
  --gl-inset:color-mix(in srgb,var(--text) 6%,var(--side-bg));
  --gl-lo:color-mix(in srgb,var(--text) 10%,transparent);
  --gl-shadow:rgba(0,0,0,.5);--gl-hov:color-mix(in srgb,var(--text) 7%,transparent);
  --gl-out-a:var(--accent-fill);--gl-out-b:var(--accent-fill);
  --gl-base:#0f0e0d;--scrim:rgba(0,0,0,.5);--stage:#0a0908;
}
html.dark.navy{
  --app-bg:#10161d;--side-bg:#18202a;--card-bg:#18202a;--modal-bg:#18202a;--chat-bg:#0f1b27;--bubble-bg:#213040;
  --text:#eef2f6;--text2:rgba(238,242,246,.74);--muted:rgba(238,242,246,.56);
  --surf2:#222d3a;--sel:#243242;--gl-base:#0c1219;--stage:#080c11;
}
html,body{background:var(--stage)}
html.dark .sep,.sep{background:var(--gl-lo)}

/* ───── поверхности: плоские карточки вместо стекла ───── */
.glass,.glass-pop{background:var(--side-bg);border:0;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:var(--flat-shadow)}
.glass-pop{box-shadow:var(--pop-shadow)}
.gi::after{display:none}
.gi:hover{background-color:var(--side-bg)}
.phone{background:var(--app-bg);box-shadow:0 0 0 10px #0a0c0f,0 40px 90px rgba(10,20,30,.4)}
.phone>.amb,.page>.amb{display:none}
.page.chat>.amb{display:block}
.page{background:var(--app-bg)}
.page.chat{background:var(--gl-base)}
.page:not(.base){box-shadow:-18px 0 40px rgba(40,28,16,.14)}
.edge{display:none}
.nav::before{background:linear-gradient(var(--app-bg) 38%,transparent)}
.page.chat .nav::before{background:linear-gradient(var(--gl-base) 38%,transparent)}

/* кнопки, поля, переключатели */
.ibtn{border-radius:var(--r-ctl)}
.cap{border-radius:18px}
.cap>button{border-radius:var(--r-ctl)}
.btn{border-radius:var(--r-ctl);background:var(--gl-card2);border:0;box-shadow:none}
.btn.pri{background:var(--accent-fill);color:#fff;border:0;box-shadow:none}
.btn.soft{background:var(--accent-soft);border:0;box-shadow:none}
.btn.danger{background:var(--danger-bg);border:0}
.btn.danger.fill{background:var(--danger);color:#fff;border:0;box-shadow:none}
.fld{border-radius:14px;background:var(--surf2);border:1px solid transparent;box-shadow:none}
.fld:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld.m{height:48px}
.tg{box-shadow:none}.tg::after{box-shadow:0 1px 3px rgba(0,0,0,.28)}
.tg[aria-checked="true"]{background:var(--accent-fill)}
.seg{border-radius:14px;background:var(--surf2);box-shadow:none}
.seg button{border-radius:11px}
.seg .thumb{border-radius:11px;background:var(--side-bg);box-shadow:0 1px 3px rgba(60,40,20,.14)}
html.dark .seg .thumb{background:var(--gl-card2)}
.bd,.tb .bd{background:var(--accent-fill)}
.pill-tag{border:0}
.av,.av.sq{box-shadow:none}
.av.sq{border-radius:15px}
.av .dot{box-shadow:0 0 0 2.5px var(--side-bg)}
.av .type{background:var(--side-bg);box-shadow:0 1px 3px var(--gl-shadow);border:0}
.ci,.atile span.ic{box-shadow:none}
.dot2{box-shadow:0 1px 3px var(--gl-shadow)}
.dot2.on{box-shadow:0 0 0 3px var(--side-bg),0 0 0 5px var(--dot)}
.fcols button{box-shadow:none}.fcols button.on{box-shadow:0 0 0 3px var(--side-bg),0 0 0 5px var(--fc)}
.rng::-webkit-slider-thumb{box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* шапки страниц */
.nb{border-radius:var(--r-bar)}
.nb.glass{border-radius:var(--r-bar)}
.nt>span{border-radius:var(--r-bar)}
.nr.cap{border-radius:var(--r-bar)}
.who{border-radius:var(--r-bar)}
.pinbar{border-radius:var(--r-bar)}
.jump{border-radius:var(--r-bar)}
.toast{border-radius:var(--r-bar)}
.lt{font-weight:700;letter-spacing:-.02em}

/* списки и группы */
.grp{border-radius:var(--r-card)}
.grp>*+*{border-top:1px solid var(--gl-lo)}
html.dark .grp>*+*{border-top-color:var(--gl-lo)}
.row.pinned{background:var(--surf2)}
.srch{border-radius:var(--r-bar);background:var(--side-bg);border:0;box-shadow:var(--flat-shadow);height:46px}
.srch:focus-within,.ep-s:focus-within{border-color:transparent;box-shadow:0 0 0 3px var(--accent-soft)}
.chip{background:var(--side-bg);border:0;box-shadow:var(--flat-shadow)}
.chip.on{background:var(--accent-soft);border:0;color:var(--accent-ink);box-shadow:none}
.chips.fo>.fgrp,.chips.fo>.fgrp.glass{background:none;border:0;box-shadow:none;border-radius:0;padding:0;gap:8px;-webkit-backdrop-filter:none;backdrop-filter:none}
.fgrp .chip{background:var(--side-bg);border:0;border-radius:18px;box-shadow:var(--flat-shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
.fgrp .chip.on{background:var(--accent-soft);box-shadow:none;color:var(--accent-ink)}
.fbar .chips{padding:8px 16px 14px;margin:-2px 0 -10px}
.empty .ei{box-shadow:none;background:var(--surf2)}
.tile{border-radius:var(--r-card)}
.pcard{border:0;box-shadow:inset 0 0 0 1px var(--gl-lo);border-radius:14px}
.pcard.on{box-shadow:0 0 0 2px var(--accent)}
.pvw{border:0;border-radius:var(--r-card)}
.pvw .a{background:var(--bubble-bg);border:0}
.pvw .b{background:var(--accent-fill)}
.pl{border:0;box-shadow:none;background:var(--surf2);border-radius:var(--r-bar)}
.mgrid,.mgrid.glass{border-radius:var(--r-card)}

/* нижняя панель вкладок: плоская карточка */
.tabbar,.tabbar.glass{background:var(--side-bg);border-radius:22px;box-shadow:var(--pop-shadow)}
.tabbar .thumb{border-radius:18px;background:var(--sel);box-shadow:none}
.tb{border-radius:18px}
.tb.on{color:var(--accent-ink)}

/* поле ввода, клавиатура, панель смайлов */
.comp .cbtn,.sendb{border-radius:var(--r-bar)}
.cfield{border-radius:var(--r-bar)}
.sendb.ready{background:var(--accent-fill);color:#fff;border:0;box-shadow:none}
.kbd,.epanel{background:var(--side-bg);-webkit-backdrop-filter:none;backdrop-filter:none;border-top:0;box-shadow:0 -8px 24px -12px rgba(60,40,20,.2)}
.kr button{background:var(--surf2);box-shadow:none;border-radius:8px}
.kr.last .go{background:var(--accent-fill)}
.ep-s{background:var(--surf2);border:0;box-shadow:none;border-radius:var(--r-ctl)}
.ep-tab{border-radius:var(--r-ctl)}
.ep-tab[aria-selected="true"]{background:var(--sel);box-shadow:none}
.ep-chip{background:var(--surf2);border:0;border-radius:var(--r-ctl)}
.ep-sw{background:var(--surf2);box-shadow:none;border-radius:var(--r-ctl)}
.ep-sw button{border-radius:10px}
.ep-sw button[aria-pressed="true"]{background:var(--side-bg);box-shadow:0 1px 3px rgba(60,40,20,.14)}
html.dark .ep-sw button[aria-pressed="true"]{background:var(--gl-card2)}
.ep-row button{border-radius:var(--r-ctl)}
.gt{box-shadow:none;border-radius:var(--r-card)}
.fmtbar button{border-radius:var(--r-ctl)}

/* меню по долгому нажатию, листы, меню «+» */
.cml .cmb{background:var(--scrim);-webkit-backdrop-filter:none;backdrop-filter:none}
.cmr{border-radius:22px;padding:5px}
.cmm,.upm{border-radius:var(--r-menu)}
.cmm button,.upm button{border-radius:var(--r-item)}
.sheet{border-radius:var(--r-sheet)}
.sheet .gr{opacity:.2}
.abtn{border-radius:var(--r-bar);background:var(--gl-card2);border:0;box-shadow:none}
.abtn.pri{background:var(--accent-fill);color:#fff;border:0}
.abtn.d{color:var(--danger)}
.atile span.ic{border-radius:var(--r-card)}
.lb{background:rgba(20,14,8,.86)}

/* объявления: полоса и карточка (разметка и размеры из /m) */
.annb{background:var(--side-bg);border:0;border-radius:var(--r-bar);box-shadow:var(--pop-shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
.annp{-webkit-backdrop-filter:none;backdrop-filter:none}
.annp-c{background:var(--side-bg);border:0;border-radius:var(--r-sheet);box-shadow:var(--pop-shadow)}
.annp-r{border:0}
.annp-ok{background:var(--accent-fill);border:0;border-radius:var(--r-bar)}
.ann-hint{font-size:13px;color:var(--text2);line-height:1.4;padding:2px 4px 10px}
.ann-ta{height:auto;align-items:flex-start;padding:10px 14px;border-radius:var(--r-bar);margin:0 0 4px}
.ann-ta textarea{flex:1;min-width:0;resize:none;font-size:16px;line-height:1.4;color:var(--text)}
.ann-ta textarea::placeholder{color:var(--muted)}
.ann-foot{padding:8px 4px 0;font-size:13px;color:var(--muted)}.ann-foot b{color:var(--text2)}.ann-foot b.ok{color:var(--accent-ink)}

/* «Переписка — как в клиенте»: токены области чата заданы в chat-real-m.css; сама лента */
.chat .scroll>.chatreal{flex:none}
.chatreal{font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--text)}
.cmc.chatreal{width:auto}
.vm .pl{border:0;width:36px;height:36px}

/* верхняя панель макета */
.scenes.glass{padding:3px;border-radius:14px}
.scenes button{border-radius:11px}
.chatnote{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--r-bar);background:var(--side-bg);box-shadow:var(--flat-shadow);font-size:12.5px;font-weight:600;color:var(--text2)}
.chatnote i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.bar a.scenes{border-radius:var(--r-bar);text-decoration:none}
.bar .seg{height:36px}
.slider{display:none}
.notes{border-radius:var(--r-menu)}

/* окна «Гостевая ссылка» и «Ссылка на видеозвонок» (настоящий код клиента, класс gl-m) — в стиле B */
html .gl-bg{--gl-bg2:var(--surf2);--gl-bd:var(--gl-lo);--gl-hv:var(--gl-hov);--gl-bg:var(--modal-bg);--gl-tx:var(--text);--gl-mt:var(--muted);--gl-ac:var(--accent-fill);-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.gl-bg{background:var(--scrim);font-family:var(--ff);padding:12px}
.gl-bg .gl{border:0;border-radius:var(--r-sheet);box-shadow:var(--pop-shadow);max-width:100%}
.gl-bg .gl-h{border-bottom:0;padding:16px 14px 6px 20px}
.gl-bg .gl-h b{font-size:16px}
.gl-bg .gl-top{border-bottom:0;padding:8px 20px 6px}
.gl-bg .gl-b{padding:6px 20px 20px}
.gl-bg .gl-list{border:0;border-radius:var(--r-card);background:var(--gl-card)}
.gl-bg .gl-th{border-bottom:0}
.gl-bg .gl-it+.gl-it,.gl-bg .cll .cll-it+.cll-it{border-top:1px solid var(--gl-lo)}
.gl-bg .gl input,.gl-bg .gl select,.gl-bg .gl-sel-b{border:1px solid transparent;border-radius:12px;background:var(--surf2)}
.gl-bg .gl input:focus,.gl-bg .gl-sel-b:focus-visible,.gl-bg .gl-sel.open .gl-sel-b{border-color:var(--accent)}
.gl-bg .gl button.gl-btn{border:0;border-radius:12px;background:var(--accent-fill);color:#fff}
.gl-bg .gl button.gl-btn.cll-no,.gl-bg .gl button.gl-btn.cll-act{border:0;background:var(--surf2);color:var(--text)}
.gl-bg .gl button.gl-ic.sub,.gl-bg .gl button.gl-ic.dng{background:var(--surf2);border:0}
.gl-bg .gl button.gl-ic.dng{color:var(--danger)}
.gl-bg .gl button.gl-btn.cll-yes{background:var(--danger);border:0;color:#fff}
.gl-bg .gl-new{border:0;border-radius:var(--r-card);background:var(--accent-soft)}
.gl-bg .cll .cll-ask{border:0;border-radius:12px}
.gl-pop{border:0;border-radius:14px;box-shadow:var(--pop-shadow);background:var(--side-bg)}

/* служебное */
.cell[hidden]{display:none}
/* страница под верхней не просвечивает по краю (дробный масштаб телефона оставляет колонку в 1 px) */
.page.under{visibility:hidden;transition:transform .45s var(--gl-ease),visibility 0s .45s}
.page.under.drag{visibility:visible;transition:none}
/* в /m у групповой подписи есть класс .gl; окно гостевой ссылки (shared/guestlinks.js) тоже называет корень .gl: сбрасываем подпись у окна */
.gl-bg>.gl{text-transform:none;letter-spacing:normal;font-weight:400;padding:0;color:var(--gl-tx)}
/* то же с .who (капсула собеседника в шапке чата): в окне гостевой ссылки это просто колонка с именем */
.gl-bg .gl-it .who{height:auto;padding:0;border-radius:0;max-width:none;flex:none;align-items:stretch;gap:1px;background:none;box-shadow:none;text-align:left}
.gl-bg .gl-it .who b{font-size:var(--gl-fs);font-weight:600;display:block}
.gl-bg .gl-it .who small{font-size:calc(var(--gl-fs) - 1.5px);color:var(--gl-mt)}
/* узкая раскладка окон ссылок: в клиенте включается по ширине экрана, в макете телефон стоит в широком окне */
.gl-bg.gl-m .gl-th{display:none}
.gl-bg.gl-m .gl-it{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"who who chip" "tm acts acts";row-gap:8px}
.gl-bg.gl-m .gl-it .who{grid-area:who}.gl-bg.gl-m .gl-it .gl-chip{grid-area:chip}.gl-bg.gl-m .gl-it .gl-tm{grid-area:tm}
.gl-bg.gl-m .gl-it .gl-acts{grid-area:acts;justify-content:flex-end}
.gl-bg.gl-m .gl-top .gl-sel{flex:1;width:auto}.gl-bg.gl-m .gl-top .gl-sp{display:none}

/* ═══════════════ B v2: единая система радиусов и компоновка (кнопки/поля/вкладки 12 · карточки 16 · листы 22 · чипы 10) ═══════════════ */
:root{--r-pill:12px;--r-ctl:12px;--r-bar:12px;--r-card:16px;--r-sheet:22px;--tint:color-mix(in srgb,var(--text) 4%,var(--side-bg));--bar-sh:0 8px 20px -10px rgba(60,40,20,.18);--bar-sh-up:0 -8px 20px -10px rgba(60,40,20,.14)}
html.dark{--bar-sh:0 8px 20px -10px rgba(0,0,0,.5);--bar-sh-up:0 -8px 20px -10px rgba(0,0,0,.5)}
.phone,.page,.page.base{background:var(--side-bg)}
.phone>.amb,.page>.amb,.page.chat>.amb{display:none}
.page.chat{background:var(--chat-bg)}
.nav::before,.page.chat .nav::before{background:linear-gradient(var(--side-bg) 38%,transparent)}

/* кнопки, поля, чипы: 12 */
.ibtn,.cap,.cap>button,.btn,.btn.sm,.abtn,.fld,.fld.m,.srch,.nb,.nb.glass,.nr.cap,.who,.pinbar,.jump,.toast,.chip,.fgrp .chip,.tile,.sendb,.comp .cbtn,.cfield,.ep-s,.ep-tab,.ep-chip,.ep-sw,.ep-del,.fmtbar button,.cmr button,.upm button,.cmm button,.pl,.annb-x,.annp-ok,.fic,.fedit .fic,.kr button,.tb,.gl-bg .gl-x{border-radius:12px}
.kr button{border-radius:10px}
.chip,.fgrp .chip{height:36px;box-shadow:none;background:var(--surf2)}
.chip.on,.fgrp .chip.on{background:var(--accent-soft);color:var(--accent-ink)}
.srch{background:var(--surf2);box-shadow:none;height:44px}
.fld{background:var(--surf2)}
.ck{border-radius:8px}
.dot2{width:30px;height:30px;border-radius:10px;box-shadow:none}.dot2.on{box-shadow:0 0 0 2px var(--side-bg),0 0 0 4px var(--dot)}
.accbar .dot2{width:22px;height:22px;border-radius:7px}
.fcols button{border-radius:10px}.fcols button.on{box-shadow:0 0 0 2px var(--side-bg),0 0 0 4px var(--fc)}
.empty .ei{border-radius:16px;background:var(--surf2);box-shadow:none}
.av .type{border-radius:6px}
.annp-r{border-radius:10px}
.pill-tag{border-radius:10px;border:0;background:color-mix(in srgb,currentColor 12%,transparent)}
.av.sq{border-radius:12px}

/* карточки 16, листы и окна 22 */
.grp,.grp.glass,.tile,.tile.glass,.glass.cell,.pcard,.pvw,.mgrid,.gl-bg .gl-list{border-radius:16px}
.grp,.grp.glass,.tile,.tile.glass,.glass.cell,.pl{background:var(--tint);box-shadow:none;border:0}
.row.pinned{background:color-mix(in srgb,var(--text) 6%,var(--side-bg))}
.cmr,.cmm,.upm{border-radius:16px}
.sheet,.annp-c,.gl-bg .gl{border-radius:22px}
.cell{padding:10px 16px;min-height:52px}
.ci{width:32px;height:32px;border-radius:10px;font-size:18px}
.gl{padding:2px 4px 8px}
.pcard{background:var(--tint);box-shadow:none}.pcard.on{box-shadow:0 0 0 2px var(--accent)}
.pvw{background:var(--tint)}

/* переключатель, сегмент, слайдер */
.tg{width:40px;height:24px;border-radius:8px;background:color-mix(in srgb,var(--text) 16%,var(--side-bg));box-shadow:none;transition:background .15s}
.tg::after{top:3px;left:3px;width:18px;height:18px;border-radius:6px;background:#fff;box-shadow:none;transition:transform .15s ease}
.tg[aria-checked="true"]{background:var(--accent-fill)}.tg[aria-checked="true"]::after{transform:translateX(16px)}
.seg{border-radius:14px;background:var(--surf2);box-shadow:none}
.seg button{border-radius:10px}
.seg .thumb{border-radius:10px;background:var(--side-bg);box-shadow:0 1px 3px rgba(60,40,20,.14);transition:left .2s ease,width .2s ease}
html.dark .seg .thumb{background:var(--gl-card2)}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px}
.rng::-webkit-slider-thumb{width:18px;height:18px;margin-top:-6px;border-radius:6px;background:#fff;box-shadow:none}
.gi,.ibtn,.btn,.abtn,.chip,.tb,.tile,.nb{transition:background .15s,color .15s}
.gi:active,.ibtn:active,.btn:active,.abtn:active,.chip:active,.tb:active,.tile:active,.nb:active,.cap>button:active{transform:none;background:var(--gl-card2)}

/* нижняя панель: плоская, на всю ширину */
.tabbar,.tabbar.glass{left:0;right:0;bottom:0;transform:none;width:auto;border-radius:0;padding:6px 8px calc(var(--sab) - 14px);gap:0;background:var(--side-bg);box-shadow:var(--bar-sh-up)}
.tabbar .thumb{display:none}
.tb{flex:1;width:auto;height:56px;font-size:22px;gap:3px;color:var(--text2);background:none!important}
.tb span{font-size:11px;font-weight:600}
.tb .bd{top:2px;right:calc(50% - 32px)}
.scroll{padding-bottom:calc(var(--sab) + 90px)}

/* шапки страниц: плоская прикреплённая панель, название — текстом по центру */
.nav{padding:calc(var(--sat) - 6px) 10px 8px;gap:6px}
.page:not(.base) .nav,.nav.sc{background:var(--side-bg);box-shadow:var(--bar-sh)}
.page:not(.base) .nav::before,.nav.sc::before{display:none}
.nav.lg:not(.sc){background:none;box-shadow:none}
.nb,.nb.glass{background:none;box-shadow:none;min-width:40px;height:40px;padding:0 8px;font-size:20px}
.nr.cap,.nr.cap.glass{background:none;box-shadow:none;padding:0;gap:2px}
.nr.cap button,.cap>button{width:40px;height:40px}

<script>
// Форматирование сообщений: поле ввода с оформлением прямо в поле, блоки кода, превью ссылок.
// Общий для Electron-клиента, веб-клиента и мобильной версии (копии лежат в client/src, server/src/public/shared
// и server/src/public/m/js — правятся вместе). Разметка сообщения: **жирный**, __курсив__, `код`, блок кода в ```.
// Поле ввода — contenteditable: сообщение хранится строкой разметки, поле показывает её уже оформленной.
(function (g) {
  const ZW = '​';
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ── Общие правила разметки ──
  // Блок кода: строки между рядами из трёх и более обратных кавычек. Если в самом коде есть ```, ограда длиннее (````):
  // закрывает блок только ряд той же длины
  const fenceRe = () => /(`{3,})\n?([\s\S]*?)\n?\1(?!`)/g;
  // Курсив __x__ не срабатывает внутри слова и идентификатора (snake__case__name), жирный — как был
  const ITAL = (() => { try { return new RegExp('(^|[^\\p{L}\\p{N}_])__([^_\\n]+)__(?![\\p{L}\\p{N}_])', 'gu'); } catch { return /(^|[^\w])__([^_\n]+)__(?!\w)/g; } })();
  const BOLD = /\*\*([^*\n]+)\*\*/g;
  const SECRET = /\|\|(?! )([^|\n]*[^|\n ])\|\|/g;
  // Пустым считается и сообщение из одних невидимых знаков (нулевой пробел, соединитель, брайлевский пробел, hangul filler...)
  const BLANK = (() => { try { return new RegExp('^[\\p{White_Space}\\p{Default_Ignorable_Code_Point}\\u2800\\u3164]*$', 'u'); } catch { return /^[\s\u00ad\u034f\u061c\u115f\u1160\u17b4\u17b5\u180b-\u180f\u200b-\u200f\u202a-\u202e\u2060-\u206f\u2800\u3164\ufe00-\ufe0f\ufeff\uffa0]*$/; } })();
  const isBlank = s => !s || BLANK.test(String(s));
  // Края сообщения: пустые строки в начале и пробелы в конце убираем, отступ первой строки остаётся
  const clean = s => { s = String(s == null ? '' : s).replace(/^(?:[^\S\n]*\n)+/, '').replace(/\s+$/, ''); return isBlank(s) ? '' : s; };
  const md = e => e.replace(BOLD, '<b>$1</b>').replace(ITAL, '$1<i>$2</i>');
  // Конец ссылки: знаки препинания, скобка без пары и маркеры разметки (** __ ||) в адрес не входят
  function splitUrl(u) {
    let tail = '';
    for (;;) {
      let m = u.match(/(?:_{2,}|[.,;:!?»”'*|])$/);
      if (!m) { const c = u.slice(-1), o = c === ')' ? '(' : c === ']' ? '[' : ''; if (o && u.split(c).length > u.split(o).length) m = [c]; }
      if (!m) break;
      tail = m[0] + tail; u = u.slice(0, u.length - m[0].length);
    }
    return { url: u, tail };
  }
  // Последовательность символов по буквам-как-видит-человек: смайл с модификатором или флаг — один знак

      var r = await o.request('POST', '/guest/links', { chat_id: o.chatId, ttl_sec: Number($('[data-sel="ttl"]').dataset.value) });
      b.disabled = false;
      if (!r.ok) { $('#gl-err').textContent = (r.data && r.data.error) || 'Не удалось создать ссылку'; return; }
      $('#gl-new').innerHTML = '<div class="gl-new"><p class="gl-note" style="color:inherit">Ссылка создана. Скопируйте её сейчас: потом она не показывается, останется только отозвать и создать новую.</p><div class="gl-grid"><input id="gl-url" readonly value="' + esc(r.data.url) + '"><button class="gl-btn" id="gl-copy">Копировать</button></div></div>';
      var url = $('#gl-url'); url.focus(); url.select();
      $('#gl-copy').onclick = function () {
        var t = this, done = function () { t.textContent = 'Скопировано'; setTimeout(function () { t.textContent = 'Копировать'; }, 1800); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(r.data.url).then(done, function () { url.select(); document.execCommand('copy'); done(); });
        else { url.select(); document.execCommand('copy'); done(); }
      };
      load();
    };
    $('#gl-list').addEventListener('click', async function (e) {
      var ex = e.target.closest('[data-extend]');
      if (ex) { var sel = bg.querySelector('[data-sel="ext' + ex.dataset.extend + '"]'); ex.disabled = true; var er = await o.request('POST', '/guest/links/' + ex.dataset.extend + '/extend', { add_sec: Number(sel.dataset.value) });
        if (!er.ok) { ex.disabled = false; $('#gl-err').textContent = (er.data && er.data.error) || 'Не удалось продлить'; } else { $('#gl-err').textContent = ''; load(); } return; }
      var rv = e.target.closest('[data-revoke]'), rs = e.target.closest('[data-reset]');
      if (rv) { if (rv.dataset.sure !== '1') { rv.dataset.sure = '1'; rv.classList.add('ask'); rv.textContent = 'Точно?'; setTimeout(function () { if (rv.isConnected) { rv.dataset.sure = ''; rv.classList.remove('ask'); rv.innerHTML = IC.ban; } }, 3000); return; }
        await o.request('DELETE', '/guest/links/' + rv.dataset.revoke); load(); }
      if (rs) { var r = await o.request('POST', '/guest/links/' + rs.dataset.reset + '/reset-device'); if (!r.ok) $('#gl-err').textContent = (r.data && r.data.error) || 'Не удалось сбросить'; else load(); }
    });
    var timer = setInterval(function () {
      if (!bg.isConnected) { clearInterval(timer); return; }
      bg.querySelectorAll('.gl-tm').forEach(function (el) { el.textContent = fmtHM(Number(el.dataset.exp)); });
    }, 5000);
    load();
  }
  window.GuestLinks = { open: open, ensureCss: ensureCss };
})();

<script>

//   CallLinks.open({ base, request(method, path, body) → Promise<{ ok, status, data }> })   base — адрес сервера, например https://chat.example.com
(function () {
  'use strict';
  var TTLS = [['2 часа', 7200], ['8 часов', 28800], ['Сутки', 86400], ['3 суток', 259200], ['Неделя', 604800]];
  var WARN = {
    not_public: 'Сервер звонков не отмечен как доступный из интернета: гости вне вашей сети не смогут подключиться (раздел «Звонки» в админке).',

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmtAt = function (ts) { return new Date(ts * 1000).toLocaleString('ru', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };

    '.cll .cll-it{display:flex;flex-direction:column;gap:8px;padding:10px 12px}.cll .cll-it+.cll-it{border-top:1px solid var(--gl-bd)}' +
    '.cll .cll-url{display:flex;gap:8px;align-items:center}.cll .cll-url input{flex:1}' +
    '.cll .cll-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:calc(var(--gl-fs) - 1px);color:var(--gl-mt)}.cll .cll-meta .sp{flex:1}' +
    '.cll .cll-ask{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:var(--gl-r);background:color-mix(in srgb,var(--gl-bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--gl-bad) 30%,transparent);line-height:1.35}.cll .cll-ask .sp{flex:1}' +
    '.cll .cll-ask .q{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}.cll .cll-ask .q b{font-size:var(--gl-fs)}.cll .cll-ask .q small{font-size:calc(var(--gl-fs) - 1.5px);color:var(--gl-mt)}' +
    /* в веб клиенте кнопки окон — «таблетки» со своим цветом (glass.css): перебиваем их по весу селектора */
    '.cll button.gl-btn.cll-no,.cll button.gl-btn.cll-act,.gl-bg:not(.gl-adm):not(.gl-m) .cll button.gl-btn.cll-no:not(.gl-ic),.gl-bg:not(.gl-adm):not(.gl-m) .cll button.gl-btn.cll-act:not(.gl-ic){border:1px solid var(--gl-bd);background:transparent;color:var(--gl-tx)}' +
    '.cll button.gl-btn.cll-no:hover:not(:disabled),.cll button.gl-btn.cll-act:hover:not(:disabled){background:var(--gl-hv);filter:none}' +
    '.cll button.gl-btn.cll-yes,.gl-bg:not(.gl-adm):not(.gl-m) .cll button.gl-btn.cll-yes:not(.gl-ic){border:1px solid var(--gl-bad);background:var(--gl-bad);color:#fff}' +
    '.cll .cll-nm{flex:1 1 200px;min-width:0}.cll .cll-tt{font-size:var(--gl-fs);font-weight:600;overflow-wrap:anywhere}' +
    '.cll .cll-warn{color:var(--gl-wn);font-size:calc(var(--gl-fs) - .5px);line-height:1.45;margin:0}';
  var IC_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';

  function open(o) {
    if (document.querySelector('.gl-bg')) return;
    if (window.GuestLinks && GuestLinks.ensureCss) GuestLinks.ensureCss();
    if (!document.getElementById('cll-css')) { var st = document.createElement('style'); st.id = 'cll-css'; st.textContent = CSS; document.head.appendChild(st); }
    var bg = document.createElement('div'); bg.className = 'gl-bg' + (true ? ' gl-m' : '');
    bg.innerHTML = '<div class="gl cll" role="dialog" aria-label="Ссылка на видеозвонок"><div class="gl-h"><div class="tt"><b>Ссылка на видеозвонок</b><small>Для гостей без учётной записи</small></div><button class="gl-x" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>' +
      '<div class="gl-top"><input class="cll-nm" id="cll-nm" maxlength="80" placeholder="Название звонка (необязательно)" aria-label="Название звонка" autocomplete="off"><select class="cll-ttl" aria-label="Срок ссылки">' + TTLS.map(function (t, i) { return '<option value="' + t[1] + '"' + (i === 2 ? ' selected' : '') + '>' + t[0] + '</option>'; }).join('') + '</select><button class="gl-btn" id="cll-make">Создать ссылку</button><span class="gl-sp"></span></div>' +
      '<div class="gl-b"><p class="gl-note">Тот, кто создал ссылку, ведёт звонок: гостей он впускает сам. Сотрудники входят без подтверждения. Если удалить ссылку, новые гости не войдут, а идущий звонок продолжится.</p>' +
      '<div id="cll-warn"></div><div class="gl-err" id="cll-err"></div><div class="gl-list" id="cll-list"></div></div></div>';
    (document.getElementById('layer')||document.body).appendChild(bg);
    var $ = function (s) { return bg.querySelector(s); };
    var closed = false, timer = null;
    var close = function () {

      bg.classList.add('closing'); var done = function () { bg.remove(); };

    };
    var onKey = function (e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    document.addEventListener('keydown', onKey, true);
    bg.addEventListener('mousedown', function (e) { if (e.target === bg) close(); });
    $('.gl-x').onclick = close;
    var urlOf = function (l) { return String(o.base || location.origin).replace(/\/+$/, '') + '/k/' + l.token; };

    var links = [], ask = null, askT = null;
    var setAsk = function (v) { ask = v; clearTimeout(askT); if (v) askT = setTimeout(function () { ask = null; paint(true); }, 8000); paint(true); };
    function paint(force) {
      var box = $('#cll-list'); if (!box) return;

      var sig = JSON.stringify([links.map(function (l) { return [l.id, l.live, l.people, l.waiting, l.expires_at, l.title]; }), ask]);
      if (!force && box.dataset.sig === sig && box.children.length) return;
      box.dataset.sig = sig;

            '<button class="gl-btn cll-no" data-ask-no>Отмена</button><button class="gl-btn cll-yes" data-ask-yes="' + ask.kind + '" data-id="' + l.id + '">' + (end ? 'Завершить' : 'Удалить') + '</button></div>';

            (l.live ? '<button class="gl-btn cll-act" data-end="' + l.id + '">Завершить звонок</button>' : '') +
            '<button class="gl-btn gl-ic dng" data-del="' + l.id + '" title="Удалить ссылку" aria-label="Удалить ссылку">' + IC_X + '</button></div>';
        }
        return '<div class="cll-it" data-id="' + l.id + '">' + (l.title ? '<div class="cll-tt">' + esc(l.title) + '</div>' : '') + '<div class="cll-url"><input readonly value="' + esc(urlOf(l)) + '" aria-label="Ссылка"><button class="gl-btn" data-copy="' + l.id + '">Копировать</button></div>' + tail + '</div>';
      }).join('') : '<div class="gl-none">Ссылок пока нет</div>';

      var box = $('#cll-list'); if (!box) return;

      var b = this; b.disabled = true; $('#cll-err').textContent = '';
      var r = await o.request('POST', '/calllinks', { ttl: Number($('.cll-ttl').value), title: $('#cll-nm').value.trim() });
      b.disabled = false;
      if (!r.ok) { $('#cll-err').textContent = (r.data && r.data.error) || 'Не удалось создать ссылку'; return; }
      $('#cll-nm').value = '';

    };
    $('#cll-list').addEventListener('click', async function (e) {
      var cp = e.target.closest('[data-copy]');
      if (cp) {
        var l = links.filter(function (x) { return String(x.id) === cp.dataset.copy; })[0]; if (!l) return;
        var url = urlOf(l), inp = cp.parentNode.querySelector('input'), done = function () { cp.textContent = 'Скопировано'; setTimeout(function () { cp.textContent = 'Копировать'; }, 1800); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { inp.select(); document.execCommand('copy'); done(); });
        else { inp.select(); document.execCommand('copy'); done(); }
        return;

        var jl = links.filter(function (x) { return String(x.id) === jn.dataset.join; })[0];
        if (jl && o.join) { close(); o.join(jl.token); }
        return;
      }
      var en = e.target.closest('[data-end]'), dl = e.target.closest('[data-del]');

      if (e.target.closest('[data-ask-no]')) { setAsk(null); return; }

        setAsk(null); load();
      }
    });
    timer = setInterval(function () { if (!bg.isConnected) { clearInterval(timer); return; } load(); }, 4000);
    load();
  }
  window.CallLinks = { open: open };
})();

const GIFQ=['Привет','Круто','Спасибо','Ура','Ок','Смеюсь','Думаю','Танцую'];

const epGrid=secs=>secs.map(g=>`<div class="ep-head" data-head="${g.key}">${g.name}</div><div class="ep-row" data-row="${g.key}">${g.items.map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div>`).join('');
const epTabs=()=>`<div class="ep-tabs">${EG.map((g,i)=>`<button class="ep-tab" data-key="${g.key}" title="${g.name}" aria-selected="${i===0}">${g.icon}</button>`).join('')}</div>`;

function epSearch(q){q=q.trim().toLowerCase();const seen=new Set(),hits=[];
  const add=e=>{if(!seen.has(e)){seen.add(e);hits.push(e)}};
  Object.keys(EKW).forEach(k=>{if(k.includes(q))[...EKW[k].match(/\p{Extended_Pictographic}️?/gu)||[]].forEach(add)});
  EG.slice(1).forEach(g=>{if(g.name.toLowerCase().includes(q))g.items.forEach(add)});
  return hits}
/* привязка: вкладки прокручивают к группе, прокрутка подсвечивает вкладку, поиск подменяет сетку; pick(e) — выбор смайла */
function epBind(root,pick){const eg=$('.ep-body',root),tabs=$('.ep-tabs',root),q=$('.ep-q',root);if(!eg)return;const all=eg.innerHTML;let lock=null;
  const sync=()=>{if(lock||!tabs)return;const top=eg.getBoundingClientRect().top;let cur=null,first=null,last=null;
    $$('[data-row]',eg).forEach(r=>{if(!first)first=r.dataset.row;last=r.dataset.row;if((r.getBoundingClientRect().top-top)/sc<=34)cur=r.dataset.row});
    if(eg.scrollHeight-eg.scrollTop-eg.clientHeight<4)cur=last;cur=cur||first;
    $$('.ep-tab',tabs).forEach(t=>{const on=t.dataset.key===cur;if(t.getAttribute('aria-selected')!==String(on)){t.setAttribute('aria-selected',on);if(on)tabs.scrollTo({left:t.offsetLeft-(tabs.clientWidth-t.offsetWidth)/2,behavior:'smooth'})}})};
  eg.addEventListener('scroll',sync,{passive:true});['touchstart','wheel','pointerdown'].forEach(ev=>eg.addEventListener(ev,()=>{lock=null},{passive:true}));
  tabs&&tabs.addEventListener('click',e=>{const t=e.target.closest('.ep-tab');if(!t)return;lock=t.dataset.key;$$('.ep-tab',tabs).forEach(x=>x.setAttribute('aria-selected',x===t));
    tabs.scrollTo({left:t.offsetLeft-(tabs.clientWidth-t.offsetWidth)/2,behavior:'smooth'});
    const row=$(`[data-row="${t.dataset.key}"]`,eg),head=$(`[data-head="${t.dataset.key}"]`,eg);if(!row)return;
    eg.scrollTo({top:eg.scrollTop+(row.getBoundingClientRect().top-eg.getBoundingClientRect().top)/sc-(head?head.offsetHeight:0),behavior:'smooth'})});
  eg.addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(b)pick(b.dataset.e)});
  q&&q.addEventListener('input',()=>{const v=q.value.trim();tabs&&(tabs.hidden=!!v);
    if(!v){eg.innerHTML=all;eg.scrollTop=0;return}
    const r=epSearch(v);eg.innerHTML=r.length?`<div class="ep-head">Найдено: ${r.length}</div><div class="ep-row">${r.map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div>`:'<div class="ep-none">Ничего не найдено</div>';eg.scrollTop=0});
  sync()}

let epMode='emoji';
function epPanel(){let p=$('.epanel',phone);if(!p){p=document.createElement('div');p.className='epanel';phone.append(p);
    p.addEventListener('pointerdown',e=>{if(e.target.closest('button'))e.preventDefault()});
    p.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){epMode=m.dataset.m;epRender();return}
      if(e.target.closest('[data-del]')&&cur){cur.ta.value=[...cur.ta.value].slice(0,-1).join('');cur.ta.dispatchEvent(new Event('input'));return}
      const g=e.target.closest('.gt');if(g&&cur){cur.el._gif(+g.dataset.a);return}
      const gq=e.target.closest('[data-gq]');if(gq){const i=$('.ep-q',p);i.value=gq.dataset.gq;return}})}
  return p}
function epRender(){const p=epPanel(),gif=epMode==='gif';
  const gt=i=>`<button class="gt" data-a="${(i*47)%360}" style="--a:${(i*47)%360}deg;height:${[96,132,112,150,104,126,140,100][i%8]}px" aria-label="GIF ${i+1}"></button>`,tiles=[0,1].map(c=>`<div class="gcol">${Array.from({length:14},(_,k)=>gt(k*2+c)).join('')}</div>`).join('');
  p.innerHTML=(gif?`<div class="ep-top"><label class="ep-s">${I('search')}<input class="ep-q" type="search" placeholder="Поиск GIF" autocomplete="off"></label><div class="ep-tabs gq">${GIFQ.map(x=>`<button class="ep-chip" data-gq="${x}">${x}</button>`).join('')}</div></div>`:epTop())+
    `<div class="ep-body${gif?' ep-gif':''}">${gif?tiles:epGrid(EG)}</div>
     <div class="ep-dock"><div class="ep-sw"><button data-m="emoji" aria-pressed="${!gif}">Смайлы</button><button data-m="gif" aria-pressed="${gif}">GIF</button></div>
      <div class="ep-r">${gif?'<span class="ep-pw">Powered by <b>Klipy</b></span>':''}<button class="ep-del" data-del aria-label="Удалить символ">${BK}</button></div></div>`;
  if(!gif)epBind(p,e=>{if(!cur)return;cur.ta.value+=e;cur.ta.dispatchEvent(new Event('input'))})}
