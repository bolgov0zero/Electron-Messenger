<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Главная админки в новом стиле</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Нынешняя главная админки (сервер, показатели, «Требует внимания», хроника, ресурсы, звонки, федерация) в цветах, рамках и фоне варианта C.
   Без теней и стекла: рамка 1px, радиус 14, синий акцент, тёмная плашка сервера. Данные вымышленные. */
:root{
  --f:'Onest',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;
  --pg:#e8eaee;--bg:#f6f7f9;--sf:#fff;--ink:#0b1220;--mute:#586377;--line:#e3e6ec;--soft:#eef0f4;
  --ac:#3a4fff;--act:#3345e6;--acs:rgba(58,79,255,.09);--on-ac:#fff;
  --ok:#1fb77a;--okt:#0f7a54;--warn:#f0a000;--warnt:#8f5a00;--bad:#e5484d;--badt:#c0282d;
  --okb:rgba(31,183,122,.12);--warnb:rgba(240,160,0,.14);--badb:rgba(229,72,77,.11)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pg:#06080c;--bg:#0a0d14;--sf:#121722;--ink:#e9edf5;--mute:#9aa5ba;--line:#212838;--soft:#1a2030;
  --ac:#8ea0ff;--act:#a3b1ff;--acs:rgba(142,160,255,.14);--on-ac:#0a0d14;
  --ok:#3ddc97;--okt:#4ade80;--warn:#fbbf24;--warnt:#fbbf24;--bad:#f87171;--badt:#fca5a5;
  --okb:rgba(61,220,151,.13);--warnb:rgba(251,191,36,.14);--badb:rgba(248,113,113,.14);color-scheme:dark}}
:root[data-theme="dark"]{
  --pg:#06080c;--bg:#0a0d14;--sf:#121722;--ink:#e9edf5;--mute:#9aa5ba;--line:#212838;--soft:#1a2030;
  --ac:#8ea0ff;--act:#a3b1ff;--acs:rgba(142,160,255,.14);--on-ac:#0a0d14;
  --ok:#3ddc97;--okt:#4ade80;--warn:#fbbf24;--warnt:#fbbf24;--bad:#f87171;--badt:#fca5a5;
  --okb:rgba(61,220,151,.13);--warnb:rgba(251,191,36,.14);--badb:rgba(248,113,113,.14);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--pg);color:var(--ink);padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
::selection{background:var(--acs);color:var(--ink)}
*{scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{max-width:1320px;margin:0 auto 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:700;flex:1;min-width:220px}.top h1 span{color:var(--mute);font-weight:500}
.tg{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--sf);font-size:12.5px;font-weight:600;color:var(--mute)}
.stage{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:28px;align-items:start}
.lab{font-size:12.5px;color:var(--mute);margin:0 4px 10px}.lab b{color:var(--ink)}
@media (max-width:1180px){.stage{grid-template-columns:1fr;justify-items:center}.stage>section{width:100%}.stage>section:last-child{display:flex;flex-direction:column;align-items:center}}
.dev{height:860px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--bg)}
.dev.mob{width:390px;max-width:100%;border-radius:32px;border:8px solid var(--ink)}

/* ═══ каркас ═══ */
.fr{position:relative;display:flex;height:100%;container:fr/inline-size;background:var(--bg);font-size:14px;line-height:1.45}
.side{width:228px;flex:none;background:var(--sf);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.lg{font-weight:800;font-size:15px;padding:2px 10px 14px;display:flex;align-items:center;gap:9px}.lg i{width:22px;height:22px;border-radius:7px;background:var(--ac);display:block}
.gh{font-size:12px;font-weight:600;color:var(--mute);padding:14px 10px 5px}
.ni{display:flex;align-items:center;gap:11px;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--mute);text-align:left;width:100%;transition:background .15s,color .15s}
.ni:hover{background:var(--soft);color:var(--ink)}.ni .i{font-size:17px}
.ni.on{background:var(--acs);color:var(--act);font-weight:700}
.ni .n{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--mute)}.ni .n.w{color:var(--warnt)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;background:var(--acs);color:var(--act)}
.me b{display:block;font-size:13px}.me span{font-size:12px;color:var(--mute)}
.main{flex:1;min-width:0;overflow:auto;padding:24px 28px 34px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd h2{font-size:24px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:120px}
.sr{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;background:var(--sf);border:1px solid var(--line);color:var(--mute);font-size:13px;min-width:210px}
.sr kbd{margin-left:auto;font:600 11px var(--m);padding:1px 6px;border-radius:5px;background:var(--soft)}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--sf);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,transform .15s}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}.btn .i{font-size:15px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--okt)}.chip.warn{background:var(--warnb);color:var(--warnt)}.chip.bad{background:var(--badb);color:var(--badt)}.chip.n{background:var(--soft);color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mute)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}.ch h3{font-size:15px;font-weight:700;flex:1;display:flex;align-items:center;gap:9px;letter-spacing:-.005em}
.cb{padding:6px 18px 18px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--soft)}
.seg button{height:26px;padding:0 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.bn{display:none}
.toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,12px);z-index:40;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* ═══ блоки главной ═══ */
.core{padding:20px 22px;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.core .ci{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--bg) 14%,transparent);display:grid;place-items:center;font-size:21px}
.core .tt{flex:1;min-width:210px}.core h3{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.01em}
.core p{font-size:13px;margin-top:3px;color:color-mix(in srgb,var(--bg) 68%,transparent)}
.core .chip{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.core .ms{display:flex;gap:26px;flex-wrap:wrap}.core .ms span{display:block;font-size:12px;color:color-mix(in srgb,var(--bg) 62%,transparent)}.core .ms b{font:600 17px var(--m);color:var(--bg)}
.core .btn{background:color-mix(in srgb,var(--bg) 12%,transparent);border-color:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}.core .btn:hover{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px}.kpi .l{font-size:13px;font-weight:600;color:var(--mute)}
.kpi .v{display:flex;align-items:baseline;gap:7px;margin:8px 0 2px}.kpi .v b{font-size:30px;letter-spacing:-.03em}.kpi .v small{font-size:13px;color:var(--mute)}
.kpi .s{font-size:12.5px;color:var(--mute)}.kpi .s.w{color:var(--badt);font-weight:600}
.kpi svg.sp{display:block;width:100%;height:36px;margin-top:10px}
.areas{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}.areas>*{min-width:0}
.a8{grid-column:span 8}.a4{grid-column:span 4}.a6{grid-column:span 6}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 18px}
.tabs button{height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--acs);color:var(--act)}
.tabs .n{font-size:10.5px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;line-height:16px}
.li{display:flex;align-items:center;gap:13px;padding:13px 0}.li+.li{border-top:1px solid var(--line)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:14px;font-weight:600}.li .t span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:9px 0;font-size:13.5px}.ev+.ev{border-top:1px solid var(--line)}
.ev time{font:500 12px var(--m);color:var(--mute);padding-top:2px}.ev small{display:block;color:var(--mute);font-size:12px}
.kv{display:flex;flex-direction:column;gap:14px}.kv .r{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}.kv .r span{color:var(--mute)}
.meter{height:7px;border-radius:4px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;border-radius:4px;background:var(--ac)}.meter.w i{background:var(--warn)}.meter.b i{background:var(--bad)}
.stk{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:2px;background:var(--soft)}.stk i{display:block}
.lg2{display:flex;flex-direction:column;gap:8px;margin-top:14px}.lg2 div{display:flex;align-items:center;gap:9px;font-size:13.5px}.lg2 i{width:9px;height:9px;border-radius:3px}.lg2 b{margin-left:auto;font:600 12.5px var(--m)}
.cmp{display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap}
.cs{display:flex;align-items:baseline;gap:6px}.cs b{font:700 19px var(--m);letter-spacing:-.02em}.cs span{font-size:13px;color:var(--mute)}
.cs+.cs{padding-left:22px;border-left:1px solid var(--line)}
.fb{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:0}
.fr2{display:flex;align-items:center;gap:11px;padding:9px 0;font-size:13.5px}.fr2+.fr2{border-top:1px solid var(--line)}.fr2 span:nth-child(2){flex:1}.fr2 small{color:var(--mute);font-size:12.5px}
.ex{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--act);margin-top:12px}
.ex .i{transition:transform .25s}.open .ex .i{transform:rotate(180deg)}
.xb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}.open .xb{grid-template-rows:1fr}.xb>div{overflow:hidden;min-height:0}
@container fr (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.a8,.a4,.a6{grid-column:1/-1}}
@container fr (max-width:720px){
  .side{display:none}.main{padding:16px 16px 96px;gap:12px}.hd h2{font-size:22px}.sr{display:none}.hd .btn.hide-m{display:none}
  .bn{display:flex;position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-top:1px solid var(--line);padding:6px 6px 14px}
  .bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0;position:relative}
  .bn button .i{font-size:21px}.bn button.on{color:var(--act)}
  .bn .n{position:absolute;top:0;left:56%;font-size:10px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;display:grid;place-items:center;padding:0 4px}
  .cs+.cs{padding-left:0;border-left:0}.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .core .ms{gap:18px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="top">
  <h1>Главная админки <span>· текущая структура в стиле варианта C</span></h1>
  <button class="tg" id="tt">Тёмная тема</button>
</div>
<main class="stage">
  <section><div class="lab"><b>Полная версия админки</b></div><div class="dev" id="d"></div></section>
  <section><div class="lab"><b>Телефон</b></div><div class="dev mob" id="m"></div></section>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const IC={home:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',layers:'<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

 box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
 gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
 shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',tag:'<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/>',
 server:'<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>',

 chev:'<path d="m6 9 6 6 6-6"/>',more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
 up:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',dn:'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const AU=ic('up'),AD=ic('dn');
const NAV=[['Обзор',[['home','Главная',0,1]]],['Управление',[['globe','Федерации',3],['layers','Пространства',1],['users','Пользователи',3],['door','Комнаты',0],['chat','Чаты и группы',1],['monitor','Клиенты',0],['bell','Уведомления',0],['folder','Файлы',3],['mega','Объявления',0],['link','Вебхуки',0],['box','Модули',0]]],['Система',[['gear','Настройки',2,0,1],['shield','Аудит-лог',0],['tag','Релизы',0]]]];
function spark(a,c){const w=120,h=36,mx=Math.max(...a),mn=Math.min(...a),p=a.map((v,i)=>[i*w/(a.length-1),h-4-(v-mn)/(mx-mn||1)*(h-10)]);const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');return`<svg class="sp" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`}
const KP=[['В сети сейчас','12','из 87','подключений: 12',[3,4,3,5,8,12,10,11,9,12,12,12],'var(--ok)'],['Сообщений за час','342','','событий нет',[120,180,150,260,310,280,360,420,380,340,360,342],'var(--ac)'],['Процессор','18','%','load 0,32 · 8 ядер',[22,18,30,26,20,18,24,19,17,21,18,18],'var(--warn)'],['Отклик сервера','3','мс','выходил за норму 2 раза',[3,3,4,3,12,3,3,3,4,3,3,3],'var(--bad)']];
const ATT=[['bad','срочно','Память занята на 99%','Свободно 142 МБ из 16 ГБ','Освободить'],['warn','важно','Резервных копий нет','Сделайте первую копию, чтобы было откуда восстановиться','Создать копию'],['warn','важно','Отклик выходил за норму','2 раза за сутки, последний раз в 00:08','Показать график']];
const ONL=[['Анна Крылова','с телефона'],['Борис Тестов','клиент'],['Дмитрий Орлов','веб'],['Елена Власова','клиент'],['Игорь Сомов','клиент']];
const CLI=[['Клиент 3.29.3','8 устройств','ok'],['Мобильный клиент','3 устройства','ok'],['Веб клиент','1 устройство','ok'],['Клиент 3.27.0','устарел, 2 устройства','warn']];
const EVT=[['00:12','Сервер запущен',''],['00:08','Отклик выходил за норму','макс 781 мс за час'],['23:41','Создана пара ключей','Партнёр Север'],['23:10','Обновление до 2.48.1','автоматически'],['22:55','Вход администратора','Administrator']];
const FED={day:[142,118,'36,2 МБ','21,0 МБ',3,2],week:[861,702,'236 МБ','141 МБ',3,10],month:[3590,2940,'1,0 ГБ','0,6 ГБ',3,38]};
const CAL={day:[81,65,49,39,16],week:[412,331,262,188,81],month:[1630,1304,1019,742,326]};
const PEERS=[['Москва · главный офис','на связи','ok'],['Филиал Казань','нет связи 12 мин','warn'],['Партнёр Север','приостановлено','n']];
const TOP=[['Анна Крылова','31 зв. · 22 мин'],['Борис Тестов','24 зв. · 17 мин'],['Дмитрий Орлов','17 зв. · 9 мин']];
const S0=()=>({tab:'attn',fed:'day',cal:'day',openF:false,openC:false});
let ST={d:S0(),m:S0()},LOADING=false;
const seg=(k,cur)=>`<div class="seg">${['day','week','month'].map(p=>`<button data-seg="${k}" data-p="${p}" aria-pressed="${cur===p}">${p==='day'?'Сутки':p==='week'?'Неделя':'Месяц'}</button>`).join('')}</div>`;
function attn(s){
  let b='';
  if(s.tab==='attn')b=ATT.map(a=>`<div class="li"><span class="chip ${a[0]}">${a[1]}</span><div class="t"><b>${a[2]}</b><span>${a[3]}</span></div><button class="btn sm" data-a data-t="${a[4]}">${a[4]}</button></div>`).join('');
  if(s.tab==='on')b=ONL.map(o=>`<div class="li"><span class="av">${o[0].split(' ').map(x=>x[0]).join('')}</span><div class="t"><b>${o[0]}</b><span>${o[1]}</span></div><span class="chip ok">в сети</span></div>`).join('');
  if(s.tab==='cli')b=CLI.map(c=>`<div class="li"><span class="dot ${c[2]}"></span><div class="t"><b>${c[0]}</b><span>${c[1]}</span></div></div>`).join('');
  if(s.tab==='act')b=`<div class="cmp" style="padding:14px 0 4px"><div class="cs"><b>342</b><span>сообщений</span></div><div class="cs"><b>28</b><span>входов</span></div><div class="cs"><b>9</b><span>файлов</span></div><div class="cs"><b>81</b><span>звонков</span></div></div>`;
  const tabs=[['attn','Внимание','3'],['on','В сети',''],['cli','Клиенты',''],['act','Активность','']];
  return `<div class="card"><div class="ch"><h3>Требует внимания</h3></div><div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" aria-pressed="${s.tab===t[0]}">${t[1]}${t[2]?`<span class="n">${t[2]}</span>`:''}</button>`).join('')}</div><div class="cb" style="padding-top:8px">${b}</div></div>`;
}
function render(f){
  const s=ST[f],el=$('#'+f),fd=FED[s.fed],c=CAL[s.cal];
  const nav=NAV.map(g=>`<div class="gh">${g[0]}</div>${g[1].map(n=>`<button class="ni${n[3]?' on':''}" data-nav="${n[1]}">${ic(n[0])}<span>${n[1]}</span>${n[2]?`<span class="n${n[4]?' w':''}">${n[2]}</span>`:''}</button>`).join('')}`).join('');
  const side=`<aside class="side"><div class="lg"><i></i>Electron</div>${nav}<div class="me"><span class="av">A</span><div><b>Administrator</b><span>@admin</span></div></div></aside>`;
  const bn=`<nav class="bn">${[['home','Главная',1,3],['users','Люди'],['chat','Чаты'],['gear','Настройки',0,2],['more','Ещё']].map(b=>`<button class="${b[2]?'on':''}" data-nav="${b[1]}">${ic(b[0])}${b[1]}${b[3]?`<span class="n">${b[3]}</span>`:''}</button>`).join('')}</nav>`;
  const hd=`<div class="hd"><h2>Главная</h2><div class="sr">${ic('search')}Перейти…<kbd>⌘K</kbd></div><button class="btn hide-m" data-a data-t="Создать пользователя">${ic('plus')}Пользователь</button><button class="btn hide-m" data-a data-t="Создать комнату">${ic('plus')}Комната</button><button class="btn pri" data-a data-t="Объявление">${ic('mega')}Объявление</button></div>`;
  const core=`<div class="core"><div class="ci">${ic('server')}</div><div class="tt"><h3>MacMiniM2.local <span class="chip">${'работает'}</span></h3><p>Debian 12 · 8 ядер · 16 ГБ ОЗУ · диск 228 ГБ</p></div><div class="ms"><div><span>Аптайм</span><b>2д 4ч</b></div><div><span>Версия</span><b>2.48.1</b></div><div><span>Подключений</span><b>12</b></div></div><button class="btn" data-upd>${LOADING?'<span class="spin"></span>Проверяем…':ic('refresh')+'Проверить обновления'}</button></div>`;
  const kpis=`<div class="kpis">${KP.map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v"><b class="num mono">${k[1]}</b><small>${k[2]}</small></div><div class="s ${k[0]==='Отклик сервера'?'w':''}">${k[3]}</div>${spark(k[4],k[5])}</div>`).join('')}</div>`;
  const chron=`<div class="card"><div class="ch"><h3>Хроника</h3><span class="chip n">сегодня</span></div><div class="cb">${EVT.map(e=>`<div class="ev"><time>${e[0]}</time><div>${e[1]}${e[2]?`<small>${e[2]}</small>`:''}</div></div>`).join('')}</div></div>`;
  const res=`<div class="card"><div class="ch"><h3>Ресурсы</h3></div><div class="cb"><div class="kv"><div><div class="r"><span>Память</span><b class="mono">15,8 из 16 ГБ</b></div><div class="meter b"><i style="width:99%"></i></div></div><div><div class="r"><span>Диск</span><b class="mono">173 из 228 ГБ</b></div><div class="meter w"><i style="width:76%"></i></div></div><div><div class="r"><span>Процессор</span><b class="mono">18%</b></div><div class="meter"><i style="width:18%"></i></div></div></div></div></div>`;
  const svc=`<div class="card"><div class="ch"><h3>Служба electron.service</h3><span class="chip ok">активна</span></div><div class="cb"><div class="kv" style="gap:0"><div class="r" style="padding:9px 0"><span>Процесс</span><b class="mono">PID 4127</b></div><div class="r" style="padding:9px 0;border-top:1px solid var(--line)"><span>Память</span><b class="mono">90 МБ</b></div><div class="r" style="padding:9px 0;border-top:1px solid var(--line)"><span>Запущена</span><b>2 мин назад</b></div></div><button class="btn sm" data-a data-t="Перезапуск" style="margin-top:8px">Перезапустить</button></div></div>`;
  const store=`<div class="card"><div class="ch"><h3>Хранилище</h3><b class="mono" style="font-size:13px">173 ГБ</b></div><div class="cb"><div class="stk"><i style="flex:2;background:var(--ac)"></i><i style="flex:1;background:var(--ok)"></i><i style="flex:1;background:var(--warn)"></i><i style="flex:60;background:var(--soft)"></i></div><div class="lg2"><div><i style="background:var(--ac)"></i>База данных<b>2,2 МБ</b></div><div><i style="background:var(--ok)"></i>Файлы чата<b>73 КБ</b></div><div><i style="background:var(--warn)"></i>Резервные копии<b>0 Б</b></div><div><i style="background:var(--soft)"></i>Система и прочее<b>171 ГБ</b></div></div></div></div>`;
  const fed=`<div class="card${s.openF?' open':''}"><div class="ch"><h3><span class="dot warn"></span>Федерация <span class="chip warn">2 из 3</span></h3>${seg('fed',s.fed)}</div><div class="cb"><div class="cmp"><div class="cs"><b>${AU}${fd[0]} ${AD}${fd[1]}</b><span>сообщений</span></div><div class="cs"><b style="font-size:16px">${AU}${fd[2]} ${AD}${fd[3]}</b><span>объём</span></div><div class="cs"><b>${fd[4]}</b><span>в очереди</span></div><div class="cs"><b>${fd[5]}</b><span>отклонено</span></div></div>
    <button class="ex" data-ex="F">Серверы ${ic('chev')}</button><div class="xb"><div><div class="fb">${PEERS.map(p=>`<div class="fr2"><span class="dot ${p[2]}"></span><span>${p[0]}</span><small>${p[1]}</small></div>`).join('')}</div></div></div></div></div>`;
  const cal=`<div class="card${s.openC?' open':''}"><div class="ch"><h3><span class="dot ok"></span>Звонки <span class="chip n">сейчас тихо</span></h3>${seg('cal',s.cal)}</div><div class="cb"><div class="cmp"><div class="cs"><b>${c[0]}</b><span>звонков</span></div><div class="cs"><b>${c[1]}</b><span>принято</span></div><div class="cs"><b>${c[2]}</b><span>минут</span></div><div class="cs"><b>${c[3]}</b><span>с видео</span></div></div>
    <div class="stk" style="margin-top:14px"><i style="flex:${c[1]};background:var(--ok)"></i><i style="flex:${c[4]};background:var(--warn)"></i></div>
    <button class="ex" data-ex="C">Кто звонит ${ic('chev')}</button><div class="xb"><div><div class="fb">${TOP.map(t=>`<div class="fr2"><span class="av">${t[0].split(' ').map(x=>x[0]).join('')}</span><span>${t[0]}</span><small>${t[1]}</small></div>`).join('')}</div></div></div></div></div>`;
  el.innerHTML=`<div class="fr">${side}<div class="main">${hd}${core}${kpis}<div class="areas"><div class="a8">${attn(s)}</div><div class="a4">${chron}</div><div class="a4">${res}</div><div class="a4">${svc}</div><div class="a4">${store}</div><div class="a6">${fed}</div><div class="a6">${cal}</div></div></div>${bn}<div class="toast" id="${f}-t"></div></div>`;
  el.onclick=e=>click(f,e);
}
function toast(f,t){const e=$('#'+f+'-t');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2300)}
function click(f,e){
  const t=e.target,s=ST[f];
  const tab=t.closest('[data-tab]');if(tab){s.tab=tab.dataset.tab;render(f);return}
  const sg=t.closest('[data-seg]');if(sg){s[sg.dataset.seg]=sg.dataset.p;render(f);return}
  const ex=t.closest('[data-ex]');if(ex){const k=ex.dataset.ex==='F'?'openF':'openC';s[k]=!s[k];ex.closest('.card').classList.toggle('open',s[k]);return}
  if(t.closest('[data-upd]')){if(LOADING)return;LOADING=true;['d','m'].forEach(render);setTimeout(()=>{LOADING=false;['d','m'].forEach(render);toast(f,'Установлена последняя версия: 2.48.1')},1300);return}
  const a=t.closest('[data-a]');if(a){toast(f,'«'+a.dataset.t+'»: в макете не выполняется');return}
  const n=t.closest('[data-nav]');if(n&&n.dataset.nav!=='Главная')toast(f,'Раздел «'+n.dataset.nav+'» в макет не входит');
}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
const tl=()=>{$('#tt').textContent=isDark()?'Светлая тема':'Тёмная тема'};
$('#tt').onclick=()=>{document.documentElement.dataset.theme=isDark()?'light':'dark';tl()};tl();
['d','m'].forEach(render);
</script>
</body>
</html>
