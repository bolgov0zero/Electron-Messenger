<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Макет: окно профиля для настольного клиента и веба</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════
   МАКЕТ: окно профиля человека, группы и комнаты — для настольного клиента и веба.
   Токены и система форм те же, что в index.html (Liquid Glass): окно 30 · панель 26 · карточка 20 · строка 18 · капсулы 999.
   Четыре варианта: A — окно в два столбца, B — панель справа рядом с чатом, C — карточка с обложкой, D — широкая шапка и вкладки.
   ════════════════════════════════════════════════════════════════════════ */
:root{
  --ff:Inter,-apple-system,system-ui,sans-serif;
  --app-bg:#eef1f4; --side-bg:#ffffff; --card-bg:#ffffff; --modal-bg:#ffffff; --chat-bg:#eef1f4;
  --text:#111318; --text2:#4f5666; --muted:#6c7484;
  --accent:#1fa88c; --accent-rgb:29,168,140; --accent-ink:color-mix(in srgb,var(--accent) 72%,#000);
  --accent-soft:rgba(var(--accent-rgb),.12); --accent-border:rgba(var(--accent-rgb),.28);
  --danger:#d23a3a; --danger-bg:rgba(210,58,58,.10); --danger-border:rgba(210,58,58,.28);
  --presence-online:#34c759; --presence-away:#ff9f0a;
  --bubble-bg:#ffffff;
  --r-panel:30px;--r-bar:26px;--r-card:20px;--r-item:14px;--r-row:18px;--r-pill:999px;
  --gl-k:1;
  --gl-blur:26px;--gl-spring:cubic-bezier(.34,1.56,.64,1);--gl-ease:cubic-bezier(.22,1,.36,1);
  --gl:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 46,100) * 1%),transparent);
  --gl2:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 66,100) * 1%),transparent);
  --gl-pop:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 30 + 50,100) * 1%),transparent);
  --gl-card:color-mix(in srgb,var(--text) 5%,transparent);
  --gl-card2:color-mix(in srgb,var(--text) 9%,transparent);
  --gl-edge:rgba(255,255,255,.75);--gl-hi:rgba(255,255,255,.85);--gl-lo:rgba(12,26,25,.07);
  --gl-shadow:rgba(20,50,60,.16);--gl-spec:rgba(255,255,255,.30);--gl-hov:rgba(255,255,255,.34);--gl-spotlight:rgba(255,255,255,.55);
  --gl-in:rgba(255,255,255,.74);
  --gl-out-a:color-mix(in srgb,var(--accent) 80%,#000);--gl-out-b:color-mix(in srgb,var(--accent) 68%,#0b4f96);
  --gl-base:#e3f0ef;--amb-1:color-mix(in srgb,var(--accent) 60%,#fff);--amb-2:#8e9cff;--amb-3:#ffb4d3;--amb-4:#ffd391;
  --scrim:rgba(20,40,50,.22);
  --stage:linear-gradient(160deg,#c9d9e6 0%,#d8e6df 50%,#e6dcec 100%);
}
html.dark{
  --app-bg:#12171d;--side-bg:#1e252d;--card-bg:#1e252d;--modal-bg:#1e252d;--chat-bg:#12171d;
  --text:#eef6f5;--text2:rgba(238,246,245,.74);--muted:rgba(238,246,245,.56);
  --accent:#29d6b8;--accent-rgb:41,214,184;--accent-ink:var(--accent);
  --danger:#ef6f6f;--danger-bg:rgba(239,111,111,.12);--danger-border:rgba(239,111,111,.32);
  --bubble-bg:#1b2733;
  --gl-edge:rgba(255,255,255,.17);--gl-hi:rgba(255,255,255,.20);--gl-lo:rgba(0,0,0,.35);--gl-shadow:rgba(0,0,0,.5);
  --gl-spec:rgba(255,255,255,.09);--gl-hov:rgba(255,255,255,.08);--gl-spotlight:rgba(255,255,255,.20);
  --gl:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 52,100) * 1%),transparent);
  --gl2:color-mix(in srgb,color-mix(in srgb,var(--side-bg) 82%,#4a7080) calc(min(var(--gl-k) * 68,100) * 1%),transparent);
  --gl-pop:color-mix(in srgb,var(--side-bg) calc(min(var(--gl-k) * 34 + 50,100) * 1%),transparent);
  --gl-in:color-mix(in srgb,var(--bubble-bg) 74%,transparent);
  --gl-out-a:color-mix(in srgb,var(--accent) 58%,#000);--gl-out-b:color-mix(in srgb,var(--accent) 48%,#0b3d7a);
  --gl-base:color-mix(in srgb,var(--chat-bg) 70%,#000);--amb-1:color-mix(in srgb,var(--accent) 55%,#000);--amb-2:#4a4fd0;--amb-3:#a33a73;--amb-4:#a8742c;
  --scrim:rgba(0,0,0,.40);
  --stage:linear-gradient(160deg,#10181f 0%,#14201f 50%,#1b1626 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--ff);background:var(--stage);background-attachment:fixed;color:var(--text);-webkit-font-smoothing:antialiased;transition:background .5s var(--gl-ease)}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* стекло */
.glass{position:relative;background:radial-gradient(120% 90% at 0% 0%,var(--gl-spec),transparent 55%),var(--gl);border:1px solid var(--gl-edge);
  -webkit-backdrop-filter:blur(var(--gl-blur)) saturate(190%);backdrop-filter:blur(var(--gl-blur)) saturate(190%);
  box-shadow:inset 0 1px 0 var(--gl-hi),inset 0 -1px 0 var(--gl-lo),0 12px 32px var(--gl-shadow)}
.glass-pop{position:relative;background:radial-gradient(120% 80% at 0% 0%,var(--gl-spec),transparent 55%),var(--gl-pop);border:1px solid var(--gl-edge);
  -webkit-backdrop-filter:blur(calc(var(--gl-blur) + 6px)) saturate(190%);backdrop-filter:blur(calc(var(--gl-blur) + 6px)) saturate(190%);
  box-shadow:inset 0 1px 0 var(--gl-hi),inset 0 -1px 0 var(--gl-lo),0 24px 60px var(--gl-shadow)}
.gi{position:relative;transition:transform .35s var(--gl-spring),background .2s,box-shadow .2s}
.gi:hover{background-color:var(--gl2)}
.gi:active{transform:scale(.97)}

/* кнопки */
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--text2);flex:none;transition:background .2s,color .2s,transform .35s var(--gl-spring)}
.ibtn:hover{background:var(--gl-card2);color:var(--text)}
.ibtn:active{transform:scale(.92)}
.ibtn.danger:hover{background:var(--danger-bg);color:var(--danger)}
.btn{height:38px;padding:0 18px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--gl-card);border:1px solid var(--gl-edge);box-shadow:inset 0 1px 0 var(--gl-hi);transition:background .2s,transform .35s var(--gl-spring),filter .2s}
.btn .i{font-size:16px}
.btn:hover{background:var(--gl-card2)}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b));color:#fff;border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px color-mix(in srgb,var(--gl-out-b) 38%,transparent)}
.btn.pri:hover{filter:brightness(1.12);background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b))}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent-ink)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.btn.block{width:100%;justify-content:flex-start;padding:0 16px;height:42px}
.btn.sm{height:32px;padding:0 14px;font-size:12.5px}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;height:36px;padding:3px;border-radius:var(--r-pill);background:var(--gl-hov);box-shadow:inset 0 1px 3px var(--gl-lo)}
.seg button{position:relative;z-index:1;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text2);border-radius:var(--r-pill);transition:color .25s;white-space:nowrap}
.seg button.on{color:var(--text)}
.seg button small{font-size:11px;font-weight:600;color:var(--muted)}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:var(--r-pill);background:var(--gl2);box-shadow:inset 0 1px 0 var(--gl-hi),0 2px 8px var(--gl-shadow);transition:left .45s var(--gl-spring),width .45s var(--gl-spring)}
.seg.full{display:grid;width:100%}
.srch{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:var(--r-pill);color:var(--muted);font-size:13px}
.srch .i{font-size:16px}

/* аватарки */
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);text-transform:uppercase}
.av.sm{width:34px;height:34px;font-size:12px}.av.xs{width:28px;height:28px;font-size:11px}
.av.xl{width:104px;height:104px;font-size:34px}.av.lg{width:88px;height:88px;font-size:29px}.av.md{width:72px;height:72px;font-size:24px}
.av.sq{border-radius:26%}
.av .dot{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:var(--presence-online);box-shadow:0 0 0 3px color-mix(in srgb,var(--side-bg) 85%,transparent)}
.av.sm .dot,.av.xs .dot{width:11px;height:11px;box-shadow:0 0 0 2px color-mix(in srgb,var(--side-bg) 85%,transparent)}
.av .dot.away{background:var(--presence-away)}
.tagp{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent-border)}
.on{color:var(--accent-ink)}

/* ── панель управления макетом ── */
.ctl{position:sticky;top:0;z-index:100;display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px;padding:12px 20px;margin:12px 12px 0;border-radius:var(--r-bar)}
.ctl h1{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-right:4px}
.ctl .grp{display:flex;align-items:center;gap:8px}
.ctl .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vdesc{width:100%;font-size:13px;line-height:1.5;color:var(--text2);padding:2px 4px 0}
.vdesc b{color:var(--text)}

/* ── сцена и окно приложения ── */
.stage{padding:16px 12px 40px;display:flex;flex-direction:column;align-items:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.cmpcell{display:flex;flex-direction:column;gap:8px}
.cmpcell h3{font-size:13px;font-weight:700;padding-left:6px}
.holder{position:relative;overflow:hidden;border-radius:30px}
.win{width:1360px;height:860px;position:absolute;left:0;top:0;overflow:hidden;border-radius:30px;background:var(--gl-base);box-shadow:0 0 0 1px rgba(255,255,255,.25),0 40px 90px rgba(20,40,60,.35);transform-origin:top left}
.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85}
.amb i:nth-child(1){width:560px;height:560px;left:380px;top:-160px;background:var(--amb-1)}
.amb i:nth-child(2){width:520px;height:520px;right:-120px;top:120px;background:var(--amb-2)}
.amb i:nth-child(3){width:480px;height:480px;left:120px;bottom:-180px;background:var(--amb-3)}
.amb i:nth-child(4){width:420px;height:420px;right:160px;bottom:-140px;background:var(--amb-4)}
.app{position:absolute;inset:0;padding:12px;display:grid;grid-template-columns:340px 1fr;gap:12px}
.app.withpanel{grid-template-columns:340px 1fr 420px}
.side{border-radius:var(--r-panel);padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.side h2{font-size:20px;font-weight:700;padding:4px 8px}
.crow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-row)}
.crow.sel{background:var(--gl2);box-shadow:inset 0 1px 0 var(--gl-hi)}
.crow b{display:block;font-size:13.5px;font-weight:600}
.crow small{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.chat{border-radius:var(--r-panel);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.chat .hd{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--gl-lo)}
.chat .hd b{font-size:15px;font-weight:700}.chat .hd small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.chat .msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.bub{max-width:420px;padding:9px 14px;border-radius:18px;font-size:13.5px;line-height:1.45;background:var(--gl-in);border:1px solid var(--gl-edge)}
.bub.out{align-self:flex-end;background:linear-gradient(140deg,var(--gl-out-a),var(--gl-out-b));color:#fff;border-color:rgba(255,255,255,.3)}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40}
.pm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;border-radius:var(--r-panel);overflow:hidden;display:flex;flex-direction:column}
.xbtn{position:absolute;top:14px;right:14px;z-index:5}

/* общие блоки профиля */
.card{border-radius:var(--r-card);padding:6px}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px}
.cell .cl{font-size:12px;color:var(--muted);width:92px;flex:none}
.cell .cv{font-size:13.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .ch{color:var(--muted);font-size:15px}
.cell + .cell{border-top:1px solid var(--gl-lo)}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--r-row);transition:background .2s}
.row:hover{background:var(--gl-hov)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.row .role{font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:var(--r-pill);padding:3px 10px}
.row .more{color:var(--muted);font-size:17px;opacity:0;transition:opacity .2s}
.row:hover .more{opacity:1}
.ficon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;color:#fff;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px}
.mgrid i{aspect-ratio:1;border-radius:14px;display:block;position:relative}
.mgrid i.v::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(0,0,0,.45)}
.mgrid i.v::before{content:"";position:absolute;left:50%;top:50%;margin:-6px 0 0 -3px;border-left:11px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;z-index:1}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow:auto;scrollbar-width:thin}
.nm{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--text2);margin-top:3px}
.cname{display:flex;align-items:center;gap:8px}

/* ── Вариант A: два столбца ── */
.pmA{width:900px;height:600px;display:grid;grid-template-columns:310px 1fr}
.pmA .l{padding:22px 18px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--gl-lo);background:var(--gl-card)}
.pmA .who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding-top:6px}
.pmA .who .av{margin-bottom:10px}
.pmA .acts{display:flex;flex-direction:column;gap:8px}
.pmA .r{display:flex;flex-direction:column;min-width:0;min-height:0}
.pmA .rh{display:flex;align-items:center;gap:12px;padding:16px 62px 12px 20px}
.pmA .rb{flex:1;min-height:0;padding:0 14px 14px}

/* ── Вариант B: панель справа ── */
.panelB{border-radius:var(--r-panel);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.panelB .th{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 4px 22px}
.panelB .th b{font-size:15px;font-weight:700}
.panelB .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 20px 4px}
.panelB .hero .av{margin-bottom:10px}
.panelB .ac{display:flex;justify-content:center;gap:10px;padding:14px 16px 6px}
.panelB .ac button{display:flex;flex-direction:column;align-items:center;gap:7px;width:74px;padding:10px 0 9px;border-radius:var(--r-card);font-size:11.5px;font-weight:600;color:var(--text2)}
.panelB .ac button .i{font-size:20px;color:var(--accent-ink)}
.panelB .ac button.d .i{color:var(--danger)}
.panelB .ac button.d{color:var(--danger)}
.panelB .body{flex:1;min-height:0;padding:6px 12px 14px;display:flex;flex-direction:column;gap:10px}

/* ── Вариант C: карточка с обложкой ── */
.pmC{width:500px;height:700px}
.pmC .cover{height:140px;position:relative;flex:none;overflow:hidden}
.pmC .cover::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 20% 0%,rgba(255,255,255,.25),transparent 55%),linear-gradient(0deg,rgba(0,0,0,.18),transparent 60%)}
.pmC .idr{display:flex;align-items:flex-end;gap:16px;padding:0 24px;margin-top:-44px;position:relative;z-index:2}
.pmC .idr .av{box-shadow:0 0 0 5px color-mix(in srgb,var(--side-bg) 92%,transparent),0 10px 24px var(--gl-shadow)}
.pmC .idr .t{padding-bottom:6px;min-width:0}
.pmC .arow{display:flex;gap:8px;align-items:center;padding:16px 24px 6px}
.pmC .arow .btn{flex:1}
.pmC .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 24px 4px}
.pmC .stat{border-radius:var(--r-item);padding:11px 14px;background:var(--gl-card);border:1px solid var(--gl-lo)}
.pmC .stat small{display:block;font-size:11.5px;color:var(--muted)}
.pmC .stat b{display:block;font-size:13.5px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmC .lst{flex:1;min-height:0;padding:6px 14px 16px;display:flex;flex-direction:column;gap:8px}

/* ── Вариант D: широкая шапка и вкладки ── */
.pmD{width:880px;height:640px}
.pmD .hd{display:flex;align-items:center;gap:20px;padding:26px 62px 18px 26px;border-bottom:1px solid var(--gl-lo);background:var(--gl-card)}
.pmD .hd .t{flex:1;min-width:0}
.pmD .hd .ra{display:flex;align-items:center;gap:8px;flex:none}
.pmD .tabs{padding:14px 26px 4px}
.pmD .bd{flex:1;min-height:0;padding:8px 20px 20px;display:grid;grid-template-columns:300px 1fr;gap:14px}
.pmD .bd.one{grid-template-columns:1fr}
.pmD .bd > div{min-height:0;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>

<div class="ctl glass">
  <h1>Окно профиля: варианты</h1>
  <div class="grp"><span class="lbl">Вариант</span><div class="seg" id="segV"></div></div>
  <div class="grp"><span class="lbl">Показать</span><div class="seg" id="segS"></div></div>
  <div class="grp"><span class="lbl">Тема</span><div class="seg" id="segT"></div></div>
  <div class="grp"><button class="btn sm" id="cmp"></button></div>
  <div class="vdesc" id="vdesc"></div>
</div>
<div class="stage" id="stage"></div>

<script>
const ICON = {
  msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',

  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  userPlus:'<path d="M2 21a8 8 0 0 1 13.292-6"/><circle cx="10" cy="8" r="5"/><path d="M19 16v6"/><path d="M22 19h-6"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',

  cam:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  ban:'<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  hash:'<path d="M4 9h16"/><path d="M4 15h16"/><path d="M10 3 8 21"/><path d="M16 3l-2 18"/>',
  userAdd:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
};
const I = n => `<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;
const col = h => `linear-gradient(135deg,hsl(${h} 62% 52%),hsl(${(h + 28) % 360} 68% 40%))`;
const ini = s => s.split(' ').slice(0, 2).map(w => w[0]).join('');

/* ── данные ── */
const PEOPLE = [['Борис Кузнецов', 212, 'владелец', 'в сети'], ['Мария Орлова', 330, 'админ', 'в сети'], ['Дмитрий Волков', 28, '', 'был 12:40'], ['Елена Смирнова', 160, '', 'в сети'], ['Игорь Нестеров', 270, '', 'был вчера'], ['Анна Лебедева', 345, '', 'отошла'], ['Павел Громов', 95, '', 'был 09:10']];
const FILES = [['Макет профиля.fig', '12,4 МБ', 262, 'Борис · вчера'], ['Отчёт за квартал.pdf', '2,1 МБ', 8, 'Мария · 24 окт'], ['Список задач.xlsx', '348 КБ', 140, 'Елена · 22 окт'], ['Релиз-ноты.docx', '96 КБ', 215, 'Дмитрий · 20 окт']];
const LINKS = [['figma.com/file/atlas-ui', 'Макеты интерфейса', 'Борис · сегодня'], ['wiki.team.local/atlas', 'База знаний проекта', 'Мария · 25 окт'], ['github.com/team/atlas', 'Репозиторий', 'Игорь · 21 окт']];
const TOPICS = [['Общие вопросы', 128, '10:42'], ['Анонсы', 41, 'вчера'], ['Дизайн', 96, 'вчера'], ['Разработка', 214, '12:05'], ['Курилка', 530, '12:31'], ['Инфраструктура', 63, '23 окт']];
const MEDIA = [262, 28, 160, 330, 95, 8, 215, 140, 345, 50, 190, 300];
const SUBJ = {
  user:{
    name:'Алиса Иванова', hue:210, kind:'user', sub:'в сети', online:true, tag:'Дизайн',
    acts:[['msg','Написать','pri'], ['userAdd','В контакты',''], ['image','Медиа',''], ['ban','Заблокировать','danger']],
    info:[['Логин','@alice',1], ['Пространство','Команда продукта'], ['В контактах','Нет']],
    tabs:['Общие группы','Медиа','Файлы','Ссылки'], counts:[3, 128, 12, 7], title:'Профиль'
  },
  group:{
    name:'Проект Атлас', hue:160, kind:'group', sub:'14 участников · 9 в сети', online:false, tag:'',
    acts:[['userPlus','Добавить','pri'], ['link','Гость',''], ['bellOff','Без звука',''], ['out','Выйти','danger']],
    info:[['Тип','Группа'], ['Создал','Борис Кузнецов'], ['Создана','12 сентября 2026']],
    tabs:['Участники','Медиа','Файлы','Ссылки'], counts:[14, 342, 38, 21], title:'Группа'
  },
  room:{
    name:'Общий зал', hue:285, kind:'room', sub:'Комната · 128 участников · 41 в сети', online:false, tag:'',
    acts:[['bellOff','Без звука','pri'], ['search','Поиск',''], ['image','Медиа',''], ['out','Выйти','danger']],
    info:[['Тип','Комната с темами'], ['Темы','6'], ['Создана','2 августа 2026']],
    tabs:['Темы','Участники','Медиа','Файлы'], counts:[6, 128, 504, 87], title:'Комната'
  }
};
const VAR = {
  A:['A · Два столбца','<b>Окно в два столбца.</b> Слева личность и действия, справа вкладки и списки. Использует ширину экрана, список участников и медиа видно сразу без прокрутки.'],
  B:['B · Панель справа','<b>Панель справа, как в десктопных мессенджерах.</b> Открывается рядом с чатом и не закрывает его: разговор остаётся перед глазами. Не модальное окно.'],
  C:['C · Карточка с обложкой','<b>Компактная карточка с обложкой.</b> Обложка по цвету, крупная аватарка, плитки сведений, список ниже. Ближе всего к текущему окну, но шире и без мобильных плиток.'],
  D:['D · Широкая шапка и вкладки','<b>Окно с шапкой-полосой и вкладками.</b> Аватарка, имя и действия в одной строке сверху, ниже вкладки «Обзор / участники / медиа / файлы / ссылки» и сведения слева.']
};
const st = { v:'A', s:'user', dark:true, cmp:false, tab:{A:0, B:0, C:0, D:0} };

/* ── части ── */
const avHtml = (S, cls = '') => `<div class="av ${cls} ${S.kind === 'room' ? 'sq' : ''}" style="background:${col(S.hue)}">${S.kind === 'room' ? I('hash') : ini(S.name)}${S.online ? '<span class="dot"></span>' : ''}</div>`;
const personRow = p => `<div class="row"><div class="av sm" style="background:${col(p[1])}">${ini(p[0])}${p[3] === 'в сети' ? '<span class="dot"></span>' : p[3] === 'отошла' ? '<span class="dot away"></span>' : ''}</div><div class="tx"><b>${p[0]}</b><small class="${p[3] === 'в сети' ? 'on' : ''}">${p[3]}</small></div>${p[2] ? `<span class="role">${p[2]}</span>` : ''}<span class="more">${I('more')}</span></div>`;
const groupRow = (n, sub, h, room) => `<div class="row"><div class="av sm ${room ? 'sq' : ''}" style="background:${col(h)}">${room ? I('hash') : ini(n)}</div><div class="tx"><b>${n}</b><small>${sub}</small></div><span class="more" style="opacity:1">${I('chev')}</span></div>`;
const fileRow = f => `<div class="row"><div class="ficon" style="background:${col(f[2])}">${I('file')}</div><div class="tx"><b>${f[0]}</b><small>${f[1]} · ${f[3]}</small></div><span class="more">${I('more')}</span></div>`;
const linkRow = l => `<div class="row"><div class="ficon" style="background:var(--gl-card2);color:var(--accent-ink)">${I('link')}</div><div class="tx"><b>${l[0]}</b><small>${l[1]} · ${l[2]}</small></div><span class="more">${I('more')}</span></div>`;
const topicRow = t => `<div class="row"><div class="ficon" style="background:var(--accent-soft);color:var(--accent-ink)">${I('hash')}</div><div class="tx"><b>${t[0]}</b><small>${t[1]} сообщений · ${t[2]}</small></div><span class="more" style="opacity:1">${I('chev')}</span></div>`;
const mediaGrid = () => `<div class="mgrid">${MEDIA.map((h, i) => `<i class="${i % 5 === 2 ? 'v' : ''}" style="background:${col(h)}"></i>`).join('')}</div>`;
const infoCard = S => `<div class="card glass">${S.info.map(r => `<div class="cell"><span class="cl">${r[0]}</span><span class="cv">${r[1]}</span>${r[2] ? `<span class="ch">${I('copy')}</span>` : ''}</div>`).join('')}</div>`;
function tabBody(S, i) {
  const name = S.tabs[i];
  if (name === 'Участники') return `<div class="srch glass" style="margin:2px 2px 8px">${I('search')}<span>Найти участника</span></div><div class="card glass">${PEOPLE.map(personRow).join('')}</div>`;
  if (name === 'Общие группы') return `<div class="card glass">${groupRow('Проект Атлас', 'Группа · 14 участников', 160) + groupRow('Дизайн-команда', 'Группа · 8 участников', 340) + groupRow('Общий зал', 'Комната · 128 участников', 285, 1)}</div>`;
  if (name === 'Темы') return `<div class="card glass">${TOPICS.map(topicRow).join('')}</div>`;
  if (name === 'Медиа') return `<div class="card glass">${mediaGrid()}</div>`;
  if (name === 'Файлы') return `<div class="card glass">${FILES.map(fileRow).join('')}</div>`;
  return `<div class="card glass">${LINKS.map(linkRow).join('')}</div>`;
}
const tabsSeg = (S, i, extra = '') => `<div class="seg ${extra}" data-seg="1">${'<i class="thumb"></i>'}${S.tabs.map((t, k) => `<button class="${k === i ? 'on' : ''}" data-tab="${k}">${t} <small>${S.counts[k]}</small></button>`).join('')}</div>`;
const btnHtml = (a, cls = '') => `<button class="btn ${a[2]} ${cls}">${I(a[0])}${a[1]}</button>`;

/* ── варианты ── */
function viewA(S) {
  const i = st.tab.A;
  return `<div class="scrim"></div><div class="pm pmA glass-pop">
    <button class="ibtn xbtn gi">${I('x')}</button>
    <div class="l">
      <div class="who">${avHtml(S, 'xl')}<div class="nm">${S.name}</div><div class="sub ${S.online ? 'on' : ''}">${S.sub}</div>${S.tag ? `<div style="margin-top:8px"><span class="tagp">${S.tag}</span></div>` : ''}</div>
      <div class="acts">${S.acts.map(a => btnHtml(a, 'block')).join('')}</div>
      ${infoCard(S)}
    </div>
    <div class="r"><div class="rh">${tabsSeg(S, i)}</div><div class="rb scroll">${tabBody(S, i)}</div></div>
  </div>`;
}
function viewB(S) {
  const i = st.tab.B;
  const ac = S.acts.map(a => `<button class="gi glass ${a[2] === 'danger' ? 'd' : ''}">${I(a[0])}${a[1]}</button>`).join('');
  return `<aside class="panelB glass">
    <div class="th"><b>${S.title}</b><button class="ibtn gi">${I('x')}</button></div>
    <div class="hero">${avHtml(S, 'lg')}<div class="nm" style="font-size:20px">${S.name}</div><div class="sub ${S.online ? 'on' : ''}">${S.sub}</div>${S.tag ? `<div style="margin-top:8px"><span class="tagp">${S.tag}</span></div>` : ''}</div>
    <div class="ac">${ac}</div>
    <div class="body"><div class="scroll" style="flex:1;min-height:0;display:flex;flex-direction:column;gap:10px">
      ${infoCard(S)}${tabsSeg(S, i, 'full')}${tabBody(S, i)}
    </div></div>
  </aside>`;
}
function viewC(S) {
  const i = st.tab.C;
  const stats = S.info.slice(0, 2).concat([[S.tabs[0], S.counts[0]]]).concat([[S.tabs[1], S.counts[1]]]);
  const pr = S.acts[0], rest = S.acts.slice(1, 3), last = S.acts[3];
  return `<div class="scrim"></div><div class="pm pmC glass-pop">
    <div class="cover" style="background:${col(S.hue)}"></div>
    <button class="ibtn xbtn gi glass" style="width:38px;height:38px">${I('x')}</button>
    <div class="idr">${avHtml(S, 'xl')}<div class="t"><div class="nm">${S.name}</div><div class="sub ${S.online ? 'on' : ''}">${S.sub}</div></div></div>
    <div class="arow">${btnHtml(pr)}${rest.map(a => btnHtml(a)).join('')}<button class="ibtn danger gi" style="width:38px;height:38px;border:1px solid var(--gl-edge)" title="${last[1]}">${I(last[0])}</button></div>
    <div class="stats">${stats.map(r => `<div class="stat"><small>${r[0]}</small><b>${r[1]}</b></div>`).join('')}</div>
    <div class="lst"><div style="padding:6px 0 0">${tabsSeg(S, i, 'full')}</div><div class="scroll" style="flex:1;min-height:0">${tabBody(S, i)}</div></div>
  </div>`;
}
function viewD(S) {
  const tabs = ['Обзор'].concat(S.tabs);
  const i = st.tab.D, one = i !== 0;
  const S2 = { ...S, tabs, counts:[''].concat(S.counts) };
  const seg = `<div class="seg" data-seg="1"><i class="thumb"></i>${tabs.map((t, k) => `<button class="${k === i ? 'on' : ''}" data-tab="${k}">${t}${k ? ` <small>${S.counts[k - 1]}</small>` : ''}</button>`).join('')}</div>`;
  const body = !one
    ? `<div class="scroll">${infoCard(S)}</div><div class="scroll">${tabBody({ ...S, tabs:[S.tabs[0]] }, 0)}</div>`
    : `<div class="scroll">${tabBody({ ...S, tabs:[tabs[i]] }, 0)}</div>`;
  const ra = btnHtml(S.acts[0]) + btnHtml(S.acts[1]) + `<button class="ibtn gi glass" title="${S.acts[2][1]}">${I(S.acts[2][0])}</button><button class="ibtn danger gi glass" title="${S.acts[3][1]}">${I(S.acts[3][0])}</button>`;
  return `<div class="scrim"></div><div class="pm pmD glass-pop">
    <button class="ibtn xbtn gi">${I('x')}</button>
    <div class="hd">${avHtml(S, 'lg')}<div class="t"><div class="cname"><div class="nm">${S.name}</div>${S.tag ? `<span class="tagp">${S.tag}</span>` : ''}</div><div class="sub ${S.online ? 'on' : ''}">${S.sub}</div></div><div class="ra">${ra}</div></div>
    <div class="tabs">${seg}</div>
    <div class="bd ${one ? 'one' : ''}">${body}</div>
  </div>`;
}

/* ── окно приложения ── */
const CHATS = [['Алиса Иванова', 210, 'Посмотри макет, когда будет время', 1], ['Проект Атлас', 160, 'Борис: релиз переносим на пятницу', 0], ['Общий зал', 285, 'Мария: всем хорошей недели', 0], ['Дизайн-команда', 340, 'Елена: обновила компоненты', 0], ['Дмитрий Волков', 28, 'Спасибо, принято', 0], ['Анна Лебедева', 345, 'Ок, завтра созвонимся', 0]];
function appWindow(variant, S, scale) {
  const panel = variant === 'B';
  const body = { A:viewA, B:viewB, C:viewC, D:viewD }[variant](S);
  const rows = CHATS.map((c, k) => `<div class="crow ${k === (S.kind === 'user' ? 0 : S.kind === 'group' ? 1 : 2) ? 'sel' : ''}"><div class="av sm ${k === 2 ? 'sq' : ''}" style="background:${col(c[1])}">${k === 2 ? I('hash') : ini(c[0])}</div><div><b>${c[0]}</b><small>${c[2]}</small></div></div>`).join('');
  const chatName = S.name;
  return `<div class="holder" style="width:${1360 * scale}px;height:${860 * scale}px"><div class="win" style="transform:scale(${scale})">
    <div class="amb"><i></i><i></i><i></i><i></i></div>
    <div class="app ${panel ? 'withpanel' : ''}">
      <div class="side glass"><h2>Чаты</h2><div class="srch glass">${I('search')}<span>Поиск</span></div>${rows}</div>
      <div class="chat glass">
        <div class="hd"><div class="av sm ${S.kind === 'room' ? 'sq' : ''}" style="background:${col(S.hue)}">${S.kind === 'room' ? I('hash') : ini(chatName)}</div><div><b>${chatName}</b><small>${S.sub}</small></div></div>
        <div class="msgs"><div class="bub">Привет! Когда сможем обсудить новый вид профиля?</div><div class="bub out">Давай сегодня после обеда, я подготовлю варианты</div><div class="bub">Отлично, жду</div></div>
      </div>
      ${panel ? body : ''}
    </div>
    ${panel ? '' : body}
  </div></div>`;
}

/* ── отрисовка страницы ── */
const seg = (el, items, cur, fn) => {
  el.innerHTML = '<i class="thumb"></i>' + items.map(([k, t]) => `<button class="${k === cur ? 'on' : ''}" data-k="${k}">${t}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => fn(b.dataset.k));
};
function fitThumbs(root) {
  root.querySelectorAll('.seg').forEach(s => {
    const on = s.querySelector('button.on'), th = s.querySelector('.thumb');
    if (on && th) { th.style.left = on.offsetLeft + 'px'; th.style.width = on.offsetWidth + 'px'; }
  });
}
function wireTabs() {
  document.querySelectorAll('.stage [data-seg] button').forEach(b => b.onclick = () => {
    const holder = b.closest('[data-v]');
    st.tab[holder ? holder.dataset.v : st.v] = Number(b.dataset.tab);
    render();
  });
}
function render() {
  document.documentElement.classList.toggle('dark', st.dark);
  seg(document.getElementById('segV'), Object.keys(VAR).map(k => [k, k]), st.v, k => { st.v = k; st.cmp = false; render(); });
  seg(document.getElementById('segS'), [['user', 'Человек'], ['group', 'Группа'], ['room', 'Комната']], st.s, k => { st.s = k; render(); });
  seg(document.getElementById('segT'), [['dark', 'Тёмная'], ['light', 'Светлая']], st.dark ? 'dark' : 'light', k => { st.dark = k === 'dark'; render(); });
  const cb = document.getElementById('cmp'); cb.textContent = st.cmp ? 'Один вариант' : 'Все четыре рядом'; cb.onclick = () => { st.cmp = !st.cmp; render(); };
  document.getElementById('vdesc').innerHTML = st.cmp ? '<b>Сравнение.</b> Четыре варианта для одного и того же вида; нажмите «Один вариант», чтобы рассмотреть крупно.' : VAR[st.v][1];
  const S = SUBJ[st.s], stage = document.getElementById('stage');
  if (st.cmp) {
    const w = Math.floor((innerWidth - 24 - 20) / 2);
    stage.innerHTML = `<div class="cmp">${['A', 'B', 'C', 'D'].map(v => `<div class="cmpcell" data-v="${v}"><h3>${VAR[v][0]}</h3>${appWindow(v, S, w / 1360)}</div>`).join('')}</div>`;
  } else {
    const scale = Math.min((innerWidth - 24) / 1360, (innerHeight - 190) / 860, 1);
    stage.innerHTML = `<div data-v="${st.v}">${appWindow(st.v, S, Math.max(scale, .35))}</div>`;
  }
  fitThumbs(document); wireTabs();
}
addEventListener('resize', render);
document.fonts && document.fonts.ready.then(() => fitThumbs(document));
render();
</script>
</body>
</html>
